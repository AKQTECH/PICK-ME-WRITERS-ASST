// ─── SCENES TAB (DESKTOP) ─────────────────────────────────────────────────────
function ScenesTab({ scenes, setScenes, categoryNames, setCategoryNames }) {
  const CATS = Object.keys(categoryNames);
  const dragIdRef = React.useRef(null);
  const overIdxRef = React.useRef(null);
  const [overIdxDisplay, setOverIdxDisplay] = React.useState(null);
  const [dragOverCat, setDragOverCat] = React.useState(null); // tab drop target
  const [newTitle, setNewTitle] = useState("");
  const [activeCategory, setActiveCategory] = useState(null);
  const [selectedScene, setSelectedScene] = useState(null);
  const [editingCat, setEditingCat] = useState(null);
  const [editingCatVal, setEditingCatVal] = useState("");
  const [addingCat, setAddingCat] = useState(false);
  const [newCatName, setNewCatName] = useState("");

  const addScene = () => {
    if (!newTitle.trim()) return;
    const id = Date.now() + Math.floor(Math.random() * 10000);
    setScenes(prev => [...prev, { id, title: newTitle.trim(), description: "", category: activeCategory || "NEED" }]);
    setNewTitle("");
  };

  const deleteScene = id => {
    setScenes(prev => archiveCardList(prev, id));
    if (selectedScene?.id === id) setSelectedScene(null);
  };

  const saveSceneEdit = (id, title, description, category) => {
    setScenes(prev => prev.map(s =>
      s.id === id ? { ...s, title: title.trim(), description: description.trim(), category } : s
    ));
    setSelectedScene(null);
  };

const viewScenes =
  activeCategory === null
    ? (scenes || [])
    : (scenes || []).filter(s => s && s.category === activeCategory);

  // ── Diagnostic ──────────────────────────────────────────────────────────────
  const _sceneIds = scenes.map(s => String(s.id));
  if (_sceneIds.length !== new Set(_sceneIds).size) {
    console.error('[PICKME] ScenesTab rendered with duplicate scene IDs:', _sceneIds);
  }

  const startEditCat = cat => { setEditingCat(cat); setEditingCatVal(categoryNames[cat] || cat); };
  const saveEditCat = () => {
    if (editingCat && editingCatVal.trim()) setCategoryNames(prev => ({...prev, [editingCat]: editingCatVal.trim()}));
    setEditingCat(null);
  };
  const saveNewCat = () => {
    const name = newCatName.trim();
    if (!name) { setAddingCat(false); setNewCatName(""); return; }
    const key = 'cat_' + Date.now();
    setCategoryNames(prev => ({...prev, [key]: name}));
    setAddingCat(false);
    setNewCatName("");
  };

  return (
    <div>
      {/* ── Input row ── */}
      <div style={{display:"flex",gap:"8px",marginBottom:"14px",alignItems:"center"}}>
        <input
          value={newTitle}
          onChange={e=>setNewTitle(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&addScene()}
          placeholder="New scene title..."
          style={{flex:1,border:"1px solid #FFD4F2",borderRadius:"6px",padding:"5px 12px",fontSize:"0.88em",color:"#e667a6",outline:"none",height:"32px",boxSizing:"border-box",fontFamily:"inherit"}}
        />
        <button onClick={addScene} disabled={!newTitle.trim()}
          style={{background:"#FFF0FA",border:"1px solid #FFD4F2",borderRadius:"6px",padding:"5px 16px",fontSize:"0.88em",fontWeight:800,color:"#e667a6",cursor:newTitle.trim()?"pointer":"default",height:"32px",whiteSpace:"nowrap"}}
        >+ Add</button>
      </div>

      {/* ── Filter tabs — drop targets + double-click to rename ── */}
      <div style={{display:"flex",borderBottom:"2px solid #FFD4F2",marginBottom:"14px",alignItems:"center",gap:0}}>
        <div onClick={()=>setActiveCategory(null)}
          style={{display:"flex",alignItems:"center",fontSize:"2em",fontWeight:700,padding:"5px 12px",cursor:"pointer",color:"#e667a6",borderBottom:activeCategory===null?"2px solid #e667a6":"2px solid transparent",whiteSpace:"nowrap"}}
        >All</div>
        {CATS.map(cat=>(
          <div key={cat}
            onDragOver={e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; setDragOverCat(cat); }}
            onDragLeave={e=>{ if(!e.currentTarget.contains(e.relatedTarget)) setDragOverCat(null); }}
            onDrop={e=>{
              e.preventDefault();
              const fromId=dragIdRef.current;
              setDragOverCat(null); setOverIdxDisplay(null);
              if(!fromId){ dragIdRef.current=null; return; }
              setScenes(prev => {
  const next = prev.map(s =>
    s.id === fromId
      ? { ...s, category: cat || "NEED" }
      : s
  );

  // force new array reference + stable ordering pass
  return [...next];
});
              dragIdRef.current=null;
            }}
            style={{display:"flex",alignItems:"center",fontSize:"2em",fontWeight:700,padding:"5px 12px",cursor:"pointer",
              color:"#e667a6",
              borderBottom:activeCategory===cat||dragOverCat===cat?"2px solid #e667a6":"2px solid transparent",
              background:dragOverCat===cat?"#FFF0FA":"transparent",
              whiteSpace:"nowrap",transition:"background 0.1s"}}
            onClick={()=>setActiveCategory(cat)}
          >
            {editingCat===cat ? (
              <span onClick={e=>e.stopPropagation()} style={{display:"flex",alignItems:"center",gap:"3px"}}>
                <input autoFocus value={editingCatVal} onChange={e=>setEditingCatVal(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter")saveEditCat();if(e.key==="Escape")setEditingCat(null);}}
                  style={{border:"none",borderBottom:"1.5px solid #e667a6",fontSize:"inherit",fontWeight:700,color:"#e667a6",width:"70px",outline:"none",background:"transparent",padding:"1px 2px",fontFamily:"inherit"}}
                />
                <span onClick={saveEditCat} style={{color:"#e667a6",cursor:"pointer",fontSize:"10px",fontWeight:700,marginLeft:"3px"}}>✓</span>
              </span>
            ) : (
              <span onDoubleClick={e=>{e.stopPropagation();startEditCat(cat);}}>{categoryNames[cat]||cat}</span>
            )}
          </div>
        ))}
        {addingCat ? (
          <span style={{display:"flex",alignItems:"center",gap:"3px",padding:"5px 8px"}}>
            <input autoFocus value={newCatName} onChange={e=>setNewCatName(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter")saveNewCat();if(e.key==="Escape"){setAddingCat(false);setNewCatName("");}}}
              placeholder="Name..."
              style={{border:"none",borderBottom:"1.5px solid #e667a6",fontSize:"1.6em",fontWeight:700,color:"#e667a6",width:"130px",outline:"none",background:"transparent",padding:"1px 2px",fontFamily:"inherit"}}
            />
            <span onClick={saveNewCat} style={{color:"#e667a6",cursor:"pointer",fontSize:"11px",fontWeight:700}}>✓</span>
            <span onClick={()=>{setAddingCat(false);setNewCatName("");}} style={{color:"#FFB6D9",cursor:"pointer",fontSize:"11px",fontWeight:700}}>✕</span>
          </span>
        ) : (
          <div onClick={()=>setAddingCat(true)}
            style={{display:"flex",alignItems:"center",fontSize:"2em",fontWeight:700,padding:"5px 12px",cursor:"pointer",color:"#FFB6D9",whiteSpace:"nowrap",userSelect:"none",lineHeight:1}}
            title="Add a new category"
          >+</div>
        )}
      </div>

      {/* ── Card grid ── */}
      {viewScenes.length === 0 ? (
        <div className="empty-state">
          <div className="empty-state-icon"></div>
          <div className="empty-state-text">No scenes yet. Add one above.</div>
        </div>
      ) : (
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:"16px"}}>
          {viewScenes.map((scene,idx)=>{
            const isOver = overIdxDisplay===idx && dragIdRef.current!==scene.id;
            return (
              <div key={scene.id} style={{position:"relative"}}>
                <div style={{position:"absolute",top:"3px",left:"3px",right:"-3px",bottom:"-3px",background:"#FFD4F2",pointerEvents:"none"}}/>
                <div
                  draggable
                  onDragStart={e=>{ dragIdRef.current=scene.id; e.dataTransfer.effectAllowed="move"; }}
                  onDragOver={e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; overIdxRef.current=idx; if(overIdxDisplay!==idx) setOverIdxDisplay(idx); }}
                  onDrop={e=>{
                    e.preventDefault();
                    const fromId=dragIdRef.current;
                    overIdxRef.current=null; setOverIdxDisplay(null);
                    if(!fromId||fromId===scene.id){ dragIdRef.current=null; return; }
                    setScenes(prev=>{
                      const next=[...prev];
                      const fromIdx=next.findIndex(s=>s.id===fromId);
                      const toIdx=next.findIndex(s=>s.id===scene.id);
                      if(fromIdx===-1||toIdx===-1) return prev;
                      const [moved]=next.splice(fromIdx,1);
                      next.splice(toIdx,0,moved);
                      return next;
                    });
                    dragIdRef.current=null;
                  }}
                  onDragEnd={()=>{ dragIdRef.current=null; overIdxRef.current=null; setOverIdxDisplay(null); setDragOverCat(null); }}
                  onClick={()=>setSelectedScene({...scene})}
                  style={{
                    position:"relative",
                    aspectRatio:"1",
                    background:"#fff",
                    borderRadius:"0",
                    padding:"12px 8px 8px",
                    boxSizing:"border-box",
                    cursor:"grab",
                    border:isOver?"1px dashed #FFB6D9":"1px solid #FFD4F2",
                    display:"flex",
                    flexDirection:"column",
                    alignItems:"center",
                    justifyContent:"center",
                    userSelect:"none"
                  }}
                >
                  {/* Drag handle — top left, very faint */}
                  <div style={{position:"absolute",top:"6px",left:"6px",display:"flex",flexDirection:"column",gap:"2px",pointerEvents:"none"}}>
                    <span style={{display:"block",width:"7px",height:"1px",background:"#e667a6",opacity:0.15}}/>
                    <span style={{display:"block",width:"7px",height:"1px",background:"#e667a6",opacity:0.15}}/>
                    <span style={{display:"block",width:"7px",height:"1px",background:"#e667a6",opacity:0.15}}/>
                  </div>
                  {/* Delete × — top right */}
                  <button onClick={e=>{e.stopPropagation();deleteScene(scene.id);}}
                    style={{position:"absolute",top:"4px",right:"5px",background:"none",border:"none",color:"#FFB6D9",cursor:"pointer",fontSize:"0.75em",lineHeight:1,padding:"2px 3px",fontWeight:700}}
                    title="Delete"
                  >×</button>
                  {/* Title */}
                  <div style={{fontWeight:800,fontSize:"0.92em",color:"#e667a6",lineHeight:1.2,overflow:"hidden",textAlign:"center",textTransform:"uppercase",letterSpacing:"0.02em",display:"-webkit-box",WebkitLineClamp:4,WebkitBoxOrient:"vertical"}}>
                    {scene.title}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── Scene detail modal ── */}
      {selectedScene && (
        <SceneModal
          scene={selectedScene}
          categoryNames={categoryNames}
          onSave={saveSceneEdit}
          onDelete={deleteScene}
          onClose={()=>setSelectedScene(null)}
        />
      )}
    </div>
  );
}


// ─── SETTINGS TAB (UPDATED WITH SAVE/LOAD) ────────────────────────────────────


function SettingsTab({
  preproduction,
  notionUrl,
  setNotionUrl,
  songs,
  scenes,
  notecards,
  notes,
  sequences,
  sceneNotes,
  categoryNames,
  setCategoryNames,
  setIdeaCategoryNames,
  setSongs,
  setScenes,
  setNotecards,
  setPreproduction,
  setNotes,
  setSequences,
  setSceneNotes,
  nowState,
  setNowState,
  conversionReport,
  setConversionReport,
  lastSynced,
  setPendingUpdate,
  showToast,
  showAdvancedTabs,
  setShowAdvancedTabs,
  getCoordinatedState,
  waitForLocalSave
}) {
  const [draft, setDraft] = useState(notionUrl);
  const [saved, setSaved] = useState(false);
  const [dataSummary, setDataSummary] = useState("");
  const fileInputRef = useRef(null);
  const [dbxConnected, setDbxConnected] = useState(() => DBX.isConnected());
  const [dbxAccount, setDbxAccount] = useState(() => DBX.account()?.name || null);
  const [dbxSyncing, setDbxSyncing] = useState(false);
  const [dbxMsg, setDbxMsg] = useState("");
  const archivedScenesRef = useRef(null);
  const archivedTasksRef = useRef(null);
  const archivedNotecardsRef = useRef(null);
  const archivedTableRowsRef = useRef(null);
  const archivedTableColumnsRef = useRef(null);
  const archivedProgressScenesRef = useRef(null);
  React.useLayoutEffect(() => {
    if (archivedScenesRef.current) archivedScenesRef.current.open = false;
    if (archivedTasksRef.current) archivedTasksRef.current.open = false;
    if (archivedNotecardsRef.current) archivedNotecardsRef.current.open = false;
    if (archivedTableRowsRef.current) archivedTableRowsRef.current.open = false;
    if (archivedTableColumnsRef.current) archivedTableColumnsRef.current.open = false;
    if (archivedProgressScenesRef.current) archivedProgressScenesRef.current.open = false;
  }, []);
  const archiveBuckets = collectArchiveBuckets(scenes);
  const archivedSceneCards = archiveBuckets.archivedCards.filter(card => card.kind === "SCENE" || card.kind === "TWEAK");
  const archivedTaskRows = archiveBuckets.archivedTaskRows.filter(({ change }) => !change.movedToTable);
  const archivedTableRows = safeArray(scenes).flatMap(card => safeArray(card.cardTable && card.cardTable.rows)
    .filter(row => row.archived).map(row => ({ card, row })));
  const archivedTableColumns = safeArray(scenes).flatMap(card => safeArray(card.cardTable && card.cardTable.columns)
    .filter(column => column.archived).map(column => ({ card, column })));
  const archivedProgressScenes = Object.entries(sequences || {}).filter(([key, value]) =>
    key.startsWith(COMPANION_PROGRESS_EXTRA_PREFIX) && value && typeof value === "object" && value.archived)
    .map(([key, value]) => ({ id:key.slice(COMPANION_PROGRESS_EXTRA_PREFIX.length), title:String(value.title || "Untitled") }));
  const settingsSceneById = new Map(safeArray(scenes).map(scene => [asId(scene.id), scene]));
  const archivedNotecards = safeArray(notecards).filter(card => {
    const scene = settingsSceneById.get(asId(card.sourceSceneId));
    return !scene?.ideaCard && (card.archived || scene?.archived);
  });
  const restoreArchivedScene = (id) => {
    setScenes(prev => safeArray(prev).map(card => asId(card.id) === asId(id) ? touchRecord(normalizeCard(card, 0), restoreFields()) : card));
    setNotecards(previous => safeArray(previous).map(card => asId(card.sourceSceneId) === asId(id) ? touchRecord(card, restoreFields()) : card));
    if (showToast) showToast("Scene restored");
  };
  const restoreArchivedTask = (cardId, changeId) => {
    setScenes(prev => safeArray(prev).map(card => {
      if (asId(card.id) !== asId(cardId)) return card;
      return touchRecord(normalizeCard(card, 0), {
        changes:safeArray(card.changes).map(change => asId(change.id) === asId(changeId) ? touchRecord(change, restoreFields()) : change)
      });
    }));
    if (showToast) showToast("Task restored");
  };
  const restoreArchivedNotecard = id => {
    const sourceId = asId(safeArray(notecards).find(card => asId(card.id) === asId(id))?.sourceSceneId);
    if (sourceId) setScenes(previous => safeArray(previous).map(scene => asId(scene.id) === sourceId ? touchRecord(normalizeCard(scene, 0), restoreFields()) : scene));
    setNotecards(previous => safeArray(previous).map(card => asId(card.id) === asId(id) ? touchRecord(card, restoreFields()) : card));
    if (showToast) showToast("Notecard restored");
  };
  const restoreArchivedTablePart = (cardId, partId, field) => {
    setScenes(previous => safeArray(previous).map(card => {
      if (asId(card.id) !== asId(cardId) || !card.cardTable) return card;
      return touchRecord(normalizeCard(card, 0), { cardTable:{
        ...card.cardTable,
        [field]:safeArray(card.cardTable[field]).map(item => asId(item.id) === asId(partId)
          ? touchRecord(item, restoreFields()) : item)
      } });
    }));
    if (showToast) showToast(field === "rows" ? "Table row restored" : "Table column restored");
  };
  const restoreArchivedProgressScene = id => {
    setSequences(previous => ({ ...(previous || {}), [COMPANION_PROGRESS_EXTRA_PREFIX + id]:{
      ...previous[COMPANION_PROGRESS_EXTRA_PREFIX + id], archived:false
    } }));
    if (showToast) showToast("Progress scene restored");
  };

  useEffect(() => {
    const refresh = () => { setDbxConnected(DBX.isConnected()); setDbxAccount(DBX.account()?.name || null); };
    window.addEventListener("dbxStatusChanged", refresh);
    return () => window.removeEventListener("dbxStatusChanged", refresh);
  }, []);

  const currentState = () => getCoordinatedState() || null;
  const applyState = (state) => {
    const current = loadCanonicalStateFromStorage();
    const normalized = saveCanonicalState(preserveUnversionedNotionUrl(state, current.notionUrl || notionUrl || DEFAULT_NOTION_URL));
    ReactDOM.unstable_batchedUpdates(() => {
      setSongs(activeRecords(normalized.songs));
      setScenes(normalized.scenes);
      setNotecards(normalized.notecards);
      setPreproduction(normalized.preproduction);
      setNotes(activeRecords(normalized.notes));
      setSequences(normalized.sequences);
      setSceneNotes(normalized.sceneNotes);
      setCategoryNames(normalized.categoryNames);
      setIdeaCategoryNames(normalized.ideaCategoryNames);
      setNotionUrl(normalized.notionUrl);
      setDraft(normalized.notionUrl);
      setNowState(normalized.now);
      setConversionReport(normalized.conversionReport);
    });
    return normalized;
  };
  const save = () => {
    setNotionUrl(draft);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };
  const dbxPush = async () => {
    if (!DBX.isConnected()) return;
    setDbxSyncing(true); setDbxMsg("Syncing...");
    try {
      if (!(await waitForLocalSave())) {
        setDbxMsg("Resolve the edit conflict before syncing.");
        return;
      }
      const synced = await syncWithDropbox(loadCanonicalStateFromStorage(), 0);
      setDbxMsg(synced ? "Synced to Dropbox." : "Sync failed. Check connection.");
      setTimeout(() => setDbxMsg(""), 3000);
    } catch(e) {
      console.error("DBX sync failed:", e);
      setDbxMsg("Sync failed. Check connection.");
    } finally {
      setDbxSyncing(false);
    }
  };
  const dbxPull = async () => {
    if (!DBX.isConnected()) return;
    setDbxSyncing(true); setDbxMsg("Checking Dropbox...");
    const pulled = await performDropboxPull();
    setDbxMsg(pulled ? "Dropbox checked and merged." : "Already up to date.");
    setTimeout(() => setDbxMsg(""), 3000);
    setDbxSyncing(false);
  };
  const dbxDisconnect = async () => {
    await DBX.disconnect();
    setDbxConnected(false); setDbxAccount(null); setDbxMsg("Disconnected from Dropbox.");
    setTimeout(() => setDbxMsg(""), 3000);
  };
  const downloadAllData = () => {
    const current = currentState();
    if (!current) return;
    const data = { ...current, exportedAt:new Date().toISOString() };
    downloadJsonFile(data, exportFilename());
    if (showToast) showToast("Download started");
  };
  const downloadBackup = () => {
    const raw = localStorage.getItem(PREUPDATE_BACKUP_KEY);
    if (!raw) { alert("No pre-update backup found in this browser."); return; }
    downloadJsonFile(raw, "pickme_backup_before_script_rail_v2.json");
  };
  const restoreBackup = () => {
    const raw = localStorage.getItem(PREUPDATE_BACKUP_KEY);
    if (!raw) { alert("No pre-update backup found in this browser."); return; }
    if (!confirm("Restore the pre-update backup in this browser? Dropbox will not be updated until you press Sync now.")) return;
    const current = currentState();
    if (!current) return;
    localStorage.setItem("pickme_backup_before_restore_" + Date.now(), JSON.stringify(current));
    window.__pickmeSkipNextDropboxPush = true;
    const parsed = JSON.parse(raw);
    const normalized = normalizeState(parsed);
    applyState(normalized);
    setPendingUpdate({ raw:parsed, state:normalized });
    setDbxMsg("Backup restored locally. Review it before syncing.");
  };
  const reviewDuplicatesAgain = () => {
    const raw = currentState();
    if (!raw) return;
    setPendingUpdate({ raw, state:normalizeState(raw), forceDuplicateReview:true });
  };
  const runChecks = () => {
    const current = currentState();
    if (!current) return;
    const checks = runDataChecks(current);
    const count = Object.values(checks).reduce((sum, value) => sum + (Array.isArray(value) ? value.length : 0), 0);
    setDataSummary(count ? count + " records need review." : "No data problems found.");
  };
  const loadScriptCompanion = () => {
    const companionCards = getInitialSceneCards();
    if (!companionCards.length) {
      alert("No script companion data was found.");
      return;
    }
    if (!confirm("Load the 7/16 script companion into Companion? This replaces the current Companion cards in this browser, but saves a backup first. Songs, playlist notes, and settings stay untouched.")) return;
    const current = currentState();
    if (!current) return;
    localStorage.setItem("pickme_backup_before_script_companion_" + Date.now(), JSON.stringify(current));
    window.__pickmeSkipNextDropboxPush = true;
    const nextScenes = companionCards.map((card, index) => touchRecord(normalizeCard(card, index), { order:index }));
    setScenes(nextScenes);
    setNowState({ cardId:nextScenes[0]?.id || null, subId:null, updatedAt:nowStamp(), updatedBy:getDeviceId() });
    setDataSummary("Loaded " + nextScenes.length + " companion scene cards. A local backup was saved first.");
    if (showToast) showToast("Script companion loaded");
  };
  const handleFileLoad = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = event => {
      try {
        const data = JSON.parse(event.target?.result || "{}");
        if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("That file does not look like Pick Me data.");
        const normalized = data.schemaVersion >= 2 ? normalizeState(data) : migrateStateToV2(normalizeState(data));
        applyState(normalized);
        scheduleDropboxPush();
        alert("Data loaded. Songs: " + normalized.songs.length + ", Cards: " + normalized.scenes.length + ", Notes: " + normalized.notes.length + ".");
      } catch(err) {
        console.error("Load error:", err);
        alert("Error loading file: " + err.message);
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  };
  return (
    <div className="settings-section">
      <div className="section-title">Settings</div>
      <div className="settings-field">
        <label>Notion destination URL</label>
        <input type="url" value={draft} onChange={e => setDraft(e.target.value)} placeholder="https://www.notion.so/your-page-id" />
        <div className="settings-hint">When you click Copy & Open Notion, your notes are copied to clipboard and this page opens in a new tab.</div>
      </div>
      <button className="btn btn-primary" onClick={save}>{saved ? "Saved" : "Save Settings"}</button>
      <div className="settings-block">
        <div className="settings-block-title">Display</div>
        <label className="settings-toggle-row" style={{fontSize:"0.92em"}}>
          <input type="checkbox" checked={!!showAdvancedTabs} onChange={e => setShowAdvancedTabs(e.target.checked)} />
          <span>Show advanced organizing screens</span>
        </label>
        <div className="settings-muted-copy" style={{fontSize:"0.82em",marginTop:"8px"}}>Advanced screens stay available, but Companion is the default source of truth.</div>
      </div>
      <div className="settings-block">
        <ClaudeNotesSection showToast={showToast} />
      </div>
      <div className="settings-block">
        <div className="settings-block-title">Archived Companion Items</div>
        <div className="settings-muted-copy">Archived scenes, tasks, notecards, progress scenes, and table content live here.</div>
        {!archivedSceneCards.length && !archivedTaskRows.length && !archivedNotecards.length && !archivedTableRows.length && !archivedTableColumns.length && !archivedProgressScenes.length && <div style={{fontSize:"0.9em",color:"var(--text-light)"}}>Nothing archived yet.</div>}
        {archivedSceneCards.length > 0 && (
          <details ref={archivedScenesRef} style={{marginBottom:"12px"}}>
            <summary style={{cursor:"pointer",fontWeight:800,color:"var(--neon-pink)",fontSize:"0.82em",letterSpacing:"0.06em",textTransform:"uppercase"}}>Archived scenes ({archivedSceneCards.length})</summary>
            <div className="settings-archive-list">
              {archivedSceneCards.map(card => (
                <div key={card.id} className="settings-archive-row">
                  <div className="settings-archive-title">{card.title || "Untitled"}</div>
                  <button className="btn btn-secondary" onClick={() => restoreArchivedScene(card.id)}>Restore</button>
                </div>
              ))}
            </div>
          </details>
        )}
        {archivedTaskRows.length > 0 && (
          <details ref={archivedTasksRef} style={{marginBottom:"12px"}}>
            <summary style={{cursor:"pointer",fontWeight:800,color:"var(--neon-pink)",fontSize:"0.82em",letterSpacing:"0.06em",textTransform:"uppercase"}}>Archived tasks ({archivedTaskRows.length})</summary>
            <div className="settings-archive-list">
              {archivedTaskRows.map(({ card, change }) => (
                <div key={(card.id || "card") + "-" + (change.id || change.text)} className="settings-archive-row is-task">
                  <div>
                    <div className="settings-archive-kicker">{card.title || "Untitled"}</div>
                    <div className="settings-archive-copy">{change.text}</div>
                  </div>
                  <button className="btn btn-secondary" onClick={() => restoreArchivedTask(card.id, change.id)}>Restore</button>
                </div>
              ))}
            </div>
          </details>
        )}
        {archivedProgressScenes.length > 0 && (
          <details ref={archivedProgressScenesRef} style={{marginBottom:"12px"}}>
            <summary style={{cursor:"pointer",fontWeight:800,color:"var(--neon-pink)",fontSize:"0.82em",letterSpacing:"0.06em",textTransform:"uppercase"}}>Archived progress scenes ({archivedProgressScenes.length})</summary>
            <div className="settings-archive-list">
              {archivedProgressScenes.map(scene => <div key={scene.id} className="settings-archive-row">
                <div className="settings-archive-title">{scene.title}</div>
                <button className="btn btn-secondary" onClick={() => restoreArchivedProgressScene(scene.id)}>Restore</button>
              </div>)}
            </div>
          </details>
        )}
        {archivedNotecards.length > 0 && (
          <details ref={archivedNotecardsRef} style={{marginBottom:"12px"}}>
            <summary style={{cursor:"pointer",fontWeight:800,color:"var(--neon-pink)",fontSize:"0.82em",letterSpacing:"0.06em",textTransform:"uppercase"}}>Archived notecards ({archivedNotecards.length})</summary>
            <div className="settings-archive-list">
              {archivedNotecards.map(card => <div key={card.id} className="settings-archive-row">
                <div className="settings-archive-title">{settingsSceneById.get(asId(card.sourceSceneId))?.title || card.title || "Untitled"}</div>
                <button className="btn btn-secondary" onClick={() => restoreArchivedNotecard(card.id)}>Restore</button>
              </div>)}
            </div>
          </details>
        )}
        {archivedTableRows.length > 0 && (
          <details ref={archivedTableRowsRef} style={{marginBottom:"12px"}}>
            <summary style={{cursor:"pointer",fontWeight:800,color:"var(--neon-pink)",fontSize:"0.82em",letterSpacing:"0.06em",textTransform:"uppercase"}}>Removed table rows ({archivedTableRows.length})</summary>
            <div className="settings-archive-list">{archivedTableRows.map(({ card, row }) => <div key={card.id + "-" + row.id} className="settings-archive-row is-task">
              <div><div className="settings-archive-kicker">{card.title || "Untitled"}</div>
                <div className="settings-archive-copy">{Object.values(row.cells || {}).map(value => String(value || "").trim()).filter(Boolean).join(" · ") || "Empty row"}</div></div>
              <button className="btn btn-secondary" onClick={() => restoreArchivedTablePart(card.id, row.id, "rows")}>Restore</button>
            </div>)}</div>
          </details>
        )}
        {archivedTableColumns.length > 0 && (
          <details ref={archivedTableColumnsRef} style={{marginBottom:"12px"}}>
            <summary style={{cursor:"pointer",fontWeight:800,color:"var(--neon-pink)",fontSize:"0.82em",letterSpacing:"0.06em",textTransform:"uppercase"}}>Removed table columns ({archivedTableColumns.length})</summary>
            <div className="settings-archive-list">{archivedTableColumns.map(({ card, column }) => <div key={card.id + "-" + column.id} className="settings-archive-row is-task">
              <div><div className="settings-archive-kicker">{card.title || "Untitled"}</div>
                <div className="settings-archive-copy">{column.label || "Untitled column"}</div></div>
              <button className="btn btn-secondary" onClick={() => restoreArchivedTablePart(card.id, column.id, "columns")}>Restore</button>
            </div>)}</div>
          </details>
        )}
      </div>
      <PPArchives records={preproduction} setRecords={setPreproduction} />
      <div className="settings-block">
        <div className="settings-block-title">Dropbox Sync</div>
        <div className="settings-muted-copy">
          {dbxConnected ? "Connected" : "Connect Dropbox to keep desktop and mobile in sync."}
          {dbxAccount ? " as " + dbxAccount : ""}
          <br /><span style={{color:lastSynced ? "#F2C8DC" : undefined}}>Last synced: {lastSynced ? formatDateShort(Number(lastSynced)) : "Not yet"}</span>
        </div>
        {dbxMsg && <div style={{padding:"8px 12px",background:"#fff3f9",border:"1px solid #fec3e4",borderRadius:"6px",fontSize:"0.85em",marginBottom:"12px"}}>{dbxMsg}</div>}
        <div className="settings-actions">
          {!dbxConnected ? (
            <button className="btn btn-secondary" onClick={() => DBX.startOAuth()}>Connect Dropbox</button>
          ) : (
            <>
              <button className="btn btn-secondary" onClick={dbxPush} disabled={dbxSyncing}>{dbxSyncing ? "Syncing..." : "Sync now"}</button>
              <button className="btn btn-secondary" onClick={dbxPull} disabled={dbxSyncing}>Check Dropbox</button>
              <button className="btn btn-secondary" onClick={dbxDisconnect}>Disconnect</button>
            </>
          )}
        </div>
      </div>
      <div className="settings-block">
        <div className="settings-block-title">Data</div>
        <div className="settings-actions">
          <button className="btn btn-secondary" onClick={downloadAllData}>Export all data</button>
          <button className="btn btn-secondary" onClick={() => fileInputRef.current?.click()}>Import data</button>
          <button className="btn btn-secondary" onClick={loadScriptCompanion}>Load 7/16 script companion</button>
          <button className="btn btn-secondary" onClick={downloadBackup}>Download backup</button>
          <button className="btn btn-secondary" onClick={reviewDuplicatesAgain}>Review duplicate cards again</button>
          <button className="btn btn-secondary" onClick={restoreBackup}>Restore pre-update backup</button>
          <button className="btn btn-secondary" onClick={runChecks}>Data checks</button>
        </div>
        <input ref={fileInputRef} type="file" accept=".json" onChange={handleFileLoad} style={{display:"none"}} />
        {dataSummary && <div style={{marginTop:"12px",fontSize:"0.9em"}}>{dataSummary}</div>}
      </div>
      {conversionReport && (
        <div className="settings-block">
          <div className="settings-block-title">Conversion report</div>
          <div style={{fontSize:"0.88em",lineHeight:1.6}}>
            Source cards: {conversionReport.sourceCardCount}<br />
            Retained as cards: {conversionReport.retainedAsCards}<br />
            Converted to changes: {conversionReport.convertedToChanges}<br />
            Converted to related moments: {conversionReport.convertedToMoments}<br />
            Unmatched titles: {safeArray(conversionReport.unmatchedTitles).length}
          </div>
        </div>
      )}
      <div style={{marginTop:"40px",paddingTop:"20px",borderTop:"1px solid var(--border-pink)",textAlign:"center",color:"#aaa",fontSize:"0.75em",letterSpacing:"0.06em"}}>
        Pick Me Writers Assistant v{APP_VERSION} {APP_BUILD}<br />Built for April Korto Quioh
      </div>
    </div>
  );
}

function DraftNotesTab({ showToast, notes, setNotes }) {
  const formatNotesForDisplay = (notesArray) => {
    if (!Array.isArray(notesArray) || notesArray.length === 0) return "";
    return notesArray
      .map(n => `${n.scene ? n.scene + ": " : ""}${n.content}`)
      .join("\n\n");
  };

  const [isEditing, setIsEditing] = React.useState(false);
  const [editContent, setEditContent] = React.useState(() => {
    const saved = localStorage.getItem("draft-notes");
    if (saved) return saved;
    return formatNotesForDisplay(notes);
  });

  React.useEffect(() => {
    setEditContent(formatNotesForDisplay(notes));
  }, [notes]);

  const handleSave = () => {
    setIsEditing(false);
    showToast("Scene notes saved! 💋");
  };

  const copyToClipboard = () => {
    navigator.clipboard.writeText(editContent).then(() => {
      showToast("Notes copied! 💋");
    });
  };

  return (
    <div>
      <div style={{marginBottom:"22px", display:"flex", gap:"12px"}}>
        <button className="btn btn-secondary" onClick={copyToClipboard}>
          Copy All Notes
        </button>
        {!isEditing ? (
          <button className="btn btn-secondary" onClick={() => setIsEditing(true)}>
            Edit Notes
          </button>
        ) : (
          <>
            <button className="btn btn-primary" onClick={handleSave}>
              ✓ Save Notes
            </button>
            <button className="btn btn-secondary" onClick={() => setIsEditing(false)}>
              ✕ Cancel
            </button>
          </>
        )}
      </div>

      {isEditing ? (
        <textarea
          value={editContent}
          onChange={(e) => setEditContent(e.target.value)}
          style={{
            width:"100%",
            minHeight:"500px",
            padding:"24px",
            fontSize:"0.95em",
            fontFamily:"inherit",
            border:"2px solid #8B0040",
            borderRadius:"4px",
            backgroundColor:"var(--card-bg)",
            color:"var(--text-dark)",
            lineHeight:"1.8",
            resize:"vertical"
          }}
        />
      ) : (
        <div className="draft-content-inner" style={{
          backgroundColor:"var(--card-bg)",
          border:"1px solid var(--border-pink)",
          borderRadius:"4px",
          padding:"24px",
          lineHeight:"1.8",
          fontSize:"0.95em",
          color:"var(--text-dark)",
          whiteSpace:"pre-wrap",
          wordWrap:"break-word"
        }}>
          {editContent || "No notes yet. Click 'Edit Notes' to add your scene notes."}
        </div>
      )}
    </div>
  );
}

function UpdateCardsGate({ pending, onContinue }) {
  const [downloaded, setDownloaded] = React.useState(false);
  if (!pending) return null;
  const source = pending.raw || pending.state;
  const count = safeArray(pending.state && pending.state.scenes).length;
  if (pendingUpdate) return <UpdateCardsGate pending={pendingUpdate} onContinue={completePendingUpdate} />;
  if (duplicateReview) return <DuplicateReviewGate state={duplicateReview} onFinish={finishDuplicateReview} />;

  return (
    <div className="container">
      <div className="card" style={{maxWidth:"760px",margin:"40px auto"}}>
        <div className="section-title">Update your cards</div>
        <p style={{lineHeight:1.6,color:"var(--text-dark)"}}>This version will make a local backup, review duplicate cards, and prepare {count} saved cards for Script Rail.</p>
        <div style={{display:"flex",gap:"10px",flexWrap:"wrap",marginTop:"18px"}}>
          <button className="btn btn-secondary" onClick={() => { downloadJsonFile(source, "pickme_backup_before_script_rail_v2.json"); setDownloaded(true); }}>Download backup</button>
          <button className="btn btn-primary" onClick={() => onContinue(!!downloaded)}>{downloaded ? "Continue" : "Continue without download"}</button>
        </div>
        <p style={{fontSize:"0.84em",color:"var(--text-light)",lineHeight:1.5,marginTop:"14px"}}>A copy is also saved in this browser before any card update runs.</p>
      </div>
    </div>
  );
}

function DuplicateReviewGate({ state, onFinish }) {
  const groups = React.useMemo(() => findDuplicateCardGroups(state), [state]);
  const [choices, setChoices] = React.useState(() => groups.map(group => ({ survivorId: pickDefaultSurvivor(group.cards).id, keepBoth:false })));
  if (!groups.length) {
    return (
      <div className="container">
        <div className="card" style={{maxWidth:"760px",margin:"40px auto"}}>
          <div className="section-title">Review duplicate cards</div>
          <p>No duplicate cards need review.</p>
          <button className="btn btn-primary" onClick={() => onFinish({})}>Continue</button>
        </div>
      </div>
    );
  }
  return (
    <div className="container">
      <div className="card" style={{maxWidth:"980px",margin:"40px auto"}}>
        <div className="section-title">Review duplicate cards</div>
        <p style={{lineHeight:1.6,color:"var(--text-dark)"}}>Choose the card to keep for each group, or keep both when they are truly separate.</p>
        {groups.map((group, groupIndex) => (
          <div key={groupIndex} style={{border:"1px solid var(--border-pink)",padding:"14px",margin:"14px 0",background:"#fff"}}>
            <div style={{fontWeight:800,color:"var(--neon-pink)",marginBottom:"10px"}}>{group.cards[0].title || "Untitled"}</div>
            {group.cards.map(card => (
              <label key={card.id} style={{display:"block",padding:"8px",border:"1px solid #f6d0f6",marginBottom:"8px",cursor:"pointer"}}>
                <input
                  type="radio"
                  checked={choices[groupIndex] && choices[groupIndex].survivorId === card.id && !choices[groupIndex].keepBoth}
                  onChange={() => setChoices(prev => prev.map((choice, i) => i === groupIndex ? { survivorId:card.id, keepBoth:false } : choice))}
                />{" "}
                <strong>{card.id}</strong> - {card.category || card.kind || "card"}
                <div style={{whiteSpace:"pre-wrap",fontSize:"0.88em",marginTop:"6px",color:"var(--text-dark)"}}>{card.description || "No description"}</div>
              </label>
            ))}
            <label style={{fontSize:"0.9em"}}>
              <input
                type="checkbox"
                checked={!!(choices[groupIndex] && choices[groupIndex].keepBoth)}
                onChange={e => setChoices(prev => prev.map((choice, i) => i === groupIndex ? { ...choice, keepBoth:e.target.checked } : choice))}
              /> Keep both
            </label>
          </div>
        ))}
        <button className="btn btn-primary" onClick={() => onFinish(choices)}>Continue</button>
      </div>
    </div>
  );
}

function NowBar({ scenes, setScenes, nowState, setNowState }) {
  const state = normalizeState({ scenes, now: nowState });
  const card = safeArray(state.scenes).find(c => c.id === nowState.cardId);
  if (!card || card.archived) return null;
  const change = safeArray(card.changes).find(c => c.id === nowState.subId) || safeArray(card.changes).find(c => !c.done && !c.archived && !c.maybe);
  const label = change ? (change.verb + ": " + change.text) : (card.status === "done" ? "Complete" : "Card status");
  const done = () => {
    if (change) {
      setScenes(prev => safeArray(prev).map(c => c.id === card.id ? { ...c, changes:safeArray(c.changes).map(ch => ch.id === change.id ? touchRecord(ch, { done:true }) : ch) } : c));
    } else {
      setScenes(prev => safeArray(prev).map(c => c.id === card.id ? touchRecord(c, { status:"done" }) : c));
    }
    setNowState({ cardId:card.id, subId:null, updatedAt:nowStamp(), updatedBy:getDeviceId() });
  };
  return (
    <div style={{position:"sticky",top:0,zIndex:5,background:"#fff",border:"1px solid var(--border-pink)",padding:"10px 12px",display:"flex",gap:"10px",alignItems:"center",justifyContent:"space-between",marginBottom:"14px"}}>
      <div>
        <div style={{fontWeight:800,color:"var(--neon-pink)",fontSize:"0.86em"}}>{card.title}</div>
        <div style={{fontSize:"0.82em",color:"var(--text-dark)"}}>{label}</div>
      </div>
      <div style={{display:"flex",gap:"8px"}}>
        <button className="btn btn-primary" onClick={done}>Done</button>
        <button className="btn btn-secondary" onClick={() => setNowState({ cardId:null, subId:null, updatedAt:nowStamp(), updatedBy:getDeviceId() })}>Clear</button>
      </div>
    </div>
  );
}

function TypePill({ children }) {
  return <span className="type-pill" style={{fontSize:"0.68em",fontWeight:800,letterSpacing:"0.08em",border:"1px solid #eb2e90",color:"#eb2e90",padding:"3px 7px",borderRadius:"999px",whiteSpace:"nowrap"}}>{children}</span>;
}


function seqRank(seq) {
  const index = SEQUENCE_ORDER.indexOf(seq);
  return index === -1 ? 99 : index;
}

function sortSceneCards(list) {
  return [...safeArray(list)].sort((a, b) =>
    (seqRank(a.sequence) - seqRank(b.sequence)) ||
    ((Number.isFinite(Number(a.companionSceneOrder)) && a.companionSceneOrder !== null && a.companionSceneOrder !== undefined) ||
      (Number.isFinite(Number(b.companionSceneOrder)) && b.companionSceneOrder !== null && b.companionSceneOrder !== undefined)
      ? (Number.isFinite(Number(a.companionSceneOrder)) && a.companionSceneOrder !== null && a.companionSceneOrder !== undefined ? Number(a.companionSceneOrder) : Number.MAX_SAFE_INTEGER) -
        (Number.isFinite(Number(b.companionSceneOrder)) && b.companionSceneOrder !== null && b.companionSceneOrder !== undefined ? Number(b.companionSceneOrder) : Number.MAX_SAFE_INTEGER)
      : 0) ||
    ((a.page || 9999) - (b.page || 9999)) ||
    ((a.order || 0) - (b.order || 0)) ||
    String(a.title || "").localeCompare(String(b.title || ""))
  );
}

function cleanCompanionDisplayText(value) {
  return String(value || "")
    .split(/\n+/)
    .map(line => line.trim())
    .filter(line => line && !/^pages?\s*:/i.test(line))
    .filter(line => !/\b\d+(?:\.\d+)?\s*pages?\s*(?:current|target|budget)\b/i.test(line))
    .filter(line => !/\bpage\s*\d+\b/i.test(line))
    .join(" ")
    .replace(/\s+/g, " ")
    .trim();
}

function companionCardSearchText(card) {
  return [
    card && card.title,
    safeArray(card && card.formerTitles).join(" "),
    card && card.description,
    card && card.openQuestions,
    card && card.rippleEffects,
    card && card.storyThreads,
    card && card.kind,
    card && card.status,
    ...safeArray(card && card.changes).map(change => [change.verb, change.text].join(" "))
  ].join(" ");
}

function companionIdeaSearchText(card) {
  const table = card && card.cardTable;
  return [
    card && card.title,
    card && card.description,
    card && card.openQuestions,
    companionSnippet(card),
    ...safeArray(card && card.changes).filter(change => !change.archived).map(change => change.text),
    ...safeArray(table && table.columns).map(column => column.label),
    ...safeArray(table && table.rows).flatMap(row => Object.values(row && row.cells || {}))
  ].join(" ");
}

function newCardTableId(prefix) {
  return prefix + "-" + (window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8));
}

function newCardTable(initialText = "") {

    rows:[{ id:newCardTableId("row"), cells:{ [first]:initialText, [second]:"" }, done:false }]

function cardNotesForTable(card, idea = false) {
  if (idea) return ideaNoteRows(card).filter(note => String(note.text || "").trim());
  const changes = safeArray(card && card.changes).filter(change => !change.archived && String(change.text || "").trim());
  const extra = String(card && card.openQuestions || "").trim();
  return extra ? [...changes, { text:extra, done:false }] : changes;
}

function addNotesToCardTable(table, notes) {
  const base = table || newCardTable();
  const firstColumn = safeArray(base.columns).find(column => !column.archived)?.id;
  if (!firstColumn) return base;
  const converted = safeArray(notes).filter(note => String(note.text || "").trim()).map(note => ({
    id:newCardTableId("row"), cells:{ [firstColumn]:String(note.text).trim() }, done:!!note.done
  }));
  if (!converted.length) return base;
  const rows = safeArray(base.rows);
  const isEmptyStarter = rows.length === 1 && !rows[0].archived && !rows[0].done &&
    !Object.values(rows[0].cells || {}).some(value => String(value || "").trim());
  return { ...base, rows:[...(isEmptyStarter ? [] : rows), ...converted] };
}

function tableOnlyCardPatch(card, idea = false, pendingText = "") {
  const notes = cardNotesForTable(card, idea);
  const pending = String(pendingText || "").trim();
  if (pending) notes.push({ text:pending, done:false });
  if (card.cardTable && !notes.length) return null;
  return {
    cardTable:addNotesToCardTable(card.cardTable, notes),
    changes:safeArray(card.changes).map(change => !change.archived && (idea ? !change.maybe : true)
      ? touchRecord(change, archiveFields({ movedToTable:true })) : change),

}

function useCardTableSizing(table, simple) {
  const editorRef = React.useRef(null);
  const rowMinimums = React.useRef(new Map());
  const cellMinimums = React.useRef(new WeakMap());
  React.useLayoutEffect(() => {
    const root = editorRef.current;
    if (!root) return;
    let frame = null;
    let rootWidth = root.getBoundingClientRect().width;
    const expected = new WeakMap();
    const sharedRow = row => !simple || getComputedStyle(row.querySelector('.idea-table-cells')).gridTemplateColumns.trim().split(/\s+/).length > 1;
    const naturalHeight = cell => {
      const width = cell.getBoundingClientRect().width;
      if (!width) return 0;
      const style = getComputedStyle(cell);
      // Measure an invisible copy so the focused field never collapses or moves the caret.
      const measure = cell.cloneNode(false);
      measure.value = cell.value;
      measure.removeAttribute('aria-label');
      measure.setAttribute('aria-hidden', 'true');
      measure.tabIndex = -1;
      Object.assign(measure.style, { position:'absolute', visibility:'hidden', pointerEvents:'none',
        height:'0px', minHeight:'0px', maxHeight:'none', width:width + 'px', overflow:'hidden', resize:'none' });
      cell.parentElement.appendChild(measure);
      const height = Math.max(parseFloat(style.minHeight) || 0,
        measure.scrollHeight + (parseFloat(style.borderTopWidth) || 0) + (parseFloat(style.borderBottomWidth) || 0));
      measure.remove();
      return Math.ceil(height);
    };
    const sizeRows = () => {
      frame = null;
      root.querySelectorAll('[data-table-row-id]').forEach(row => {
        const cells = Array.from(row.querySelectorAll('textarea'));
        const heights = cells.map(naturalHeight);
        const shared = sharedRow(row);
        const rowHeight = Math.max(rowMinimums.current.get(row.dataset.tableRowId) || 0, ...heights);
        cells.forEach((cell, index) => {
          const height = shared ? rowHeight : Math.max(heights[index], cellMinimums.current.get(cell) || 0);
          if (!height) return;
          expected.set(cell, height);
          if (Math.abs(cell.getBoundingClientRect().height - height) > 0.5) cell.style.height = height + 'px';
        });
      });
    };
    const schedule = () => { if (frame === null) frame = requestAnimationFrame(sizeRows); };
    sizeRows();
    const observer = typeof ResizeObserver === 'function' ? new ResizeObserver(entries => {
      entries.forEach(({ target }) => {
        if (target === root) {
          const width = root.getBoundingClientRect().width;
          if (Math.abs(width - rootWidth) > 0.5) { rootWidth = width; schedule(); }
          return;
        }
        const height = target.getBoundingClientRect().height;
        if (Math.abs(height - (expected.get(target) || height)) <= 1) return;
        const row = target.closest('[data-table-row-id]');
        if (!row) return;
        if (sharedRow(row)) rowMinimums.current.set(row.dataset.tableRowId, height);
        else cellMinimums.current.set(target, height);
        schedule();
      });
    }) : null;
    if (observer) {
      observer.observe(root);
      root.querySelectorAll('textarea').forEach(cell => observer.observe(cell));
    } else window.addEventListener('resize', schedule);
    return () => {
      if (observer) observer.disconnect();
      else window.removeEventListener('resize', schedule);
      if (frame !== null) cancelAnimationFrame(frame);
    };
  }, [table, simple]);
  return editorRef;
}

function tokenizeCompanionSearch(value) {
  return String(value || "")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .match(/[a-z0-9]+/g) || [];
}

function companionSearchMatches(text, query) {
  const queryTokens = tokenizeCompanionSearch(query);
  if (!queryTokens.length) return true;
  const textTokens = new Set(tokenizeCompanionSearch(text));
  return queryTokens.every(token => textTokens.has(token));
}

function companionSceneSearchSources(card) {
  return [
    { label:"Notes", text:String(card.openQuestions || "") },
    ...safeArray(card.changes)
      .filter(change => !change.archived && !change.maybe && !isCompanionReferenceChange(card, change))
      .map(change => ({ label:"Scene change", text:String(change.text || "") }))
  ];
}

function companionSceneSearchText(card) {
  return [card.title || "", ...companionSceneSearchSources(card).map(source => source.text)].join(" ");
}

function companionSceneSearchPreview(card, query) {
  const tokens = tokenizeCompanionSearch(query);
  if (!tokens.length || companionSearchMatches(card.title, query)) return "";
  const sources = companionSceneSearchSources(card);
  const match = sources.find(source => companionSearchMatches(source.text, query)) ||
    sources.find(source => tokens.some(token => tokenizeCompanionSearch(source.text).includes(token)));
  if (!match) return "";
  const text = match.text.replace(/\s+/g, " ").trim();
  return match.label + ": " + (text.length > 160 ? text.slice(0, 160) + "…" : text);
}

function companionIdeaDetailsText(card) {
  const chunks = [];
  const seen = new Set();
  const add = value => {
    const text = String(value || "").trim();
    if (!text) return;
    const comparable = normalizeComparableText(text);
    if (seen.has(comparable)) return;
    seen.add(comparable);
    chunks.push(text);
  };
  add(card && card.description);
  add(card && card.openQuestions);
  add(card && card.rippleEffects);
  add(card && card.storyThreads);
  if (!chunks.length) {
    safeArray(card && card.changes)
      .filter(change => !change.archived && !change.maybe && String(change.text || "").trim())
      .forEach(change => add(change.text));
  }
  return chunks.join("\n\n");
}

function ideaLegacyNoteLines(card) {
  const existing = new Set(safeArray(card && card.changes).filter(change => !change.archived)
    .map(change => normalizeComparableText(change.text)));
  const seenFields = new Set(existing);
  return [card && card.description, card && card.openQuestions, card && card.rippleEffects, card && card.storyThreads]
    .flatMap(value => {
      const text = String(value || "").trim();
      const key = normalizeComparableText(text);
      if (!key || seenFields.has(key)) return [];
      seenFields.add(key);
      return text.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
    });
}

function ideaNoteRows(card) {
  const rows = safeArray(card && card.changes).filter(change => !change.archived && !change.maybe);
  return [...rows, ...ideaLegacyNoteLines(card).map((text, index) => ({ id:"idea-legacy-" + asId(card.id) + "-" + index, text, done:false }))];

    }, changes.length + index, card.id)))],

  };
}

function normalizeIdeaBucket(value) {
  const raw = String(value || "").trim().toLowerCase();
  if (!raw || raw === "all") return "all";
  if (raw === "maybe" || raw === "?" || raw === "candidate") return "maybe";
  if (raw === "new" || raw === "new_scene" || raw === "later") return "new";
  if (raw === "need" || raw === "needs" || raw === "completed" || raw === "next" || raw === "edit" || raw === "scene_change") return "need";
  if (raw === "cut" || raw === "x") return "cut";
  return null;
}

function inferIdeaBucket(card) {
  const legacy = normalizeIdeaBucket(card && card.category);
  if (legacy) return legacy;
  if (card && card.maybe) return "maybe";
  const text = companionCardSearchText(card).toLowerCase();
  if (normalizeStatus(card && card.status) === "cut" || /\b(cut|delete|remove|drop|lose|kill)\b/.test(text)) return "cut";
  if (/\b(new scene|new beat|new bridge|add scene|not in the draft|not on the page|unwritten)\b/.test(text)) return "new";
  if (/\b(next|place it|placement tbd|somewhere|candidate|later|maybe|potential)\b/.test(text)) return "maybe";
  if (/\b(need|needs|question|decide|answer|blocks|blocked|figure out|clarify)\b/.test(text)) return "need";
  if (normalizeKind(card && card.kind) === "TWEAK" || safeArray(card && card.changes).length || /\b(adjust|rewrite|move|replace|change|trim|tighten|restore|thread|plant)\b/.test(text)) return "need";
  return "maybe";
}

function ideaBucketLabel(bucketId) {

  return bucket ? bucket.label : "MAYBE";
}

function companionSnippet(card) {
  const table = card && card.cardTable;
  const visibleColumns = safeArray(table && table.columns).filter(column => column && !column.archived).slice(0, 3);
  const tablePreview = safeArray(table && table.rows)
    .filter(row => row && !row.archived)
    .map(row => visibleColumns.map((column, index) => {
      const value = cleanCompanionDisplayText(row.cells && row.cells[column.id]);
      return value ? (column.label || "Column " + (index + 1)) + ": " + value : "";
    }).filter(Boolean).join(" · "))
    .filter(Boolean).slice(0, 2).join(" / ");
  const cleaned = tablePreview || (table && visibleColumns.map((column, index) => column.label || "Column " + (index + 1)).join(" · ")) || cleanCompanionDisplayText(card && (
    card.description ||
    card.openQuestions ||
    card.rippleEffects ||
    card.storyThreads ||
    safeArray(card.changes).find(change => !change.archived && !change.maybe && String(change.text || "").trim())?.text ||
    ""
  ));
  return cleaned ? cleaned.slice(0, 190) + (cleaned.length > 190 ? "..." : "") : "";
}


function reorderSceneNotecards(orderedSceneIds, notecards, setNotecards, setScenes) {
  const positions = new Map(orderedSceneIds.map((id, index) => [asId(id), index]));
  setNotecards(previous => safeArray(previous).map(card => positions.has(asId(card.sourceSceneId))
    ? touchRecord(card, { order:positions.get(asId(card.sourceSceneId)) }) : card));
  setScenes(previous => safeArray(previous).map(scene => positions.has(asId(scene.id))
    ? touchRecord(scene, { companionSceneOrder:positions.get(asId(scene.id)) }) : scene));
}

function seedSceneNotecards(scenes, setNotecards) {
  const eligible = sortSceneCards(safeArray(scenes).filter(scene =>
    !scene.archived && !scene.ideaCard && !scene.maybe && ["SCENE", "TWEAK"].includes(scene.kind) &&
    (scene.sequence || scene.notecardScene || asId(scene.id).startsWith("scene-from-"))
  ));
  setNotecards(previous => {
    const known = new Set(safeArray(previous).map(card => asId(card.sourceSceneId)));
    const missing = eligible.filter(scene => !known.has(asId(scene.id)));
    if (!missing.length) return previous;
    return [...safeArray(previous), ...missing.map((scene, index) => normalizeNotecard({
      id:"notecard-scene-" + asId(scene.id), sourceSceneId:asId(scene.id), linked:true,
      order:safeArray(previous).length + index, createdAt:nowStamp()
    }, safeArray(previous).length + index))];
  });
}

    .map(([key, value]) => ({ id:key.slice(COMPANION_PROGRESS_EXTRA_PREFIX.length), title:String(value.title || "Untitled"),
      createdAt:Number(value.createdAt || 0) }))
    .sort((a, b) => a.createdAt - b.createdAt);
  const combined = [...draftOne, ...extras];
  const byId = new Map(combined.map(row => [row.id, row]));
  const savedOrder = Array.isArray(stored[COMPANION_PROGRESS_ORDER_KEY]) ? stored[COMPANION_PROGRESS_ORDER_KEY] : [];
  const orderedIds = new Set();
  const ordered = savedOrder.map(id => byId.get(asId(id))).filter(row => {
    if (!row || orderedIds.has(row.id)) return false;
    orderedIds.add(row.id);
    return true;
  });
  return [...ordered, ...combined.filter(row => !orderedIds.has(row.id))];
}

function companionProgressNumbers(row, sequences) {
  const currentRaw = sequences && sequences[COMPANION_PROGRESS_CURRENT_PREFIX + row.id];
  const goalRaw = sequences && sequences[COMPANION_PROGRESS_GOAL_PREFIX + row.id];
  const parse = value => value === undefined || value === null || value === "" ? null : Number(value);
  const current = parse(currentRaw);
  const goal = parse(goalRaw);
  return {
    currentRaw:currentRaw === undefined || currentRaw === null ? "" : currentRaw,
    goalRaw:goalRaw === undefined || goalRaw === null ? "" : goalRaw,
    current:Number.isFinite(current) && current >= 0 ? current : null,
    goal:Number.isFinite(goal) && goal >= 0 ? goal : null
  };
}

function companionProgressSceneStatus(row, sequences) {
  const { current, goal } = companionProgressNumbers(row, sequences);
  if (current === null || goal === null) return "not-set";
  return current === goal ? "complete" : "needs-edits";
}

function reorderCompanionProgressRows(rows, visibleRows, sourceId, targetId, setSequences) {
  const visibleIds = visibleRows.map(row => row.id);
  const from = visibleIds.indexOf(sourceId);
  const to = visibleIds.indexOf(targetId);
  if (from < 0 || to < 0 || from === to) return;
  visibleIds.splice(to, 0, visibleIds.splice(from, 1)[0]);
  const visibleSet = new Set(visibleIds);
  let nextVisible = 0;
  const order = rows.map(row => visibleSet.has(row.id) ? visibleIds[nextVisible++] : row.id);
  setSequences(previous => ({ ...(previous || {}), [COMPANION_PROGRESS_ORDER_KEY]:order }));
}

function companionPageLabel(value) {
  return value === null ? "—" : String(Number(value.toFixed(2)));
}

function companionPageDifference(current, goal) {
  if (current === null || goal === null) return "—";
  const difference = Number((goal - current).toFixed(2));
  return (difference > 0 ? "+" : "") + companionPageLabel(difference) + (Math.abs(difference) === 1 ? " page" : " pages");
}

function companionTotalPageGoal(sequences) {
  const total = companionProgressRows(sequences).reduce((sum, row) =>
    sum + (companionProgressNumbers(row, sequences).goal ?? 0), 0);
  return Number(total.toFixed(10));
}

function companionScriptProgress(sequences) {
  const current = getStoredNumber(sequences, "_pageCurrent", null);
  const goal = companionTotalPageGoal(sequences);
  if (current === null || goal === null || goal <= 0) return { percent:null, label:"—", cuts:0, adds:0 };
  let cuts = 0;
  let adds = 0;
  let comparedScenes = 0;
  companionProgressRows(sequences).forEach(row => {
    const values = companionProgressNumbers(row, sequences);
    if (values.current === null || values.goal === null) return;
    comparedScenes += 1;
    cuts += Math.max(0, values.current - values.goal);
    adds += Math.max(0, values.goal - values.current);
  });
  if (!comparedScenes) return { percent:null, label:"—", cuts:0, adds:0 };
  // Scene counts are rounded; measure their remaining work without forcing them to match the actual script total.
  cuts = Number(cuts.toFixed(10));
  adds = Number(adds.toFixed(10));
  const remaining = Number((cuts + adds).toFixed(2));
  const percent = remaining === 0 ? 100 : current <= 0 ? 0 : Math.min(99, Math.max(0, Math.round(100 * (current - remaining) / current)));
  const pageCount = (value, action) => companionPageLabel(value) + (value === 1 ? " page to be " : " pages to be ") + action;
  const detail = remaining === 0 ? "" : " (" + pageCount(cuts, "cut") + ", " + pageCount(adds, "added") + ")";
  return { percent, label:percent + "%" + detail, cuts, adds };
}

function CompanionProgressMini({ rows, sequences, selectedId, onSelect }) {
  const selected = rows.find(row => row.id === selectedId);
  const values = selected ? companionProgressNumbers(selected, sequences) : null;
  return <div className="companion-progress-mini">
    <div className="companion-progress-select-wrap"><select aria-label="Choose progress scene" value={selected ? selected.id : ""} onChange={event => onSelect(event.target.value)}>
      <option value="">Choose scene</option>
      {rows.map(row => <option key={row.id} value={row.id}>{row.title}</option>)}
    </select><span aria-hidden="true">⌄</span></div>
    {selected && <table aria-label={"Page progress for " + selected.title}>
      <thead><tr><th scope="col">Current</th><th scope="col">Goal</th><th scope="col">Change</th></tr></thead>
      <tbody><tr><td>{companionPageLabel(values.current)}</td><td>{companionPageLabel(values.goal)}</td>
        <td>{companionPageDifference(values.current, values.goal)}</td></tr></tbody>
    </table>}
  </div>;
}

function NotecardsWorkspace({ scenes, setScenes, notecards, setNotecards, sequences, showToast, focusedId, setFocusedId, onTurnIntoIdea, syncLabel, syncError }) {
  const [newTitle, setNewTitle] = React.useState("");
  const [selectedProgressId, setSelectedProgressId] = React.useState("");
  const [titleDrafts, setTitleDrafts] = React.useState({});
  const [changeDrafts, setChangeDrafts] = React.useState({});
  const [dropTargetId, setDropTargetId] = React.useState(null);
  const draggedId = React.useRef(null);
  const [editingChangeId, setEditingChangeId] = React.useState(null);
  const [dropChangeId, setDropChangeId] = React.useState(null);
  const bulletPointerRef = React.useRef(null);
  const suppressBulletClickRef = React.useRef(false);
  const openFocusedDetails = React.useCallback(element => {
    if (element && focusedId) element.open = true;
  }, [focusedId]);
  const sizeNote = element => {
    if (!element) return;
    element.style.height = "auto";
    element.style.height = element.scrollHeight + "px";
  };

  React.useEffect(() => {
    const unlinked = safeArray(notecards).filter(card => !card.linked);
    if (unlinked.length) {
      setScenes(previous => {
        const next = safeArray(previous).slice();
        const positions = new Map(next.map((scene, index) => [asId(scene.id), index]));
        unlinked.forEach(card => {
          const sourceId = asId(card.sourceSceneId) || ("scene-from-" + asId(card.id));
          const position = positions.get(sourceId);
          if (position === undefined) {
            positions.set(sourceId, next.length);
            next.push(touchRecord(normalizeCard({
              id:sourceId, title:card.title || "Untitled scene", kind:"SCENE", notecardScene:true, status:card.done ? "done" : "todo",
              sequence:null, companionSceneOrder:card.order, openQuestions:card.notes || "",
              changes:safeArray(card.changes), archived:!!card.archived, archivedAt:card.archivedAt || null
            }, next.length)));
            return;
          }
          const scene = next[position];
          const newerText = Number(card.updatedAt || 0) > Number(scene.updatedAt || 0);
          const mergedChanges = mergeArraysById(scene.changes, card.changes, (change, index) => normalizeChange(change, index, sourceId));
          next[position] = touchRecord(normalizeCard(scene, position), {
            ...(newerText ? { title:card.title || scene.title, openQuestions:card.notes, rippleEffects:"", storyThreads:"" } : {}),
            changes:mergedChanges,
            ...(card.done ? { status:"done" } : {}),
            ...(card.archived ? archiveFields() : {})
          });
        });
        return next;
      });
      setNotecards(previous => safeArray(previous).map(card => !card.linked
        ? touchRecord(card, { linked:true, sourceSceneId:asId(card.sourceSceneId) || ("scene-from-" + asId(card.id)) }) : card));
      return;
    }
    seedSceneNotecards(scenes, setNotecards);
  }, [scenes, notecards, setScenes, setNotecards]);

  const sceneById = new Map(safeArray(scenes).map(scene => [asId(scene.id), scene]));
  const visible = safeArray(notecards).map(meta => {
    const scene = sceneById.get(asId(meta.sourceSceneId));
    return scene && !scene.ideaCard ? { ...meta, title:scene.title, sequence:scene.sequence, notes:scene.openQuestions || "", changes:scene.changes, cardTable:scene.cardTable, done:normalizeStatus(scene.status) === "done", archived:!!scene.archived } : null;
  }).filter(card => card && !card.archived)
    .sort((a, b) => Number(a.order || 0) - Number(b.order || 0) || String(a.title || "").localeCompare(String(b.title || "")));
  const progressRows = companionProgressRows(sequences);
  const patchScene = (id, update) => setScenes(previous => safeArray(previous).map(scene =>
    asId(scene.id) === asId(id) ? touchRecord(normalizeCard(scene, 0), typeof update === "function" ? update(scene) : update) : scene
  ));
  const commitTitle = card => {
    if (!Object.prototype.hasOwnProperty.call(titleDrafts, card.id)) return;
    const clean = String(titleDrafts[card.id] || "").trim().replace(/\s+/g, " ");
    if (clean) patchScene(card.sourceSceneId, { title:clean });
    else if (showToast) showToast("Notecard name cannot be blank");
    setTitleDrafts(previous => { const next = { ...previous }; delete next[card.id]; return next; });
  };
  const createCard = () => {
    const title = newTitle.trim().replace(/\s+/g, " ");
    if (!title) return;
    const id = "notecard-" + (window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8));
    const sceneId = "scene-from-" + id;
    const card = touchRecord(normalizeNotecard({ id, sourceSceneId:sceneId, linked:true, order:safeArray(notecards).length, createdAt:nowStamp() }, safeArray(notecards).length));
    setScenes(previous => [...safeArray(previous), touchRecord(normalizeCard({ id:sceneId, title, kind:"SCENE", notecardScene:true, status:"todo", sequence:null, openQuestions:"", changes:[] }, safeArray(previous).length))]);
    setNotecards(previous => [...safeArray(previous), card]);
    setNewTitle("");
    if (showToast) showToast("Notecard added");
  };
  const addChange = card => {
    const text = String(changeDrafts[card.id] || "").trim();
    if (!text) return;
    const id = "notecard-change-" + (window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8));
    patchScene(card.sourceSceneId, current => ({ changes:[...safeArray(current.changes), touchRecord(normalizeChange({ id, text, source:"COMPANION_USER", isRewriteTask:true }, safeArray(current.changes).length, current.id))] }));
    setChangeDrafts(previous => ({ ...previous, [card.id]:"" }));
  };
  const reorderChanges = (card, sourceId, targetId) => {
    if (asId(sourceId) === asId(targetId)) return;
    patchScene(card.sourceSceneId, current => {
      const changes = safeArray(current.changes);
      const active = changes.filter(change => !change.archived);
      const from = active.findIndex(change => asId(change.id) === asId(sourceId));
      const to = active.findIndex(change => asId(change.id) === asId(targetId));
      if (from < 0 || to < 0) return {};
      active.splice(to, 0, active.splice(from, 1)[0]);
      let nextActive = 0;
      const ordered = changes.map(change => change.archived ? change : active[nextActive++]);
      return { changes:ordered.map((change, index) => touchRecord(change, { notecardOrder:index })) };
    });
  };
  const startBulletDrag = (event, changeId) => {
    if (APP_BUILD !== "DESKTOP" || event.button !== 0 || editingChangeId === changeId || event.target.closest("button, input")) return;
    bulletPointerRef.current = { pointerId:event.pointerId, sourceId:changeId, startX:event.clientX, startY:event.clientY, targetId:null, dragging:false };
  };
  const moveBulletDrag = event => {
    const drag = bulletPointerRef.current;
    if (!drag || drag.pointerId !== event.pointerId) return;
    if (!drag.dragging && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 7) return;
    if (!drag.dragging) event.currentTarget.setPointerCapture(event.pointerId);
    drag.dragging = true;
    event.preventDefault();
    const target = document.elementFromPoint(event.clientX, event.clientY)?.closest("[data-notecard-change-id]");
    drag.targetId = target && target.closest(".notecard-change-list") === event.currentTarget.closest(".notecard-change-list") ? target.dataset.notecardChangeId : null;
    setDropChangeId(drag.targetId && drag.targetId !== drag.sourceId ? drag.targetId : null);
    if (event.clientY > window.innerHeight - 48) window.scrollBy(0, 18);
    else if (event.clientY < 48) window.scrollBy(0, -18);
  };
  const endBulletDrag = (event, card) => {
    const drag = bulletPointerRef.current;
    if (!drag || drag.pointerId !== event.pointerId) return;
    bulletPointerRef.current = null;
    setDropChangeId(null);
    if (!drag.dragging) return;
    event.preventDefault();
    suppressBulletClickRef.current = true;
    if (document.activeElement && document.activeElement.matches("textarea")) document.activeElement.blur();
    if (drag.targetId && drag.targetId !== drag.sourceId) reorderChanges(card, drag.sourceId, drag.targetId);
    setTimeout(() => { suppressBulletClickRef.current = false; }, 0);
  };
  const reorder = (sourceId, targetId) => {
    const ids = visible.map(card => asId(card.id));
    const from = ids.indexOf(asId(sourceId));
    const to = ids.indexOf(asId(targetId));
    if (from < 0 || to < 0 || from === to) return;
    ids.splice(to, 0, ids.splice(from, 1)[0]);
    const sceneByCard = new Map(visible.map(card => [asId(card.id), asId(card.sourceSceneId)]));
    reorderSceneNotecards(ids.map(id => sceneByCard.get(id)), notecards, setNotecards, setScenes);
  };

  const focused = visible.find(card => asId(card.id) === asId(focusedId));
  React.useEffect(() => {
    if (focused) setSelectedProgressId(asId(focused.sourceSceneId));
  }, [focusedId]);
  React.useEffect(() => {
    if (!focused || !focused.cardTable) return;
    const scene = sceneById.get(asId(focused.sourceSceneId));
    if (!scene || !cardNotesForTable(scene).length) return;
    setScenes(previous => safeArray(previous).map(item => {
      if (asId(item.id) !== asId(scene.id)) return item;
      const patch = tableOnlyCardPatch(item);
      return patch ? touchRecord(normalizeCard(item, 0), patch) : item;
    }));
  }, [focusedId, focused && focused.cardTable, focused && focused.changes, focused && focused.notes]);
  const focusedBullets = focused ? (focused.cardTable
    ? safeArray(focused.cardTable.rows).filter(row => !row.archived).map(row => safeArray(focused.cardTable.columns)
      .filter(column => !column.archived).map(column => String(row.cells && row.cells[column.id] || "").trim()).filter(Boolean).join(" - "))
    : [...safeArray(focused.changes).filter(change => !change.archived).map(change => String(change.text || "").trim()), String(focused.notes || "").trim()]
  ).filter(Boolean) : [];
  const copyFocusedBullets = async () => {
    if (!focusedBullets.length) return;
    const text = focusedBullets.map(item => "- " + item.replace(/^[\s\u2022-]+/, "").replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/[\u2013\u2014\u2022]/g, "-").replace(/\u2026/g, "...").replace(/\u00a0/g, " ").replace(/\r\n?/g, "\n").replace(/\n/g, "\n  ")).join("\n");
    let copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        copied = true;
      }
    } catch (error) { /* The local desktop file may not have Clipboard API permission. */ }
    if (!copied) {
      const field = document.createElement("textarea");
      field.value = text;
      field.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
      document.body.appendChild(field);
      field.select();
      try { copied = document.execCommand("copy"); } catch (error) { copied = false; }
      field.remove();
    }
    if (showToast) showToast(copied ? "Bullets copied" : "Could not copy bullets");
  };
  const displayed = focusedId ? (focused ? [focused] : []) : visible;
  const openCount = visible.filter(card => !card.done).length;
  const completedCount = visible.length - openCount;
  const focusedChecksLeft = focused ? safeArray(focused.cardTable ? focused.cardTable.rows : focused.changes)
    .filter(item => !item.archived && !item.done).length : 0;
  const focusedCountLabel = focused && focused.cardTable
    ? focusedChecksLeft + (focusedChecksLeft === 1 ? " check left" : " checks left")
    : focusedChecksLeft + (focusedChecksLeft === 1 ? " note left" : " notes left");
  const scriptProgress = companionScriptProgress(sequences);
  const archiveCard = card => {
    patchScene(card.sourceSceneId, archiveFields());
    setNotecards(previous => safeArray(previous).map(item => asId(item.id) === asId(card.id) ? touchRecord(item, archiveFields()) : item));
    setFocusedId(null);
  };

  return <section className={"notecards-workspace" + (focusedId ? " is-focused" : "")} aria-label="Notecards">
    <div className="notecards-toolbar">
      {focusedId ? <button type="button" className="notecard-back" onClick={() => setFocusedId(null)}>← Notecards</button> : <h2>Notecards</h2>}

        <div role="status" className={"notecards-sync-status" + (syncError ? " is-error" : "")}>{syncLabel}</div>
        <span className="notecards-count" aria-live="polite">{focusedId ? focusedCountLabel : <>{openCount} open, {completedCount} completed</>}</span>
        {!focusedId && <details className="notecards-progress-toggle">

          <div className="notecards-script-progress" aria-label="Whole script progress">
            <span>{scriptProgress.label}</span>
            <span className="companion-progress-meter" aria-hidden="true"><span style={{width:(scriptProgress.percent === null ? 0 : Math.min(100, scriptProgress.percent)) + "%"}} /></span>
          </div>
        </details>}
      </div>
    </div>
    {focusedId && <aside className="notecard-progress-side" aria-label="Scene page progress">
      <h3>Progress</h3>
      <CompanionProgressMini rows={progressRows} sequences={sequences} selectedId={selectedProgressId} onSelect={setSelectedProgressId} />
    </aside>}
    {!focusedId && <div className="notecards-new">
      <input value={newTitle} onChange={event => setNewTitle(event.target.value)}
        onKeyDown={event => { if (event.key === "Enter" && !event.nativeEvent.isComposing) createCard(); }}

      {displayed.map(card => <article key={card.id} className={"notecard" + (card.done ? " is-complete" : "") + (dropTargetId === card.id ? " is-drop-target" : "")}
        data-notecard-id={card.id}
