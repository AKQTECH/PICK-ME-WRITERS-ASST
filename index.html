        onDragOver={event => { if (draggedId.current && draggedId.current !== card.id) { event.preventDefault(); setDropTargetId(card.id); } }}
        onDragLeave={event => { if (!event.currentTarget.contains(event.relatedTarget)) setDropTargetId(null); }}
        onDrop={event => { event.preventDefault(); if (draggedId.current) reorder(draggedId.current, card.id); draggedId.current = null; setDropTargetId(null); }}>
        <div className="notecard-top">
        <input className="notecard-title" value={Object.prototype.hasOwnProperty.call(titleDrafts, card.id) ? titleDrafts[card.id] : card.title}
          onChange={event => {
            const value = event.target.value;
            setTitleDrafts(previous => ({ ...previous, [card.id]:value }));
            if (value.trim()) patchScene(card.sourceSceneId, { title:value.trim().replace(/\s+/g, " ") });
          }}
          onBlur={() => commitTitle(card)} onKeyDown={event => { if (event.key === "Enter") { event.preventDefault(); event.currentTarget.blur(); } }}
          aria-label={"Notecard title " + card.title} />
        <div className="notecard-actions">
          {!focusedId && <button type="button" className="notecard-icon-button notecard-open" onClick={() => setFocusedId(card.id)}
            title="Open notecard" aria-label={"Open notecard " + card.title}>{"\u2192"}</button>}
          {focusedId && !card.cardTable && <button type="button" className="card-table-corner" onClick={() => {
            patchScene(card.sourceSceneId, current => tableOnlyCardPatch(current, false, changeDrafts[card.id]));
            setChangeDrafts(previous => ({ ...previous, [card.id]:"" }));
          }}
            title="Add table" aria-label={"Add table to " + card.title}>+ Table</button>}
          <label className="notecard-complete-label" title="Mark notecard complete">
            <input type="checkbox" className="notecard-complete" checked={!!card.done}
              onChange={event => patchScene(card.sourceSceneId, { status:event.target.checked ? "done" : "needs_edits" })} aria-label={"Mark notecard complete " + card.title} />
          </label>
          <div className="notecard-archive-stack">
            {APP_BUILD === "DESKTOP" && focusedId && <button type="button" className="notecard-icon-button notecard-copy-button"
              onClick={copyFocusedBullets} disabled={!focusedBullets.length} title="Copy all bullets"
              aria-label={"Copy all bullets from " + card.title}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <rect x="8" y="8" width="11" height="12" rx="1" />
                <path d="M16 8V5a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h2" />
              </svg>
            </button>}
            <button type="button" className="notecard-icon-button" onClick={() => archiveCard(card)}
              title="Archive notecard" aria-label={"Archive notecard " + card.title}>
              <ArchiveTrayIcon size={18} />
            </button>
          </div>
          <span className="notecard-drag" role="button" tabIndex="0" draggable="true" title="Drag to reorder notecard" aria-label={"Drag to reorder " + card.title}
            onDragStart={event => { draggedId.current = card.id; event.dataTransfer.setData("text/plain", card.id); event.dataTransfer.effectAllowed = "move"; }}
            onDragEnd={() => { draggedId.current = null; setDropTargetId(null); }}>{"\u22EE\u22EE"}</span>
        </div>
        </div>
        {card.cardTable ? (focusedId
          ? <CardTableEditor table={card.cardTable} onChange={change => patchScene(card.sourceSceneId, current => ({ cardTable:change(current.cardTable) }))} />
          : <details className="notecard-details notecard-table-details"><summary>Details</summary><NotecardTablePreview table={card.cardTable} /></details>
        ) : <details key={focusedId ? "focused-" + card.id : "board-" + card.id} className="notecard-details" ref={openFocusedDetails}>
          <summary>Notes</summary>
        <ul className="notecard-change-list">{safeArray(card.changes).filter(change => !change.archived).map(change => <li key={change.id} data-notecard-change-id={change.id}
          className={"notecard-change-row" + (change.done ? " is-done" : "") + (editingChangeId === change.id ? " is-editing" : "") + (dropChangeId === change.id ? " is-drop-target" : "")}
          onPointerDown={event => startBulletDrag(event, change.id)}
          onPointerMove={moveBulletDrag}
          onPointerUp={event => endBulletDrag(event, card)}
          onPointerCancel={() => { bulletPointerRef.current = null; setDropChangeId(null); }}>
          {focusedId ? <label className="notecard-change-check" title="Mark scene change complete">
            <input type="checkbox" className="notecard-change-done" checked={!!change.done}
              onChange={event => patchScene(card.sourceSceneId, current => applyChangeDone(current, change.id, event.target.checked))}
              aria-label={"Mark scene change complete " + (change.text || "note")} />
          </label> : <span className="notecard-bullet" aria-hidden="true">{"\u2022"}</span>}
          <textarea value={change.text || ""} rows={1} ref={sizeNote} onClick={event => { if (suppressBulletClickRef.current) { event.preventDefault(); return; } setEditingChangeId(change.id); }} onBlur={() => setEditingChangeId(null)}
            onChange={event => { const value = event.target.value; sizeNote(event.target); patchScene(card.sourceSceneId, current => ({ changes:safeArray(current.changes).map(item => asId(item.id) === asId(change.id) ? touchRecord(item, { text:value }) : item) })); }}

            onKeyDown={event => { if (event.key === "Enter" && !event.nativeEvent.isComposing) addChange(card); }}
            placeholder="Add note" aria-label={"Add notecard change to " + card.title} />
          <button type="button" disabled={!String(changeDrafts[card.id] || "").trim()} onClick={() => addChange(card)} aria-label={"Save notecard change to " + card.title}>+</button>

        {focusedId && <button type="button" className="notecard-to-idea" onClick={() => {

        }}>Turn into idea</button>}
      </article>)}
    </div> : <div className="notecard-empty">{focusedId ? "This scene is no longer available." : "No notecards yet."}</div>}

}

function CompanionProgressWorkspace({ sequences, setSequences, showToast, initialSceneId }) {
  const [newTitle, setNewTitle] = React.useState("");
  const [titleDrafts, setTitleDrafts] = React.useState({});
  const [pageColumns, setPageColumns] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("pickme_progress_page_columns") || "null");
      const current = saved?.current !== false;
      const goal = saved?.goal !== false;
      return current || goal ? { current, goal } : { current:true, goal:true };
    } catch { return { current:true, goal:true }; }
  });
  React.useEffect(() => { saveUiPreference("pickme_progress_page_columns", JSON.stringify(pageColumns)); }, [pageColumns]);
  const showCurrent = pageColumns.current;
  const showGoal = pageColumns.goal;
  const showDifference = showCurrent && showGoal;
  const [differenceFilter, setDifferenceFilter] = React.useState("all");
  const [selectedIds, setSelectedIds] = React.useState(initialSceneId ? [initialSceneId] : null);
  const [dropId, setDropId] = React.useState(null);
  const draggedId = React.useRef(null);
  const rows = companionProgressRows(sequences);
  const selectedSet = selectedIds === null ? null : new Set(selectedIds);
  const shown = rows.filter(row => {
    if (selectedSet && !selectedSet.has(row.id)) return false;
    const values = companionProgressNumbers(row, sequences);
    if (differenceFilter === "unset") return values.current === null || values.goal === null;
    if (values.current === null || values.goal === null) return differenceFilter === "all";
    const delta = values.goal - values.current;
    return differenceFilter === "all" || (differenceFilter === "cut" && delta < 0) ||
      (differenceFilter === "add" && delta > 0) || (differenceFilter === "target" && delta === 0);
  });
  const scriptCurrentRaw = sequences && sequences._pageCurrent !== undefined && sequences._pageCurrent !== null ? sequences._pageCurrent : "";
  const scriptProgress = companionScriptProgress(sequences);
  const totalPageGoal = companionTotalPageGoal(sequences);
  const setScriptPageValue = (key, minimum, value) => {
    if (value !== "" && (!Number.isFinite(Number(value)) || Number(value) < minimum)) return;
    setSequences(previous => ({ ...(previous || {}), [key]:value }));
  };
  const setPageValue = (id, prefix, value) => {
    if (value !== "" && (!Number.isFinite(Number(value)) || Number(value) < 0)) return;
    setSequences(previous => ({ ...(previous || {}), [prefix + id]:value }));
  };
  const addScene = () => {
    const title = newTitle.trim().replace(/\s+/g, " ");
    if (!title) return;
    if (rows.some(row => row.title.toLocaleLowerCase() === title.toLocaleLowerCase())) {
      if (showToast) showToast("That scene is already in Progress");
      return;
    }
    const id = newCardTableId("progress-scene");
    setSequences(previous => ({ ...(previous || {}), [COMPANION_PROGRESS_EXTRA_PREFIX + id]:{
      id, title, createdAt:nowStamp(), archived:false
    } }));
    setNewTitle("");
    setDifferenceFilter("all");
    setSelectedIds(null);
  };
  const commitTitle = row => {
    if (!Object.prototype.hasOwnProperty.call(titleDrafts, row.id)) return;
    const title = String(titleDrafts[row.id] || "").trim().replace(/\s+/g, " ");
    if (title && !rows.some(other => other.id !== row.id && other.title.toLocaleLowerCase() === title.toLocaleLowerCase())) {
      setSequences(previous => ({ ...(previous || {}), [COMPANION_PROGRESS_EXTRA_PREFIX + row.id]:{
        ...(previous[COMPANION_PROGRESS_EXTRA_PREFIX + row.id] || {}), title
      } }));
    } else if (showToast) showToast(title ? "That scene name is already in use" : "Scene name cannot be blank");
    setTitleDrafts(previous => { const next = { ...previous }; delete next[row.id]; return next; });
  };
  const toggleScene = id => {
    const next = selectedIds === null ? rows.map(row => row.id) : selectedIds.slice();
    const index = next.indexOf(id);
    if (index >= 0) next.splice(index, 1);
    else next.push(id);
    setSelectedIds(next.length === rows.length ? null : next);
  };
  const toggleExtraArchived = (id, archived) => {
    const scene = rows.find(row => row.id === id) || COMPANION_PROGRESS_DRAFT_ONE_SCENES.find(row => row.id === id);
    setSequences(previous => ({ ...(previous || {}), [COMPANION_PROGRESS_EXTRA_PREFIX + id]:{
      ...(previous[COMPANION_PROGRESS_EXTRA_PREFIX + id] || {}), id,
      title:previous[COMPANION_PROGRESS_EXTRA_PREFIX + id]?.title || scene?.title || "Untitled", archived
    } }));
  };
  const reorderRows = (sourceId, targetId) => {
    reorderCompanionProgressRows(rows, shown, sourceId, targetId, setSequences);
  };
  const moveRow = (id, step) => {
    const index = shown.findIndex(row => row.id === id);
    if (index >= 0 && shown[index + step]) reorderRows(id, shown[index + step].id);
  };
  return <section className="companion-progress-workspace" aria-label="Companion progress">
    <div className="companion-progress-head"><h2>Progress</h2><span>{shown.length} {shown.length === 1 ? "scene" : "scenes"}</span></div>
    <div className="companion-script-total" aria-label="Whole script progress">
      <strong className="companion-script-progress-label">{scriptProgress.label}</strong>
      <span className="companion-progress-meter" aria-hidden="true"><span style={{width:(scriptProgress.percent === null ? 0 : scriptProgress.percent) + "%"}} /></span>
      <details className="companion-script-page-settings">
        <summary>{scriptCurrentRaw === "" ? "Set current pages" : "Current " + scriptCurrentRaw} · Goal {totalPageGoal}</summary>
        <div className="companion-script-page-fields">
          <label>Current pages<input type="number" min="0" step="any" inputMode="decimal" value={scriptCurrentRaw}
            onChange={event => setScriptPageValue("_pageCurrent", 0, event.target.value)} aria-label="Whole script current pages" /></label>
          <div className="companion-script-goal-field"><span>Page goal</span><output aria-label="Whole script page goal">{totalPageGoal}</output></div>
        </div>
      </details>
    </div>
    <div className="companion-progress-tools">
      <div className="companion-progress-column-toggles" role="group" aria-label="Page columns">
        <label><input type="checkbox" checked={showCurrent} disabled={!showGoal}
          onChange={event => setPageColumns(previous => ({ ...previous, current:event.target.checked }))} />Current</label>
        <label><input type="checkbox" checked={showGoal} disabled={!showCurrent}
          onChange={event => setPageColumns(previous => ({ ...previous, goal:event.target.checked }))} />Goal</label>
      </div>
      <div className="companion-progress-filters">
        <details className="companion-progress-scene-filter"><summary>{selectedIds === null ? "All scenes" : selectedIds.length + " selected"}</summary>
          <div className="companion-progress-filter-options">
            <label><input type="checkbox" checked={selectedIds === null} onChange={() => setSelectedIds(selectedIds === null ? [] : null)} />All scenes</label>
            {rows.map(row => <label key={row.id}><input type="checkbox" checked={selectedIds === null || selectedSet.has(row.id)} onChange={() => toggleScene(row.id)} />{row.title}</label>)}
          </div>
        </details>
        <div className="companion-progress-select-wrap companion-progress-change-filter">
          <select value={differenceFilter} onChange={event => setDifferenceFilter(event.target.value)} aria-label="Filter page difference">
            <option value="all">All changes</option><option value="cut">Needs cuts</option><option value="add">Needs pages</option>
            <option value="target">On target</option><option value="unset">Missing pages</option>
          </select><span aria-hidden="true">⌄</span>
        </div>
      </div>
    </div>
    {shown.length ? <div className="companion-progress-table-wrap"><table className="companion-progress-table" data-page-columns={showDifference ? "both" : showCurrent ? "current" : "goal"}>
      <thead><tr><th scope="col">Scene</th>
        {showCurrent && <th scope="col" className="companion-progress-count-column">Current</th>}
        {showGoal && <th scope="col" className="companion-progress-count-column">Goal</th>}
        {showDifference && <th scope="col" className="companion-progress-change-column">Change needed</th>}</tr></thead>
      <tbody>{shown.map((row, rowIndex) => {
        const values = companionProgressNumbers(row, sequences);
        return <tr key={row.id} data-progress-id={row.id} className={dropId === row.id ? "is-drop-target" : ""}
          onDragOver={event => { if (draggedId.current && draggedId.current !== row.id) { event.preventDefault(); setDropId(row.id); } }}
          onDragLeave={event => { if (!event.currentTarget.contains(event.relatedTarget)) setDropId(null); }}
          onDrop={event => { event.preventDefault(); if (draggedId.current) reorderRows(draggedId.current, row.id); draggedId.current = null; setDropId(null); }}>
          <td data-label="Scene"><div className="companion-progress-scene-cell">
            <span className="companion-progress-drag" role="button" tabIndex="0" draggable="true"
              title="Drag to reorder scene" aria-label={"Drag to reorder " + row.title}
              onDragStart={event => { draggedId.current = row.id; event.dataTransfer.setData("text/plain", row.id); event.dataTransfer.effectAllowed = "move"; }}
              onDragEnd={() => { draggedId.current = null; setDropId(null); }}
              onKeyDown={event => { if (event.key === "ArrowUp" || event.key === "ArrowDown") { event.preventDefault(); moveRow(row.id, event.key === "ArrowUp" ? -1 : 1); } }}>{"\u22EE\u22EE"}</span>
            <input className="companion-progress-title-input" value={Object.prototype.hasOwnProperty.call(titleDrafts, row.id) ? titleDrafts[row.id] : row.title}
              onChange={event => setTitleDrafts(previous => ({ ...previous, [row.id]:event.target.value }))}
              onBlur={() => commitTitle(row)} onKeyDown={event => { if (event.key === "Enter") event.currentTarget.blur(); if (event.key === "Escape") setTitleDrafts(previous => { const next = { ...previous }; delete next[row.id]; return next; }); }}
              aria-label={"Progress scene title for " + row.title} />
            <button type="button" className="companion-progress-archive" onClick={() => toggleExtraArchived(row.id, true)} title="Archive progress scene" aria-label={"Archive progress scene " + row.title}><ArchiveTrayIcon size={16} /></button>
            <span className="companion-progress-mobile-order">
              <button type="button" disabled={rowIndex === 0} onClick={() => moveRow(row.id, -1)} aria-label={"Move " + row.title + " up"}>↑</button>
              <button type="button" disabled={rowIndex === shown.length - 1} onClick={() => moveRow(row.id, 1)} aria-label={"Move " + row.title + " down"}>↓</button>
            </span>
          </div></td>
          {showCurrent && <td data-label="Current"><input type="number" min="0" step="any" inputMode="decimal" value={values.currentRaw}
            onChange={event => setPageValue(row.id, COMPANION_PROGRESS_CURRENT_PREFIX, event.target.value)} aria-label={"Current pages for " + row.title} /></td>}
          {showGoal && <td data-label="Goal"><input type="number" min="0" step="any" inputMode="decimal" value={values.goalRaw}
            onChange={event => setPageValue(row.id, COMPANION_PROGRESS_GOAL_PREFIX, event.target.value)} aria-label={"Goal pages for " + row.title} /></td>}
          {showDifference && <td data-label="Change needed" className="companion-progress-difference">{companionPageDifference(values.current, values.goal)}</td>}
        </tr>;
      })}</tbody>
      {showGoal && <tfoot><tr><th scope="row">Total page goal</th>
        {showCurrent && <td className="companion-progress-footer-spacer"></td>}
        <td className="companion-progress-goal-total" aria-live="polite">{Number(totalPageGoal.toFixed(10)).toLocaleString("en-US", { maximumFractionDigits:10 })}</td>
        {showDifference && <td className="companion-progress-footer-spacer"></td>}</tr></tfoot>}
    </table></div> : <div className="companion-progress-empty">{rows.length ? "No scenes match this view." : "No scenes yet."}</div>}
    <div className="companion-progress-add"><input value={newTitle} onChange={event => setNewTitle(event.target.value)}
      onKeyDown={event => { if (event.key === "Enter" && !event.nativeEvent.isComposing) addScene(); }}
      placeholder="New scene title" aria-label="New progress scene title" />
      <button type="button" disabled={!newTitle.trim()} onClick={addScene}>+ Scene</button></div>
  </section>;
}

function ScriptCompanionTab({ scenes, setScenes, notecards, setNotecards, sequences, setSequences, ideaCategoryNames, setIdeaCategoryNames, showToast, syncLabel, syncError }) {
  const [sequenceFilter, setSequenceFilter] = React.useState(() => {
    const stored = localStorage.getItem("pickme_companion_sequence_focus");

  });

  const [progressFocusSceneId, setProgressFocusSceneId] = React.useState(null);
  const [sequenceView, setSequenceView] = React.useState("pick");
  const [ideaSearch, setIdeaSearch] = React.useState("");
  const [ideaTypeFilters, setIdeaTypeFilters] = React.useState(() => [...IDEA_FILTER_TYPES]);

  const [tableSort, setTableSort] = React.useState("sequence_status");
  const [tableSortDirection, setTableSortDirection] = React.useState("asc");
  const [titleDrafts, setTitleDrafts] = React.useState({});
  const [ideaDetailDrafts, setIdeaDetailDrafts] = React.useState({});
  const [changeDrafts, setChangeDrafts] = React.useState({});
  const [noteDrafts, setNoteDrafts] = React.useState({});
  const [newChangeDrafts, setNewChangeDrafts] = React.useState({});
  const [sequenceNameDraft, setSequenceNameDraft] = React.useState("");
  const [draftSceneTitle, setDraftSceneTitle] = React.useState("");
  const [draftIdeaTitle, setDraftIdeaTitle] = React.useState("");
  const [draftIdeaDetails, setDraftIdeaDetails] = React.useState("");
  const [draftIdeaNotes, setDraftIdeaNotes] = React.useState([]);
  const [ideaNoteDrafts, setIdeaNoteDrafts] = React.useState({});
  const [draftIdeaTypes, setDraftIdeaTypes] = React.useState([]);
  const [draftIdeaHasTable, setDraftIdeaHasTable] = React.useState(false);
  const [draftIdeaTable, setDraftIdeaTable] = React.useState(null);
  const [isCreatingIdea, setIsCreatingIdea] = React.useState(false);
  const newScenePanelRef = React.useRef(null);
  const sceneSwitcherRef = React.useRef(null);
  const quickSceneSwitcherRef = React.useRef(null);
  const sceneTitleRef = React.useRef(null);
  const newIdeaPanelRef = React.useRef(null);
  const ideaDetailSaveTimers = React.useRef({});
  const changeSaveTimers = React.useRef({});
  const changeResizeStarts = React.useRef({});
  const noteSaveTimers = React.useRef({});
  const draggedChangeId = React.useRef(null);
  const [dropTargetId, setDropTargetId] = React.useState(null);


  const state = normalizeState({ scenes, sequences });
  const activeSequenceOrder = getActiveSequenceOrder(state.sequences);
  const companionCards = sortSceneCards(state.scenes.filter(card => !card.archived && (card.kind === "SCENE" || card.kind === "TWEAK")));
  const sequencedCards = companionCards.filter(card => activeSequenceOrder.includes(card.sequence) && !card.maybe);
  const ideaCards = companionCards.filter(card =>
    !activeSequenceOrder.includes(card.sequence) && !card.notecardScene &&
    (card.ideaCard || !asId(card.id).startsWith("scene-from-"))
  ).sort((a, b) => Number(b.ideaConvertedAt || b.createdAt || 0) - Number(a.ideaConvertedAt || a.createdAt || 0));
  const ideaTypes = companionIdeaTypes(ideaCategoryNames, ideaCards);
  const ideaFilterTypes = [...ideaTypes.map(type => type.id), "unsorted"];
  const orderedIdeaCards = ideaLayout === "board" ? [...ideaCards].sort((a, b) => {
    const aOrder = a.ideaBoardOrder === null || a.ideaBoardOrder === undefined ? null : Number(a.ideaBoardOrder);
    const bOrder = b.ideaBoardOrder === null || b.ideaBoardOrder === undefined ? null : Number(b.ideaBoardOrder);
    if (Number.isFinite(aOrder) && Number.isFinite(bOrder)) return aOrder - bOrder;
    if (Number.isFinite(aOrder)) return 1;
    if (Number.isFinite(bOrder)) return -1;
    return Number(b.ideaConvertedAt || b.createdAt || 0) - Number(a.ideaConvertedAt || a.createdAt || 0);
  }) : ideaCards;
  const counts = {};
  activeSequenceOrder.forEach(seq => counts[seq] = 0);
  sequencedCards.forEach(card => {
    counts[card.sequence] += 1;
  });
  const firstFocusedSequence = activeSequenceOrder.find(seq => counts[seq] > 0) || activeSequenceOrder[0] || "";
  const effectiveSequenceFilter = activeSequenceOrder.includes(sequenceFilter) ? sequenceFilter : firstFocusedSequence;
  const currentSequenceTitle = effectiveSequenceFilter ? getSequenceTitle(state.sequences, effectiveSequenceFilter) : "";
  const isMenuMode = companionMode === "menu";
  const isSequenceMode = companionMode === "sequence";
  const isIdeasMode = companionMode === "ideas";
  const isNotecardsMode = companionMode === "notecards";
  const isSceneListMode = companionMode === "scene-list";
  const isProgressMode = companionMode === "progress";
  const filtered = sequencedCards.filter(card => card.sequence === effectiveSequenceFilter);
  const tableStatusOrder = { done:0, needs_edits:1, todo:2, drafted:2, cut:3 };
  const sceneOrderIndex = new Map(sequencedCards.map((card, index) => [asId(card.id), index]));
  const tableCards = sequencedCards.filter(card =>
    (tableSequence === "all" || card.sequence === tableSequence) &&
    (tableStatus === "all" || (tableStatus === "todo" ? ["todo", "drafted"].includes(normalizeStatus(card.status)) : normalizeStatus(card.status) === tableStatus)) &&
    companionSearchMatches(companionSceneSearchText(card), tableSearch)
  ).sort((left, right) => {
    const direction = tableSortDirection === "asc" ? 1 : -1;
    const titleComparison = String(left.title || "").localeCompare(String(right.title || ""), undefined, { numeric:true });
    const sceneComparison = sceneOrderIndex.get(asId(left.id)) - sceneOrderIndex.get(asId(right.id));
    if (tableSort === "sequence" || tableSort === "sequence_status") {
      const sequenceComparison = activeSequenceOrder.indexOf(left.sequence) - activeSequenceOrder.indexOf(right.sequence);
      if (sequenceComparison) return sequenceComparison;
      const statusComparison = (tableStatusOrder[normalizeStatus(left.status)] ?? 9) - (tableStatusOrder[normalizeStatus(right.status)] ?? 9);
      return ((tableSort === "sequence_status" ? statusComparison : 0) || sceneComparison || titleComparison) * direction;
    }

    setSequenceView("scene");
    if (showToast) showToast("Assigned to " + getSequenceTitle(state.sequences, sequence));
  };
  const turnIdeaIntoNotecard = card => {
    const id = asId(card.id);
    const title = String(titleDraftValueFor(card) || "").trim().replace(/\s+/g, " ");
    if (!title) { if (showToast) showToast("Idea name cannot be blank"); return; }
    const pendingNote = String(ideaNoteDrafts[id] || "").trim();
    clearIdeaDetailTimer(id);
    setScenes(previous => safeArray(previous).map(scene => {
      if (asId(scene.id) !== id) return scene;
      const materialized = materializeIdeaNotes(normalizeCard(scene, 0));
      const changes = pendingNote ? [...materialized.changes, newIdeaNote(pendingNote)] : materialized.changes;
      return touchRecord(normalizeCard(scene, 0), scene.ideaCard ? {
          ...materialized, changes,
          title, ideaCard:false, notecardScene:scene.ideaReturnNotecardScene !== undefined ? !!scene.ideaReturnNotecardScene : true,
          sequence:asId(scene.ideaReturnSequence), ideaReturnSequence:null, ideaReturnNotecardScene:null,
          kind:scene.ideaReturnKind || "SCENE", ideaReturnKind:null
        } : {
          ...materialized, changes, title,
          kind:"SCENE", notecardScene:true, status:"todo", sequence:null
        });
    }));
    const existing = safeArray(notecards).find(meta => asId(meta.sourceSceneId) === id);
    const notecardId = existing ? existing.id : "notecard-idea-" + id;
    if (!existing) setNotecards(previous => [...safeArray(previous), touchRecord(normalizeNotecard({
      id:notecardId, sourceSceneId:id, linked:true, order:safeArray(previous).length, createdAt:nowStamp()
    }, safeArray(previous).length))]);
    setTitleDrafts(previous => { const next = { ...previous }; delete next[id]; return next; });
    setIdeaDetailDrafts(previous => { const next = { ...previous }; delete next[id]; return next; });
    setIdeaNoteDrafts(previous => { const next = { ...previous }; delete next[id]; return next; });
    setActiveId(null);
    setFocusedNotecardId(null);
    setCompanionMode("ideas");
    if (showToast) showToast("Idea turned into a notecard");
  };
  const archiveIdeaCard = (cardId) => {
    if (!cardId) return;
    patchCard(cardId, archiveFields());
    setActiveId(null);
    if (showToast) showToast("Idea archived");
  };
  const turnNotecardIntoIdea = card => {
    const id = asId(card.sourceSceneId);
    if (!id || !scenes.some(scene => asId(scene.id) === id)) return;
    setScenes(previous => safeArray(previous).map(scene => asId(scene.id) === id
      ? touchRecord(normalizeCard(scene, 0), {
          ideaCard:true, ideaReturnSequence:scene.sequence || null,
          ideaReturnNotecardScene:!!scene.notecardScene, ideaReturnKind:scene.kind,
          notecardScene:false, ideaConvertedAt:nowStamp(), sequence:null
        }) : scene));
    setFocusedNotecardId(null);
    setCompanionMode("ideas");
    setActiveId(id);
    if (showToast) showToast("Moved to Ideas");
  };
  const reorderIdeas = (sourceId, targetId) => {
    const ids = orderedIdeaCards.map(card => asId(card.id));
    const from = ids.indexOf(asId(sourceId));
    const to = ids.indexOf(asId(targetId));
    if (from < 0 || to < 0 || from === to) return;
    ids.splice(to, 0, ids.splice(from, 1)[0]);
    const positions = new Map(ids.map((id, index) => [id, index]));
    setScenes(previous => safeArray(previous).map(card => positions.has(asId(card.id))
      ? touchRecord(card, { ideaBoardOrder:positions.get(asId(card.id)) }) : card));
  };
  const moveIdea = (id, direction) => {
    const index = triageCards.findIndex(card => asId(card.id) === asId(id));
    const target = triageCards[index + direction];
    if (index >= 0 && target) reorderIdeas(id, target.id);
  };
  const clearNewIdeaDraft = () => {
    setDraftIdeaTitle("");
    setDraftIdeaDetails("");
    setDraftIdeaNotes([]);
    setDraftIdeaTypes([]);
    setDraftIdeaHasTable(false);
    setDraftIdeaTable(null);
    setIsCreatingIdea(false);
    if (newIdeaPanelRef.current) newIdeaPanelRef.current.open = false;
  };
  const saveNewIdea = () => {
    const title = draftIdeaTitle.trim().replace(/\s+/g, " ");
    if (!title || !setScenes) return;
    const timestamp = Date.now();
    const id = "companion-idea-" + (window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : timestamp.toString(36) + "-" + Math.random().toString(36).slice(2, 8));
    const pendingNote = draftIdeaDetails.trim();
    const ideaNotes = pendingNote ? [...draftIdeaNotes, newIdeaNote(pendingNote)] : draftIdeaNotes;
    const card = normalizeCard({
      id,
      title,
      description:"",
      ideaTypes:draftIdeaTypes,
      ideaType:draftIdeaTypes[0] || "",
      category:null,
      kind:"SCENE",
      status:"todo",
      sequence:null,
      page:null,
      changes:draftIdeaHasTable ? [] : ideaNotes,
      ...(draftIdeaHasTable ? { cardTable:draftIdeaTable || newCardTable() } : {}),
      maybe:false,
      archived:false,
      source:"COMPANION_USER",
      order:timestamp,
      createdAt:timestamp,
      updatedAt:timestamp,
      lastTouchedAt:timestamp
    }, 0);
    setScenes(prev => [...safeArray(prev), card]);
    setIdeaSearch("");
    setActiveId(null);
    clearNewIdeaDraft();
    if (showToast) showToast("Idea saved");
  };
  const textareaRowCount = (value, minRows, maxRows) => {
    const text = String(value || "");
    const rows = text.split("\n").reduce((sum, line) => sum + Math.max(1, Math.ceil(line.length / 22)), 0);
    return Math.min(maxRows, Math.max(minRows, rows));
  };
  const changeRowCount = value => textareaRowCount(value, 2, 12);
  const noteRowCount = value => textareaRowCount(value, 4, 18);

  const noteValue = selected ? (Object.prototype.hasOwnProperty.call(noteDrafts, selected.id) ? noteDrafts[selected.id] : (selected.openQuestions || "")) : "";
  const queueNotes = value => {
    if (!selected) return;
    const id = selected.id;
    setNoteDrafts(prev => ({ ...prev, [id]:value }));
    patchCard(id, { openQuestions:value, rippleEffects:"", storyThreads:"" });
  };
  const commitNotes = () => {
    if (!selected || isIdeasMode || !selectedIsSequenced || !Object.prototype.hasOwnProperty.call(noteDrafts, selected.id)) return;
    window.clearTimeout(noteSaveTimers.current[selected.id]);
    delete noteSaveTimers.current[selected.id];
    patchSelected({ openQuestions:noteDrafts[selected.id] || "", rippleEffects:"", storyThreads:"" });
    setNoteDrafts(prev => {
      const copy = { ...prev };
      delete copy[selected.id];
      return copy;
    });
  };

  const saveNewCompanionScene = () => {
    const sequence = effectiveSequenceFilter;
    const title = String(draftSceneTitle || "").trim().replace(/\s+/g, " ");
    if (!sequence || !title || !setScenes) return;
    if (newScenePanelRef.current) newScenePanelRef.current.open = false;
    const id = "companion-scene-" + (window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8));
    const timestamp = Date.now();
    const card = normalizeCard({
      id,
      title,
      formerTitles: [],
      sequence,
      page: null,
      pageRange: "",
      kind: "SCENE",
      status: "todo",
      category: "next",
      description: "",
      changes: [],
      openQuestions: "",
      rippleEffects: "",
      storyThreads: "",
      maybe: false,
      archived: false,
      source: "COMPANION_USER",
      order: timestamp,
      ...(filtered.some(card => card.companionSceneOrder !== undefined && card.companionSceneOrder !== null)
        ? { companionSceneOrder:filtered.length } : {}),
      createdAt: timestamp,
      updatedAt: timestamp,
      lastTouchedAt: timestamp
    }, 0);
    setScenes(prev => [...safeArray(prev), card]);
    setDraftSceneTitle("");
    setActiveId(id);
    setSequenceView("scene");
    if (showToast) showToast("Scene saved");
  };

  const renderNewScenePanel = () => (
    <details ref={newScenePanelRef} className="companion-sequence-admin-panel companion-new-scene-panel">
      <summary>+ New scene</summary>
      <div className="companion-new-scene-fields">
        <label className="companion-picker-field" htmlFor="companion-new-scene-title">
          <span className="companion-picker-label">Scene name</span>
          <input id="companion-new-scene-title" className="companion-title-input" value={draftSceneTitle}
            onChange={e => setDraftSceneTitle(e.target.value)} placeholder="Scene name" aria-label="New scene name" />
        </label>
        <button type="button" className="companion-add-button" disabled={!effectiveSequenceFilter || !draftSceneTitle.trim()}
          onClick={saveNewCompanionScene}>Save scene</button>
      </div>
    </details>
  );

  const renderSequenceSelect = (idPrefix = "companion") => (
      <label className="companion-picker-field" htmlFor={idPrefix + "-sequence-select"}>
        <span className="companion-picker-label">Sequence</span>
        <select id={idPrefix + "-sequence-select"} className="companion-select" aria-label="Sequence"
          value={effectiveSequenceFilter}
          onChange={e => { if (sceneSwitcherRef.current) sceneSwitcherRef.current.open = false; if (quickSceneSwitcherRef.current) quickSceneSwitcherRef.current.open = false; setSequenceFilter(e.target.value); setActiveId(null); setSequenceView("pick"); }}>
          {activeSequenceOrder.length === 0 && <option value="">No sequences</option>}
          {activeSequenceOrder.map(seq => <option key={seq} value={seq}>{getSequenceTitle(state.sequences, seq)}</option>)}
        </select>
      </label>
  );

  const renderScenePicker = (idPrefix = "companion") => (
    <div className="companion-sequence-picker">
      {renderSequenceSelect(idPrefix)}
      <label className="companion-picker-field" htmlFor={idPrefix + "-scene-select"}>
        <span className="companion-picker-label">Scene</span>
        <select id={idPrefix + "-scene-select"} className="companion-select companion-scene-select"
          value={sequenceView === "scene" && selected ? selected.id : ""}
          disabled={filtered.length === 0}
          onChange={e => { if (e.target.value) { if (sceneSwitcherRef.current) sceneSwitcherRef.current.open = false; if (quickSceneSwitcherRef.current) quickSceneSwitcherRef.current.open = false; setActiveId(e.target.value); setSequenceView("scene"); } }}

          {filtered.map(card => <option key={card.id} value={card.id}>{card.title || "Untitled"}</option>)}

      </label>
    </div>

              <button type="button" className="companion-picker-tab" onClick={() => { setCompanionMode("menu"); setSequenceView("pick"); setActiveId(null); }}>Menu</button>
            </div>

        {isIdeasMode && (
          <div className={"companion-unplaced-tools" + (isCreatingIdea ? " is-creating" : "") + (selected ? " is-editing" : "")}>

              <button type="button" className="companion-picker-tab is-active">Ideas</button>
              <button type="button" className="companion-picker-tab" onClick={() => { setCompanionMode("menu"); setActiveId(null); }}>Menu</button>

              <summary>+ New idea</summary>
              <div className="companion-new-idea-fields idea-focus-surface">

                    const notes = draftIdeaDetails.trim() ? [...draftIdeaNotes, newIdeaNote(draftIdeaDetails.trim())] : draftIdeaNotes;
                    setDraftIdeaTable(addNotesToCardTable(draftIdeaTable, notes));
                    setDraftIdeaNotes([]);
                    setDraftIdeaDetails("");
                    setDraftIdeaHasTable(true);
                  }}>+ Table</button>}
                </div>
                <input className="idea-focus-title" value={draftIdeaTitle}
                    onChange={e => setDraftIdeaTitle(e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter" && !e.nativeEvent.isComposing) { e.preventDefault(); saveNewIdea(); } }}
                    placeholder="Idea title" aria-label="New idea name" />
                <div className="idea-focus-category"><span>Categories</span>
                  <IdeaCategoryPicker types={ideaTypes} selected={draftIdeaTypes} onChange={setDraftIdeaTypes} label="New idea categories" />
                </div>
                {!draftIdeaHasTable && <details className="notecard-details idea-notes" open>
                  <summary>Notes</summary>
                  <ul className="notecard-change-list">{draftIdeaNotes.map(note => <li key={note.id} className={"notecard-change-row" + (note.done ? " is-done" : "")}>
                    <label className="notecard-change-check" title="Mark idea note complete"><input type="checkbox" className="notecard-change-done" checked={!!note.done}
                      onChange={event => setDraftIdeaNotes(previous => previous.map(item => item.id === note.id ? { ...item, done:event.target.checked } : item))}
                      aria-label={"Mark idea note complete " + note.text} /></label>
                    <textarea value={note.text} rows={1} ref={sizeIdeaNote} onChange={event => {
                      sizeIdeaNote(event.target);
                      setDraftIdeaNotes(previous => previous.map(item => item.id === note.id ? { ...item, text:event.target.value } : item));
                    }} aria-label="Idea note" />
                    <button type="button" className="notecard-icon-button" onClick={() => setDraftIdeaNotes(previous => previous.filter(item => item.id !== note.id))}
                      title="Remove idea note" aria-label="Remove idea note">×</button>
                  </li>)}</ul>
                  <div className="notecard-add-change"><span className="notecard-bullet" aria-hidden="true">•</span>
                    <input value={draftIdeaDetails} onChange={event => setDraftIdeaDetails(event.target.value)}
                      onKeyDown={event => { if (event.key === "Enter" && !event.nativeEvent.isComposing) {
                        event.preventDefault();
                        if (draftIdeaDetails.trim()) { setDraftIdeaNotes(previous => [...previous, newIdeaNote(draftIdeaDetails.trim())]); setDraftIdeaDetails(""); }
                      } }} placeholder="Add note" aria-label="Add idea note" />
                    <button type="button" disabled={!draftIdeaDetails.trim()} onClick={() => { setDraftIdeaNotes(previous => [...previous, newIdeaNote(draftIdeaDetails.trim())]); setDraftIdeaDetails(""); }} aria-label="Save idea note">+</button>
                  </div>
                </details>}
                {draftIdeaHasTable && <CardTableEditor simple table={draftIdeaTable} onChange={change => setDraftIdeaTable(current => change(current))} />}
                <div className="companion-new-idea-actions">
                  <button type="button" className="companion-add-button" disabled={!draftIdeaTitle.trim()} onClick={saveNewIdea}>Save idea</button>
                </div>
              </div>
            </details>
            <div className="companion-idea-tools">
              <input
                id="companion-idea-search"
                className="companion-search"
                aria-label="Search ideas"
                value={ideaSearch}
                onChange={e => {
                  setIdeaSearch(e.target.value);
                  setActiveId(null);
                }}
                placeholder="Search ideas"
              />
              <details className="companion-idea-filter">
                <summary aria-label="Filter ideas by category">
                  {ideaFilterTypes.every(id => ideaTypeFilters.includes(id)) ? "All ideas" :
                    ideaTypeFilters.length === 0 ? "No categories" :
                    ideaTypeFilters.length === 1 ? (ideaTypes.find(type => type.id === ideaTypeFilters[0])?.label || "Unsorted") :
                    ideaTypeFilters.length + " categories"}
                </summary>
                <div className="companion-idea-filter-options">
                  <label><input type="checkbox" checked={ideaFilterTypes.every(id => ideaTypeFilters.includes(id))}
                    onChange={() => {
                      setIdeaTypeFilters(ideaFilterTypes.every(id => ideaTypeFilters.includes(id)) ? [] : [...ideaFilterTypes]);
                      setDraftIdeaTypes([]);
                      setActiveId(null);
                    }} />All ideas</label>
                  {ideaTypes.map(type => (
                    <label key={type.id}><input type="checkbox" checked={ideaTypeFilters.includes(type.id)}
                      onChange={() => toggleIdeaTypeFilter(type.id)} />{type.label}</label>
                  ))}
                  <label><input type="checkbox" checked={ideaTypeFilters.includes("unsorted")}
                    onChange={() => toggleIdeaTypeFilter("unsorted")} />Unsorted</label>
                </div>
              </details>
            </div>
            <div className="companion-ideas-view-toggle" role="group" aria-label="Idea layout">
              <button type="button" className={ideaLayout === "list" ? "is-active" : ""} aria-pressed={ideaLayout === "list"} onClick={() => setIdeaLayout("list")}>List</button>
              <button type="button" className={ideaLayout === "board" ? "is-active" : ""} aria-pressed={ideaLayout === "board"} onClick={() => setIdeaLayout("board")}>Board</button>

                    <input value={draft} maxLength={60} aria-label={"Rename " + type.label}

                    <button type="button" disabled={!categoryNameIsValid(draft, type.id) || draft.trim().replace(/\s+/g, " ") === type.label}
                      onClick={() => saveCategoryName(type.id)}>Save</button>
                    <button type="button" onClick={() => setIdeaCategoryHidden(type, true)}>Remove</button>
                  </div>;
                })}
                <div className="companion-category-row">
                  <input value={newCategoryName} maxLength={60} placeholder="New category" aria-label="New category name"
                    onChange={event => setNewCategoryName(event.target.value)}
                    onKeyDown={event => { if (event.key === "Enter" && !event.nativeEvent.isComposing) { event.preventDefault(); addIdeaCategory(); } }} />
                  <button type="button" disabled={!categoryNameIsValid(newCategoryName, null)} onClick={addIdeaCategory}>Add</button>
                </div>
                {hiddenIdeaTypes.map(type => <div className="companion-category-row" key={type.id}>
                  <input value={type.label} aria-label={"Removed category " + type.label} readOnly />
                  <button type="button" onClick={() => setIdeaCategoryHidden(type, false)}>Restore</button>
                </div>)}
              </div>
            </details>
            {selected && <button type="button" className="idea-focus-back" onClick={() => {
              commitTitleDraft(selected.id);
              commitIdeaDetailDraft(selected.id, undefined, true);
              setActiveId(null);
            }}>← Ideas</button>}
            <div className={"companion-unplaced-list" + (ideaLayout === "board" ? " is-board" : "")}>
              {triageCards.length === 0 && <div className="companion-empty-note">No ideas match this view.</div>}
              {triageCards.map(card => {
                const active = selected && selected.id === card.id;
                const snippet = companionSnippet(card);
                return (
                  <article key={card.id} className={"companion-unplaced-card" + (card.cardTable ? " has-table" : "") + (active ? " is-active" : "") + (dropIdeaId === card.id ? " is-drop-target" : "")}
                    onDragOver={event => { if (ideaLayout === "board" && draggedIdeaId.current && draggedIdeaId.current !== card.id) { event.preventDefault(); setDropIdeaId(card.id); } }}
                    onDragLeave={event => { if (!event.currentTarget.contains(event.relatedTarget)) setDropIdeaId(null); }}
                    onDrop={event => { if (!draggedIdeaId.current) return; event.preventDefault(); reorderIdeas(draggedIdeaId.current, card.id); draggedIdeaId.current = null; setDropIdeaId(null); }}>
                    {active ? <div className="idea-focus-header">
                      <input className="idea-focus-title" value={titleDraftValueFor(card)}
                        onChange={event => setTitleDrafts(prev => ({ ...prev, [card.id]:event.target.value }))}
                        onBlur={() => commitTitleDraft(card.id)} onKeyDown={event => handleTitleKeyDown(event, card.id)}
                        aria-label="Idea name" placeholder="Idea title" />
                      <div className="idea-focus-actions">
                        {!card.cardTable && <button type="button" className="card-table-corner" onClick={event => {
                          event.stopPropagation();
                          patchCard(card.id, current => tableOnlyCardPatch(current, true, ideaNoteDrafts[card.id]));
                          setIdeaNoteDrafts(previous => ({ ...previous, [card.id]:"" }));
                        }}
                          title="Add table" aria-label={"Add table to " + (card.title || "idea")}>+ Table</button>}
                        <button type="button" className="companion-archive-button" onClick={() => archiveIdeaCard(card.id)}
                          title="Archive idea" aria-label="Archive idea"><ArchiveTrayIcon size={18} /></button>
                      </div>
                    </div> : <button type="button" className="companion-unplaced-card-main" onClick={() => setActiveId(card.id)}>
                      {companionIdeaTypeIds(card, ideaTypes).length > 0 && <span className="companion-unplaced-type">{companionIdeaTypeLabel(card, ideaTypes)}</span>}
                      <span className="companion-unplaced-title">{card.title || "Untitled"}</span>

                      <span className="companion-idea-drag" role="button" tabIndex="0" draggable="true" title="Drag to reorder idea" aria-label={"Drag to reorder " + (card.title || "idea")}

                        onDragEnd={() => { draggedIdeaId.current = null; setDropIdeaId(null); }}
                        onKeyDown={event => { if (event.key === "ArrowUp" || event.key === "ArrowLeft") { event.preventDefault(); moveIdea(card.id, -1); } else if (event.key === "ArrowDown" || event.key === "ArrowRight") { event.preventDefault(); moveIdea(card.id, 1); } }}>{"\u22EE\u22EE"}</span>

                        <button type="button" disabled={triageCards[triageCards.length - 1]?.id === card.id} onClick={() => moveIdea(card.id, 1)} aria-label={"Move " + (card.title || "idea") + " later"} title="Move later">{"\u2193"}</button>
                      </div>
                    </>}
                    {active && (
                      <div className="companion-unplaced-actions">
                        <div className="idea-focus-category"><span>Categories</span>

                        </div>

                          <summary>Notes</summary>

                          <div className="notecard-add-change"><span className="notecard-bullet" aria-hidden="true">•</span>
                            <input value={ideaNoteDrafts[card.id] || ""} onChange={event => setIdeaNoteDrafts(previous => ({ ...previous, [card.id]:event.target.value }))}

                              placeholder="Add note" aria-label={"Add idea note to " + (card.title || "idea")} />

                          <button type="button" className="companion-assign-button" onClick={() => turnIdeaIntoNotecard(card)}>Turn into notecard</button>
                        </div>
                      </div>
                    )}
                  </article>
                );
              })}
            </div>
          </div>
        )}

        {isNotecardsMode && <div className="companion-picker-tabs companion-workspace-nav" aria-label="Notecards workspace">
          <button type="button" className="companion-picker-tab is-active">Notecards</button>
          <button type="button" className="companion-picker-tab" onClick={() => { setCompanionMode("menu"); setActiveId(null); }}>Menu</button>
        </div>}
        {isSceneListMode && <div className="companion-picker-tabs companion-workspace-nav" aria-label="Scene List workspace">
          <button type="button" className="companion-picker-tab is-active">Scene List</button>
          <button type="button" className="companion-picker-tab" onClick={() => { setCompanionMode("menu"); setActiveId(null); }}>Menu</button>
        </div>}
        {isProgressMode && <div className="companion-picker-tabs companion-workspace-nav" aria-label="Progress workspace">

      {isNotecardsMode && <NotecardsWorkspace scenes={scenes} setScenes={setScenes} notecards={notecards} setNotecards={setNotecards}

      {isSceneListMode && <CompanionSceneList sequences={sequences} setSequences={setSequences}
        openProgressScene={row => { setProgressFocusSceneId(row.id); setCompanionMode("progress"); }} />}

      {isSequenceMode && sequenceView === "table" && (

            <select className="companion-table-sequence" value={tableSequence} onChange={e => setTableSequence(e.target.value)} aria-label="Filter by sequence">

            </select>

              <option value="scene">Sort: scene name</option>

            </select>
            <button type="button" className="companion-table-direction" onClick={() => setTableSortDirection(value => value === "asc" ? "desc" : "asc")}

          </div>

              <table className="companion-scene-table companion-workspace-table">
                <thead><tr><th scope="col">Scene</th><th scope="col">Sequence</th><th scope="col">Status</th><th scope="col">{APP_BUILD === "PWA" ? "Order / archive" : "Archive"}</th></tr></thead>
                <tbody>
                  {tableCards.map((card, index) => {

                    const sequenceIndex = APP_BUILD === "PWA" ? sequencedCards.filter(item => item.sequence === card.sequence).findIndex(item => asId(item.id) === asId(card.id)) : -1;
                    const sequenceCount = counts[card.sequence] || 0;

              <div className="companion-scene-header">

                        <path d="M4 5h16M4 12h16M4 19h16" />
                        <path d="m16 9 3 3-3 3" />

                    </button>

                  <div className="companion-title-row companion-scene-title-row">
                    <textarea
                      ref={sceneTitleRef}
                      className="companion-title-input"
                      value={titleDraftValue}
                      onChange={e => setTitleDrafts(prev => ({ ...prev, [selected.id]:e.target.value }))}
                      onBlur={() => commitTitleDraft(selected.id)}
                      onKeyDown={event => handleTitleKeyDown(event, selected.id)}
                      aria-label="Scene name"
                      placeholder="Untitled scene"
                      rows={1}

                    <select
                      id="companion-status-select"
                      className="companion-status-select"
                      value={companionStatusValue}
                      onChange={e => setStatus(e.target.value)}
                      aria-label="Scene status"

                    </select>
                    <button type="button" className="companion-archive-button companion-scene-archive-button" onClick={archiveSelectedScene} title="Archive scene" aria-label="Archive scene">
                      <ArchiveTrayIcon size={18} />
                    </button>
                  </div>
                </div>
              </div>

              <details className="companion-section" open>
                <summary className="companion-section-toggle">
                  <span>Scene Changes</span>
                  <span>+</span>
                </summary>
                <div className="companion-section-body">
                  {visibleChanges.length === 0 && <div className="companion-empty-note">No scene changes yet.</div>}
                  {visibleChanges.map((change, index) => (
                    <div
                      key={change.id}
                      className={"companion-task-row" + (change.done ? " is-done" : "") + (dropTargetId === asId(change.id) ? " is-drop-target" : "")}
                      onDragOver={e => {
                        if (!draggedChangeId.current || draggedChangeId.current === asId(change.id)) return;
                        e.preventDefault();
                        e.dataTransfer.dropEffect = "move";
                        if (dropTargetId !== asId(change.id)) setDropTargetId(asId(change.id));
                      }}
                      onDrop={e => {
                        e.preventDefault();
                        if (draggedChangeId.current && draggedChangeId.current !== asId(change.id)) reorderChange(draggedChangeId.current, index);
                        draggedChangeId.current = null;
                        setDropTargetId(null);
                      }}
                    >
                      <input type="checkbox" checked={!!change.done} onChange={e => toggleChangeDone(change.id, e.target.checked)} aria-label="Mark scene change done" />
                      <textarea
                        className="companion-textarea companion-task-text"
                        value={changeDraftValue(change)}
                        onChange={e => queueChangeDraft(change.id, e.target.value)}
                        onBlur={e => { rememberChangeHeight(change.id, e.currentTarget); commitChangeDraft(change.id); }}
                        onPointerDown={e => { changeResizeStarts.current[change.id] = { height:e.currentTarget.getBoundingClientRect().height, inlineHeight:e.currentTarget.style.height }; }}
                        onPointerUp={e => rememberChangeHeight(change.id, e.currentTarget)}
                        rows={changeRowCount(changeDraftValue(change))}
                        style={Number.isFinite(Number(change.editorHeight)) && Number(change.editorHeight) >= 56
                          ? { height:Math.min(1600, Number(change.editorHeight)) + "px" }
                          : undefined}
                      />
                      <div className="companion-task-controls">
                        <button
                          type="button"
                          className="companion-drag-handle"
                          draggable="true"
                          onDragStart={e => {
                            draggedChangeId.current = asId(change.id);
                            e.dataTransfer.effectAllowed = "move";
                            e.dataTransfer.setData("text/plain", asId(change.id));
                          }}
                          onDragEnd={() => { draggedChangeId.current = null; setDropTargetId(null); }}
                          title="Drag to reorder scene change"
                          aria-label="Drag to reorder scene change"
                        >{"\u22EE\u22EE"}</button>
                        <button type="button" className="companion-reorder-button" onClick={() => moveChange(change.id, -1)} disabled={index === 0} title="Move scene change up" aria-label="Move scene change up">{"\u2191"}</button>
                        <button type="button" className="companion-reorder-button" onClick={() => moveChange(change.id, 1)} disabled={index === visibleChanges.length - 1} title="Move scene change down" aria-label="Move scene change down">{"\u2193"}</button>
                        <button type="button" className="companion-archive-button" onClick={() => archiveChange(change.id)} title="Archive scene change" aria-label="Archive scene change">
                          <ArchiveTrayIcon size={18} />
                        </button>
                      </div>
                    </div>
                  ))}
                  <div className="companion-add-row">
                    <textarea
                      className="companion-textarea companion-new-change-text"
                      value={newChangeText}
                      onChange={e => setNewChangeDrafts(prev => ({ ...prev, [selected.id]:e.target.value }))}
                      placeholder="Add scene change"
                      aria-label="New scene change"
                      rows={3}
                    />
                    <button type="button" className="companion-add-button" disabled={!newChangeText.trim()} onClick={addSceneChange}>Add</button>
                  </div>
                </div>
              </details>

              <details className="companion-section" open>
                <summary className="companion-section-toggle">
                  <span>Notes</span>
                  <span>+</span>
                </summary>
                <div className="companion-section-body">
                  <textarea
                    className="companion-textarea companion-note-text"
                    value={noteValue}
                    onChange={e => queueNotes(e.target.value)}
                    onBlur={commitNotes}
                    rows={noteRowCount(noteValue)}
                  />
                </div>
              </details>
            </>
          )}
        </div>
      </div>
      )}
      {isSequenceMode && (sequenceView === "pick" || sequenceView === "scene") && (
        <div className="companion-bottom-tools">
          {sequenceView === "scene" && (
            <details ref={sceneSwitcherRef} className="companion-switcher">
              <summary>Switch scene</summary>
              {renderScenePicker("companion-bottom")}
            </details>
          )}
          {renderNewScenePanel()}
          <details className="companion-sequence-admin-panel">
            <summary>Sequence settings</summary>
            <div className="companion-sequence-admin">
              <input className="companion-sequence-name-input" value={sequenceNameDraft}
                onChange={event => setSequenceNameDraft(event.target.value)}
                onKeyDown={event => { if (event.key === "Enter" && sequenceNameDraft.trim()) renameSequence(); }}
                disabled={!effectiveSequenceFilter} aria-label="Sequence name" />
              <button type="button" className="companion-sequence-rename-button" onClick={renameSequence}
                disabled={!effectiveSequenceFilter || !sequenceNameDraft.trim() || sequenceNameDraft.trim().replace(/\s+/g, " ") === currentSequenceTitle}>Rename</button>
              <button type="button" className="companion-sequence-delete-button" onClick={deleteSequence}
                disabled={!effectiveSequenceFilter || activeSequenceOrder.length <= 1} title="Delete sequence" aria-label="Delete sequence">
                <TrashIcon size={16} />
              </button>
            </div>
          </details>
        </div>
      )}
    </div>
  );
}
