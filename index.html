<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PICK ME WRITERS ASSISTANT 💋</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23EA258D' width='100' height='100'/><rect fill='%23FFB6D9' x='4' y='4' width='92' height='92'/><text x='50' y='65' font-size='70' font-weight='bold' text-anchor='middle' fill='%23EA258D' font-family='Arial'>P</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --neon-pink: #EA258D;
            --hot-pink: #FF1493;
            --light-pink: #F37EB3;
            --bright-yellow: #FFEB3B;
            --golden: #F5952D;
            --lavender: #CACBDF;
            --mauve: #FFB6D9;
            --dusty-rose: #FFC0CB;
            --white: #FFFFFF;
            --cream: #FFFBF8;
            --black: #000000;
            --dark-gray: #1A1A1A;
            --card-bg: #FFFFFF;
            --text-dark: #000000;
            --text-mid: #333333;
            --text-light: #666666;
            --border-pink: #FFB6D9;
            --accent-pink: #EA258D;
            --accent-yellow: #FFEB3B;
            --accent-lavender: #CACBDF;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #FFB6D9;
            min-height: 100vh;
            padding: 40px 16px;
            color: var(--text-dark);
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: none;
            pointer-events: none;
            z-index: -1;
        }

        .container { max-width: 960px; margin: 0 auto; }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 50px 40px;
            background: var(--white);
            border-radius: 0;
            border: none;
            box-shadow: none;
            position: relative;
            overflow: visible;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            background: none;
            border-radius: 0;
        }
        .header-lip { font-size: 3em; margin-bottom: 16px; }
        .header h1 {
            font-family: 'Inter', sans-serif;
            font-size: 3.2em;
            font-weight: 900;
            color: var(--black);
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            line-height: 1.2;
        }
        .header-sub {
            font-size: 1em;
            color: var(--text-light);
            font-style: italic;
            opacity: 1;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        /* TABS */
        .tabs {
            margin-bottom: 20px;
            background: transparent;
            padding: 0;
        }
        .tab-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--black);
            background: var(--white);
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .tab-select:focus {
            outline: none;
            border-color: var(--neon-pink);
            box-shadow: none;
            background: var(--white);
        }
        .tab-select:hover {
            background: #EA258D;
            border-color: #EA258D;
            color: var(--white);
        }

        /* PROGRESS BAR HEADER */
        .progress-bar-container {
            background: rgba(243, 126, 179, 0.08);
            border: 1px solid rgba(243, 126, 179, 0.2);
            border-radius: 4px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.85em;
        }
        .progress-bar-container.hidden {
            display: none;
        }
        .progress-feature-name {
            font-weight: 700;
            color: var(--text-dark);
            min-width: 180px;
            white-space: nowrap;
        }
        .progress-stats {
            color: var(--text-light);
            font-size: 0.8em;
            min-width: 60px;
        }
        .progress-bar-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .progress-bar-track {
            flex: 1;
            height: 6px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            display: block;
            height: 100%;
            background: #EA258D !important;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .progress-toggle-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 0.9em;
            padding: 0;
            transition: color 0.2s ease;
        }
        .progress-toggle-btn:hover {
            color: var(--neon-pink);
        }

        /* CARD */
        .card {
            background: var(--white);
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            border: none;
        }

        /* BUTTONS */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.02em;
        }
        .btn-primary {
            background: #fec3e4;
            color: #ea258d;
            box-shadow: 0 4px 12px rgba(254, 195, 228, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(254, 195, 228, 0.4); }
        .btn-secondary {
            background: var(--white);
            color: var(--black);
            border: 2px solid var(--neon-pink);
            box-shadow: none;
        }
        .btn-secondary:hover { background: var(--light-pink); color: var(--black); }
        .btn-notion {
            background: #fec3e4;
            color: #ea258d;
            box-shadow: 0 4px 12px rgba(254, 195, 228, 0.3);
        }
        .btn-notion:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(254, 195, 228, 0.4); }
        .btn-yes {
            background: var(--neon-pink);
            color: white;
            padding: 14px 48px;
            font-size: 1.05em;
            box-shadow: 0 4px 12px rgba(234, 37, 141, 0.3);
            border: none;
        }
        .btn-yes:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(234, 37, 141, 0.4); }
        .btn-no {
            background: var(--white);
            color: var(--black);
            padding: 14px 48px;
            font-size: 1.05em;
            box-shadow: none;
            border: 2px solid var(--black);
        }
        .btn-no:hover { background: #FFB6D9; border-color: var(--black); }
        .btn-skip {
            background: transparent;
            color: var(--text-light);
            border: 1px dashed var(--border-rose);
            padding: 8px 20px;
            font-size: 0.85em;
        }
        .btn-skip:hover { background: var(--blush); }
        .btn-restart {
            background: var(--blush);
            color: var(--text-dark);
            border: 1px solid var(--border-rose);
        }
        .btn-restart:hover { background: var(--petal); }

        /* INPUTS */
        input, textarea, select {
            font-family: 'Inter', sans-serif;
            font-size: 0.95em;
            padding: 12px 16px;
            border: 2px solid var(--black);
            border-radius: 6px;
            background: white;
            color: var(--text-dark);
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--neon-pink);
            box-shadow: none;
            background: white;
        }
        label {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-mid);
            display: block;
            margin-bottom: 5px;
        }

        /* SECTION TITLE */
        .section-title {
            font-family: 'Inter', sans-serif;
            font-size: 1.8em;
            font-weight: 900;
            color: var(--black);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: var(--black);
            border-radius: 0;
        }

        /* PLAYLIST */
        .playlist-controls { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; align-items: center; }
        .song-count-badge {
            margin-left: auto;
            background: #fec3e4;
            color: #ea258d;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(254, 195, 228, 0.3);
        }
        .songs-grid { display: grid; gap: 14px; }
        .song-card {
            background: linear-gradient(135deg, white 0%, var(--off-white) 100%);
            border-radius: 8px;
            border: 1px solid var(--border-warm);
            padding: 18px;
            display: grid;
            grid-template-columns: 36px 56px 1fr;
            gap: 14px;
            align-items: start;
            transition: all 0.3s ease;
            cursor: default;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .song-card:hover {
            border-color: var(--terra);
            box-shadow: 0 8px 24px rgba(184, 102, 74, 0.12);
            transform: translateY(-2px);
        }
        .song-card.drag-over {
            border-color: var(--hot-pink);
            border-style: dashed;
            background: var(--card-bg);
        }
        .song-card.dragging { opacity: 0.4; }
        .drag-handle {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-top: 6px;
            cursor: grab;
            color: var(--text-light);
            opacity: 0.5;
            align-items: center;
        }
        .drag-handle:active { cursor: grabbing; }
        .drag-handle span {
            display: block;
            width: 18px;
            height: 2px;
            background: currentColor;
            border-radius: 2px;
        }
        .song-num {
            font-size: 0.75em;
            color: var(--text-light);
            text-align: center;
            margin-top: 2px;
        }
        .song-icon {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--deep-rose), var(--hot-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .song-title { font-size: 1em; font-weight: 600; color: var(--text-dark); margin-bottom: 2px; }
        .song-artist { font-size: 0.85em; color: var(--text-mid); margin-bottom: 2px; }
        .song-album { font-size: 0.78em; color: var(--text-light); margin-bottom: 10px; }
        .meaning-label { color: var(--hot-pink) !important; font-size: 0.8em !important; }
        textarea.meaning-area {
            min-height: 56px;
            resize: vertical;
            font-size: 0.9em;
            padding: 8px 12px;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--neon-pink);
            color: white;
            padding: 14px 32px;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 700;
            letter-spacing: 0.02em;
            box-shadow: 0 8px 24px rgba(234, 37, 141, 0.3);
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            z-index: 999;
            pointer-events: none;
            border: none;
            text-transform: uppercase;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* EVALUATION */
        .eval-step0, .eval-categories, .eval-question, .eval-result { max-width: 700px; margin: 0 auto; }

        .eval-step-label {
            font-size: 0.75em;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 6px;
        }
        .eval-scene-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            color: var(--terra);
            font-style: italic;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0 24px; }
        .cat-card {
            padding: 20px;
            border: 2px solid var(--border-warm);
            border-radius: 8px;
            background: linear-gradient(135deg, white 0%, var(--off-white) 100%);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .cat-card:hover {
            border-color: var(--taupe);
            background: linear-gradient(135deg, var(--card-bg), var(--cream));
            box-shadow: 0 6px 16px rgba(184, 102, 74, 0.1);
            transform: translateY(-2px);
        }
        .cat-card.selected {
            border-color: var(--terra);
            background: linear-gradient(135deg, var(--cream), var(--mauve));
            box-shadow: 0 8px 24px rgba(184, 102, 74, 0.2), 0 0 0 4px rgba(184, 102, 74, 0.08);
            transform: translateY(-2px);
        }
        .cat-icon { font-size: 1.8em; margin-bottom: 6px; }
        .cat-name { font-weight: 700; font-size: 0.9em; color: var(--text-dark); margin-bottom: 4px; }
        .cat-desc { font-size: 0.78em; color: var(--text-mid); line-height: 1.4; }

        .progress-bar-wrap {
            background: var(--mauve);
            border-radius: 10px;
            height: 6px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .eval-question .progress-bar-fill {
            height: 100%;
            background: linear-gradient(to right, var(--terra), var(--rust));
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        .progress-label { font-size: 0.8em; color: var(--text-light); margin-bottom: 28px; }

        .question-section {
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--hot-pink);
            margin-bottom: 10px;
        }
        .question-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.5em;
            line-height: 1.5;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        .question-sub {
            font-size: 0.88em;
            color: var(--text-light);
            margin-bottom: 32px;
            line-height: 1.5;
            font-style: italic;
        }
        .quiz-btns { display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; }

        .flag-strip {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .flag-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 600;
        }
        .flag-keep { background: #D4EFDF; color: #1A7A42; }
        .flag-warn { background: #FDEBD0; color: #884A00; }
        .flag-cut  { background: #FADBD8; color: #922B21; }

        /* RESULT */
        .result-verdict {
            padding: 36px;
            border-radius: 12px;
            margin-bottom: 28px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        .verdict-keep {
            background: linear-gradient(135deg, #D4EFDF 0%, #A9DFBF 100%);
            border: 2px solid #27AE60;
            box-shadow: 0 8px 32px rgba(39, 174, 96, 0.15);
        }
        .verdict-rewrite {
            background: linear-gradient(135deg, #F0D7A8 0%, #E8C592 100%);
            border: 2px solid var(--terra);
            box-shadow: 0 8px 32px rgba(184, 102, 74, 0.15);
        }
        .verdict-cut {
            background: linear-gradient(135deg, #FADBD8 0%, #F5B7B1 100%);
            border: 2px solid #E74C3C;
            box-shadow: 0 8px 32px rgba(231, 76, 60, 0.15);
        }
        .verdict-icon { font-size: 2.8em; margin-bottom: 10px; }
        .verdict-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .verdict-keep .verdict-title { color: #1A5E30; }
        .verdict-rewrite .verdict-title { color: var(--terra); }
        .verdict-cut .verdict-title { color: #922B21; }
        .verdict-notes { font-size: 0.95em; line-height: 1.7; color: #2C2C2C; }
        .verdict-notes li { margin-bottom: 6px; margin-left: 20px; }

        .flag-summary {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .flag-count {
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.88em;
            text-align: center;
        }
        .fc-keep { background: #D4EFDF; color: #1A7A42; }
        .fc-warn { background: #FDEBD0; color: #884A00; }
        .fc-cut  { background: #FADBD8; color: #922B21; }

        .result-notes-area { margin-top: 20px; }
        .result-notes-area textarea { min-height: 80px; resize: vertical; }
        .result-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; justify-content: flex-end; }

        /* SCENE NOTES */
        .notes-controls { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; align-items: flex-end; }
        .notes-grid { display: grid; gap: 14px; }
        .note-card {
            background: linear-gradient(135deg, white 0%, var(--off-white) 100%);
            border: 1px solid var(--border-warm);
            border-radius: 8px;
            padding: 18px 20px;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .note-card:hover {
            border-color: var(--terra);
            box-shadow: 0 6px 18px rgba(184, 102, 74, 0.12);
            transform: translateY(-2px);
        }
        .note-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .note-scene-tag {
            background: #fec3e4;
            color: #ea258d;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            white-space: nowrap;
        }
        .note-delete {
            margin-left: auto;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            font-size: 1.1em;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.15s;
        }
        .note-delete:hover { background: #FADBD8; color: #C0392B; }
        .note-content {
            font-size: 0.93em;
            color: var(--text-dark);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .add-note-form {
            background: var(--card-bg);
            border: 1.5px dashed var(--border-rose);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .add-note-form-grid { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: start; }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
        }
        .empty-state-icon { font-size: 2.5em; margin-bottom: 10px; opacity: 0.5; }
        .empty-state-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.05em; }

        /* SETTINGS */
        .settings-section { max-width: 600px; }
        .settings-field { margin-bottom: 20px; }
        .settings-hint { font-size: 0.8em; color: var(--text-light); margin-top: 5px; font-style: italic; }

        @media (max-width: 640px) {
            .header h1 { font-size: 1.6em; }
            .cat-grid { grid-template-columns: 1fr; }
            .add-note-form-grid { grid-template-columns: 1fr; }
            .song-card { grid-template-columns: 28px 44px 1fr; gap: 10px; }
            .tabs { flex-direction: column; }
        }

        /* SCENE CARDS (NEW) */
        .scenes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .scene-card {
            background: #FFE4F0;
            border: 2px solid var(--border-pink);
            border-radius: 0;
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            min-height: 200px;
            aspect-ratio: 1;
            box-shadow: 2px 2px 4px rgba(234, 37, 141, 0.1);
        }
        .scene-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .scene-card-label {
            font-size: 0.7em;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--neon-pink);
            letter-spacing: 0.05em;
            flex: 1;
            line-height: 1.2;
            word-break: break-word;
        }
        .scene-delete-btn {
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            color: var(--neon-pink);
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-left: 4px;
        }
        .scene-delete-btn:hover {
            opacity: 0.7;
        }
        .scene-field {
            margin-bottom: 0;
            flex: 1;

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function computeVerdict(answers) {
  let keeps = 0, warns = 0, cuts = 0;
  const notes = [];

  QUESTIONS.forEach(q => {
    const ans = answers[q.id];
    if (ans === undefined) return;
    const flag = ans === "yes" ? q.flag_yes : q.flag_no;
    if (flag === "keep") keeps++;
    else if (flag === "warn") warns++;
    else if (flag === "cut") cuts++;
  });

  // Specific note logic
  if (answers["q_cut4"] === "yes") notes.push("⚠️ The story holds without this scene — identify exactly what it's earning before you keep it.");
  if (answers["q_cut1"] === "no" && answers["q_cut2"] === "no" && answers["q_cut3"] === "no") notes.push("🚨 No relationship shift, no unique info, no obstacle. Strong cut candidate unless it's pure comedy that earns its place.");
  if (answers["q_momentum"] === "yes") notes.push("⏱ Pacing drag detected. What emotional payoff justifies the slowdown?");
  if (answers["q_voice"] === "no") notes.push("🎭 Autumn's voice feels off. Reconnect her to the wound: she wants to be wanted and can't believe she is.");
  if (answers["q_ethan_armor"] === "no" && answers["q_ethan_present"] === "yes") notes.push("🎬 Ethan's production armor is absent — is that a choice? His arc depends on this pattern being visible.");
  if (answers["q_ethan_agency"] === "yes") notes.push("✍️ Ethan is writing someone's ending for them. Flag intentional or unintentional — both matter.");
  if (answers["q_show_visibility"] === "no" && answers["q_show_check"] === "yes") notes.push("📺 Show mechanic present but not interrogating Autumn's wound. The format should cost her something.");
  if (answers["q_green_flags"] === "no") notes.push("💚 Green flag opportunity missed. Can Ethan do something small and specific here that Autumn deflects?");
  if (answers["q_panty_seat"] === "no") notes.push("📋 No Panty Seat List root. Consider: which of the 30 truths does this scene speak to?");

  let verdict, icon;
  const total = keeps + warns + cuts;
  if (cuts >= 2) { verdict = "cut"; icon = "✂️"; }
  else if (warns >= 3 || (warns >= 2 && cuts >= 1)) { verdict = "rewrite"; icon = "✏️"; }
  else if (keeps >= Math.ceil(total * 0.5)) { verdict = "keep"; icon = "✅"; }
  else { verdict = "rewrite"; icon = "✏️"; }

  return { verdict, icon, keeps, warns, cuts, notes };
}

function formatPlaylistForNotion(songs) {
  const withMeaning = songs.filter(s => s.meaning.trim());
  if (!withMeaning.length) return "No meanings written yet.";
  return "# 🎵 Pick Me Playlist — Story Notes\n\n" +
    withMeaning.map((s, i) =>
      `## ${i+1}. ${s.title} — ${s.artist}\n${s.meaning}`
    ).join("\n\n");
}

function formatNotesForNotion(notes) {
  if (!notes.length) return "No notes yet.";
  return "# 📝 Scene Notes\n\n" +
    notes.map(n =>
      `## Scene: ${n.scene || "Untitled"}\n${n.content}`
    ).join("\n\n---\n\n");
}

function useToast() {
  const [msg, setMsg] = useState("");
  const [visible, setVisible] = useState(false);
  const timer = useRef(null);

  const show = useCallback((m) => {
    setMsg(m);
    setVisible(true);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setVisible(false), 2800);
  }, []);

  return { msg, visible, show };
}

    ["s3", "THE INTERVENTION", 4],

    ["s8", "THE LOW POINT", 4],
    ["s9", "THE TURNING POINT", 10],
    ["s10", "THE BIG FINALE", 12]
  ];
  let total = 0;
  for (let s of seqs) {

  }
  return (
    <div>

      </div>

        const curr = sequences[s[0]] || 0;
        return (
          <div key={s[0]} className="card" style={{padding: "14px", marginBottom: "10px"}}>

        );

// ─── PLAYLIST TAB ────────────────────────────────────────────────────────────

function PlaylistTab({ songs, setSongs, notionUrl, showToast }) {
  const [dragId, setDragId] = useState(null);
  const [overIdx, setOverIdx] = useState(null);

  const updateMeaning = (id, val) =>
    setSongs(prev => prev.map(s => s.id === id ? { ...s, meaning: val } : s));

  const deleteSong = (id) =>
    setSongs(prev => prev.filter(s => s.id !== id));

  const addSong = () => {
    const newSong = {
      id: Date.now(),
      title: "",
      artist: "",
      album: "",
      meaning: "",
      isNew: true
    };
    setSongs(prev => [newSong, ...prev]);
  };

  const handleDragStart = (e, id) => {
    setDragId(id);
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/html", "");
  };
  const handleDragOver = (e, idx) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    setOverIdx(idx);
  };
  const handleDrop = (e, targetIdx) => {
    e.preventDefault();
    e.stopPropagation();
    if (dragId === null) return;
    const fromIdx = songs.findIndex(s => s.id === dragId);
    if (fromIdx === targetIdx || fromIdx === -1) { setDragId(null); setOverIdx(null); return; }
    const next = [...songs];
    const [moved] = next.splice(fromIdx, 1);
    next.splice(targetIdx, 0, moved);
    setSongs(next);
    setDragId(null);
    setOverIdx(null);
  };
  const handleDragEnd = () => { setDragId(null); setOverIdx(null); };

  const copyToNotion = () => {
    const text = formatPlaylistForNotion(songs);
    navigator.clipboard.writeText(text).then(() => {
      window.open(notionUrl, "_blank");
      showToast("Copied! Paste into your Notion page 💋");
    });
  };

  const downloadTxt = () => {
    const text = formatPlaylistForNotion(songs);
    const a = document.createElement("a");
    a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(text);
    a.download = "pick-me-playlist.txt";
    a.click();
  };

  return (
    <div>
      <div className="playlist-controls">
        <button className="btn btn-primary" onClick={copyToNotion}>✦ Copy & Open Notion</button>
        <button className="btn btn-secondary" onClick={downloadTxt}>⬇ Download .txt</button>
        <span className="song-count-badge">{songs.length} songs</span>
      </div>
      <p style={{fontSize:"0.82em",color:"var(--text-light)",marginBottom:"18px",fontStyle:"italic"}}>
        Drag the ≡ handle to reorder songs into story sequence.
      </p>
      <button onClick={addSong} style={{marginBottom:"16px",padding:"10px 16px",backgroundColor:"var(--neon-pink)",color:"white",border:"none",borderRadius:"4px",cursor:"pointer",fontWeight:"bold"}}>+ Add Song</button>
      <div className="songs-grid">
        {songs.map((song, idx) => (
          <div
            key={song.id}
            className={`song-card${dragId === song.id ? " dragging" : ""}${overIdx === idx && dragId !== song.id ? " drag-over" : ""}`}
            draggable
            onDragStart={e => handleDragStart(e, song.id)}
            onDragOver={e => handleDragOver(e, idx)}
            onDrop={e => handleDrop(e, idx)}
            onDragEnd={handleDragEnd}
          >
            <div className="drag-handle" title="Drag to reorder">
              <span/><span/><span/>
              <div className="song-num">{idx+1}</div>
            </div>
            <div className="song-icon">🎵</div>
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div className="song-title">{song.title}</div>
                  <div className="song-artist">{song.artist}</div>
                  <div className="song-album">{song.album}</div>
                </div>
                <button onClick={(e) => {e.stopPropagation(); deleteSong(song.id);}} style={{backgroundColor:"#f5d5d8",color:"#d9647f",border:"none",padding:"1px 4px",borderRadius:"2px",cursor:"pointer",fontWeight:"bold",fontSize:"14px",lineHeight:"1"}}>×</button>
              </div>
              {song.isNew && (
                <>
                  <input type="text" value={song.title} onChange={(e) => setSongs(prev => prev.map(s => s.id === song.id ? {...s, title: e.target.value, isNew: e.target.value ? true : true} : s))} placeholder="Song title..." style={{width:"100%",padding:"8px",marginBottom:"8px",border:"1px solid #ddd",borderRadius:"4px",fontSize:"0.95em"}} />
                  <input type="text" value={song.artist} onChange={(e) => setSongs(prev => prev.map(s => s.id === song.id ? {...s, artist: e.target.value} : s))} placeholder="Artist..." style={{width:"100%",padding:"8px",marginBottom:"8px",border:"1px solid #ddd",borderRadius:"4px",fontSize:"0.95em"}} />
                  <input type="text" value={song.album} onChange={(e) => setSongs(prev => prev.map(s => s.id === song.id ? {...s, album: e.target.value} : s))} placeholder="Album..." style={{width:"100%",padding:"8px",marginBottom:"8px",border:"1px solid #ddd",borderRadius:"4px",fontSize:"0.95em"}} />
                  <button onClick={() => {if(song.title.trim()) setSongs(prev => prev.map(s => s.id === song.id ? {...s, isNew: false} : s));}} disabled={!song.title.trim()} style={{backgroundColor:song.title.trim()?"var(--neon-pink)":"#ccc",color:"white",border:"none",padding:"8px 12px",borderRadius:"4px",cursor:song.title.trim()?"pointer":"not-allowed",fontWeight:"bold",fontSize:"0.95em",width:"100%",marginTop:"8px"}}>Save Song</button>
                </>
              )}
              <label className="meaning-label">What did this song inspire?</label>
              <textarea
                className="meaning-area"
                value={song.meaning}
                placeholder="What moment, feeling, or character truth does this song speak to..."
                onChange={e => updateMeaning(song.id, e.target.value)}
              />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── SCENE EVALUATION TAB ────────────────────────────────────────────────────

function EvalTab({ notionUrl, showToast }) {
  const [step, setStep] = useState("setup"); // setup | categories | quiz | result
  const [sceneName, setSceneName] = useState("");
  const [selectedCats, setSelectedCats] = useState([]);
  const [qHistory, setQHistory] = useState([]);   // [{id, answer}]
  const [currentQId, setCurrentQId] = useState("q_cut1");
  const [answers, setAnswers] = useState({});
  const [evalNotes, setEvalNotes] = useState("");

  const toggleCat = id =>
    setSelectedCats(prev => prev.includes(id) ? prev.filter(c => c !== id) : [...prev, id]);

  const startCategories = () => {
    if (!sceneName.trim()) return;
    setStep("categories");
  };

  const startQuiz = () => {
    if (!selectedCats.length) return;
    setStep("quiz");
    setCurrentQId("q_cut1");
    setAnswers({});
    setQHistory([]);
  };

  const getQuestion = id => QUESTIONS.find(q => q.id === id);

  const answerQuestion = (ans) => {
    const q = getQuestion(currentQId);
    const newAnswers = { ...answers, [q.id]: ans };
    setAnswers(newAnswers);
    setQHistory(prev => [...prev, { id: q.id, answer: ans }]);

    const nextId = ans === "yes" ? q.next_yes : q.next_no;

    if (nextId === "result") {
      setStep("result");
      return;
    }

    // Skip ethan questions if ethan not present
    if (nextId === "q_ethan_armor" && newAnswers["q_ethan_present"] === "no") {
      advanceTo("q_show_check", newAnswers);
      return;
    }
    // Skip show_hbo if show_check is no
    if (nextId === "q_show_hbo" && newAnswers["q_show_check"] === "no") {
      advanceTo("q_green_flags", newAnswers);
      return;
    }

    setCurrentQId(nextId);
  };

  const advanceTo = (id, ans) => {
    setCurrentQId(id);
  };

  const goBack = () => {
    if (!qHistory.length) { setStep("categories"); return; }
    const prev = [...qHistory];
    const last = prev.pop();
    setQHistory(prev);
    const newAnswers = { ...answers };
    delete newAnswers[last.id];
    setAnswers(newAnswers);
    setCurrentQId(last.id);
    if (step === "result") setStep("quiz");
  };

  const restart = () => {
    setStep("setup");
    setSceneName("");
    setSelectedCats([]);
    setQHistory([]);
    setCurrentQId("q_cut1");
    setAnswers({});
    setEvalNotes("");
  };

  const copyResultToNotion = () => {
    const result = computeVerdict(answers);
    const verdictLabel = result.verdict === "keep" ? "✅ KEEP" : result.verdict === "rewrite" ? "✏️ REWRITE" : "✂️ CUT";
    const text = `# Scene Evaluation: ${sceneName}\n\n**Verdict: ${verdictLabel}**\n\nKeep signals: ${result.keeps} | Warnings: ${result.warns} | Cut signals: ${result.cuts}\n\n## Notes\n${result.notes.join("\n")}\n\n## My Notes\n${evalNotes || "(none)"}`;
    navigator.clipboard.writeText(text).then(() => {
      window.open(notionUrl, "_blank");
      showToast("Evaluation copied! Paste into Notion 💋");
    });
  };

  // Progress calculation
  const totalQs = QUESTIONS.length;
  const answeredQs = qHistory.length;
  const progressPct = Math.round((answeredQs / totalQs) * 100);

  if (step === "setup") {
    return (
      <div className="eval-step0">
        <div className="section-title">🎬 Scene Evaluation</div>
        <div style={{marginBottom:"8px"}}>
          <label>What scene are we evaluating?</label>
          <input
            type="text"
            value={sceneName}
            placeholder="e.g. The Spa Scene, Samuel's Funeral, Drunk Show-Up..."
            onChange={e => setSceneName(e.target.value)}
            onKeyDown={e => e.key === "Enter" && startCategories()}
            style={{fontSize:"1.05em",padding:"12px 16px"}}
            autoFocus
          />
        </div>
        <p style={{fontSize:"0.82em",color:"var(--text-light)",marginBottom:"20px",fontStyle:"italic"}}>
          One scene at a time. Yes/no answers. You'll get an assessment at the end.
        </p>
        <button className="btn btn-primary" onClick={startCategories} disabled={!sceneName.trim()}>
          Begin Evaluation →
        </button>
      </div>
    );
  }

  if (step === "categories") {
    return (
      <div className="eval-categories">
        <div className="eval-step-label">Step 2 of 3 — Categorize</div>
        <div className="eval-scene-name">"{sceneName}"</div>
        <label style={{fontSize:"0.9em",marginBottom:"0"}}>What type of scene is this? <span style={{color:"var(--text-light)"}}>(select all that apply)</span></label>
        <div className="cat-grid">
          {CATEGORIES.map(cat => (
            <div
              key={cat.id}
              className={`cat-card${selectedCats.includes(cat.id) ? " selected" : ""}`}
              onClick={() => toggleCat(cat.id)}
            >
              <div className="cat-icon">{cat.icon}</div>
              <div className="cat-name">{cat.name}</div>
              <div className="cat-desc">{cat.desc}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:"10px",alignItems:"center"}}>
          <button className="btn btn-secondary" onClick={() => setStep("setup")}>← Back</button>
          <button className="btn btn-primary" onClick={startQuiz} disabled={!selectedCats.length}>
            Start Questions →
          </button>
          {!selectedCats.length && <span style={{fontSize:"0.8em",color:"var(--text-light)",fontStyle:"italic"}}>Select at least one category</span>}
        </div>
      </div>
    );
  }

  if (step === "quiz") {
    const q = getQuestion(currentQId);
    if (!q) { setStep("result"); return null; }

    return (
      <div className="eval-question">
        <div className="eval-step-label">"{sceneName}"</div>

        <div className="progress-bar-wrap">
          <div className="progress-bar-fill" style={{width: `${progressPct}%`}} />
        </div>
        <div className="progress-label">Question {answeredQs + 1} · {progressPct}% complete</div>

        <div className="question-section">{q.section}</div>
        <div className="question-text">{q.text}</div>
        {q.sub && <div className="question-sub">{q.sub}</div>}

        <div className="quiz-btns">
          <button className="btn btn-yes" onClick={() => answerQuestion("yes")}>✓ Yes</button>
          <button className="btn btn-no" onClick={() => answerQuestion("no")}>✗ No</button>
        </div>

        <div style={{textAlign:"center",marginTop:"20px"}}>
          <button className="btn btn-skip" onClick={goBack}>← Back</button>
        </div>

        {/* Running flag tally */}
        {(() => {
          let k=0,w=0,c=0;
          Object.entries(answers).forEach(([qid, ans]) => {
            const qq = QUESTIONS.find(x => x.id === qid);
            if (!qq) return;
            const f = ans === "yes" ? qq.flag_yes : qq.flag_no;
            if (f === "keep") k++;
            else if (f === "warn") w++;
            else if (f === "cut") c++;
          });
          if (!k && !w && !c) return null;
          return (
            <div className="flag-strip">
              {k > 0 && <span className="flag-badge flag-keep">✅ {k} keep</span>}
              {w > 0 && <span className="flag-badge flag-warn">⚠️ {w} warn</span>}
              {c > 0 && <span className="flag-badge flag-cut">✂️ {c} cut</span>}
            </div>
          );
        })()}
      </div>
    );
  }

  if (step === "result") {
    const result = computeVerdict(answers);
    const verdictClass = `result-verdict verdict-${result.verdict}`;
    const verdictLabel = result.verdict === "keep" ? "KEEP IT" : result.verdict === "rewrite" ? "REWRITE" : "CUT IT";

    return (
      <div className="eval-result">
        <div className="eval-step-label">"{sceneName}"</div>

        <div className={verdictClass}>
          <div className="verdict-icon">{result.icon}</div>
          <div className="verdict-title">{verdictLabel}</div>
          <div className="flag-summary">
            <span className="flag-count fc-keep">✅ {result.keeps} keep</span>
            <span className="flag-count fc-warn">⚠️ {result.warns} warn</span>
            <span className="flag-count fc-cut">✂️ {result.cuts} cut</span>
          </div>
          {result.notes.length > 0 && (
            <ul className="verdict-notes" style={{textAlign:"left",marginTop:"14px"}}>
              {result.notes.map((n,i) => <li key={i}>{n}</li>)}
            </ul>
          )}
        </div>

        <div className="result-notes-area">
          <label>Your notes on this scene:</label>
          <textarea
            value={evalNotes}
            onChange={e => setEvalNotes(e.target.value)}
            placeholder="What did this surface? What's your instinct? What needs to change..."
          />
        </div>

        <div className="result-actions">
          <button className="btn btn-restart" onClick={goBack}>← Review Answers</button>
          <button className="btn btn-notion" onClick={copyResultToNotion}>✦ Copy & Open Notion</button>
          <button className="btn btn-primary" onClick={restart}>New Scene ↩</button>
        </div>
      </div>
    );
  }

  return null;
}

// ─── RICH TEXT EDITOR COMPONENT ─────────────────────────────────────────────

function RichTextEditor({ content, onChange }) {
  const textRef = useRef(null);

  const applyFormatting = (before, after) => {
    const textarea = textRef.current;
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const selected = content.substring(start, end);
    const newContent = content.substring(0, start) + before + selected + after + content.substring(end);
    onChange(newContent);
  };

  const handleKeyDown = (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'b') {
      e.preventDefault();
      applyFormatting('**', '**');
    } else if ((e.metaKey || e.ctrlKey) && e.key === 'i') {
      e.preventDefault();
      applyFormatting('*', '*');
    }
  };

  return (
    <div style={{ marginBottom: "16px" }}>
      <div style={{ display: "flex", gap: "8px", marginBottom: "12px", flexWrap: "wrap", alignItems: "center" }}>
        <button
          onClick={() => applyFormatting('**', '**')}
          style={{
            backgroundColor: "#fec3e4",
            border: "1px solid #ea258d",
            padding: "6px 12px",
            borderRadius: "4px",
            cursor: "pointer",
            fontSize: "0.9em",
            fontWeight: "bold"
          }}
        >
          Bold
        </button>
        <button
          onClick={() => applyFormatting('*', '*')}
          style={{
            backgroundColor: "#fec3e4",
            border: "1px solid #ea258d",
            padding: "6px 12px",
            borderRadius: "4px",
            cursor: "pointer",
            fontSize: "0.9em",
            fontStyle: "italic"
          }}
        >
          Italic
        </button>
        <div style={{ display: "flex", gap: "4px", alignItems: "center" }}>
          <span style={{ fontSize: "0.85em", color: "#666" }}>Highlight:</span>
          {[
            { color: "rgba(255, 193, 7, 0.3)", label: "Yellow" },
            { color: "rgba(76, 175, 80, 0.3)", label: "Green" },
            { color: "rgba(244, 67, 54, 0.3)", label: "Red" },
            { color: "rgba(156, 39, 176, 0.3)", label: "Purple" }
          ].map((hl, idx) => (
            <button
              key={idx}
              onClick={() => applyFormatting(`<mark style="background-color:${hl.color}">`, '</mark>')}
              style={{
                backgroundColor: hl.color,
                border: "1px solid #ddd",
                width: "24px",
                height: "24px",
                borderRadius: "3px",
                cursor: "pointer",
                padding: "0"
              }}
              title={hl.label}
            />
          ))}
        </div>
      </div>
      <textarea
        ref={textRef}
        value={content}
        onChange={e => onChange(e.target.value)}
        onKeyDown={handleKeyDown}
        style={{
          width: "100%",
          minHeight: "200px",
          padding: "12px",
          border: "1px solid #ddd",
          borderRadius: "4px",
          fontFamily: "inherit",
          fontSize: "0.95em",
          lineHeight: "1.5"
        }}
        placeholder="Enter your notes here. Use Cmd+B for bold, Cmd+I for italic..."
      />
    </div>
  );
}

// ─── SCENE NOTES TAB (NEW NESTED STRUCTURE) ─────────────────────────────────

function SceneNotesTab({ sceneNotes, setSceneNotes, showToast }) {
  const [selectedSequenceId, setSelectedSequenceId] = useState(null);
  const [selectedSceneId, setSelectedSceneId] = useState(null);

  // Initialize first sequence and scene on mount
  React.useEffect(() => {
    if (sceneNotes && sceneNotes.length > 0 && !selectedSequenceId) {
      setSelectedSequenceId(sceneNotes[0].id);
      setSelectedSceneId(sceneNotes[0].scenes[0].id);
    }
  }, [sceneNotes]);

  const currentSequence = sceneNotes?.find(s => s.id === selectedSequenceId);
  const currentScene = currentSequence?.scenes?.find(sc => sc.id === selectedSceneId);

  const updateSceneContent = (newContent) => {
    setSceneNotes(prev => prev.map(seq =>
      seq.id === selectedSequenceId
        ? {
            ...seq,
            scenes: seq.scenes.map(scene =>
              scene.id === selectedSceneId
                ? { ...scene, content: newContent }
                : scene
            )
          }
        : seq
    ));
  };

  const addScene = () => {
    const sceneName = prompt("Enter scene name:");
    if (!sceneName) return;

    setSceneNotes(prev => prev.map(seq =>
      seq.id === selectedSequenceId
        ? {
            ...seq,
            scenes: [...seq.scenes, {
              id: `scene-${Date.now()}`,
              name: sceneName,
              content: ""
            }]
          }
        : seq
    ));
    showToast("Scene added! 💋");
  };

  const deleteScene = (sceneId) => {
    if (!confirm("Delete this scene?")) return;

    setSceneNotes(prev => prev.map(seq =>
      seq.id === selectedSequenceId
        ? {
            ...seq,
            scenes: seq.scenes.filter(s => s.id !== sceneId)
          }
        : seq
    ));

    if (selectedSceneId === sceneId && currentSequence?.scenes?.length > 1) {
      setSelectedSceneId(currentSequence.scenes[0].id);
    }
    showToast("Scene deleted 💋");
  };

  const moveScene = (fromIdx, toIdx) => {
    if (toIdx < 0 || !currentSequence || toIdx >= currentSequence.scenes.length) return;

    setSceneNotes(prev => prev.map(seq =>
      seq.id === selectedSequenceId
        ? {
            ...seq,
            scenes: (() => {
              const newScenes = [...seq.scenes];
              const [moved] = newScenes.splice(fromIdx, 1);
              newScenes.splice(toIdx, 0, moved);
              return newScenes;
            })()
          }
        : seq
    ));
  };

  if (!sceneNotes || sceneNotes.length === 0) {
    return <div className="empty-state">Initializing Scene Notes...</div>;
  }

  // If no sequence selected, show sequence list
  if (!selectedSequenceId) {
    return (
      <div>
        <div className="empty-state">
          <div className="empty-state-icon">📋</div>
          <div className="empty-state-text">Select a sequence to begin taking notes</div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: "12px" }}>
          {sceneNotes.map(seq => (
            <button
              key={seq.id}
              onClick={() => {
                setSelectedSequenceId(seq.id);
                setSelectedSceneId(seq.scenes[0].id);
              }}
              style={{
                padding: "16px",
                backgroundColor: "#fec3e4",
                border: "1px solid #ea258d",
                borderRadius: "6px",
                cursor: "pointer",
                fontSize: "0.95em",
                fontWeight: "600",
                color: "#333"
              }}
            >
              {seq.name}
            </button>
          ))}
        </div>
      </div>
    );
  }

  // Show scene list and editor
  return (
    <div>
      <div style={{ display: "flex", gap: "12px", marginBottom: "20px", alignItems: "center" }}>
        <button
          onClick={() => setSelectedSequenceId(null)}
          style={{
            backgroundColor: "#fec3e4",
            border: "1px solid #ea258d",
            padding: "8px 16px",
            borderRadius: "4px",
            cursor: "pointer",
            fontSize: "0.9em"
          }}
        >
          ← Back to Sequences
        </button>
        <h2 style={{ margin: 0, fontSize: "1.1em" }}>{currentSequence?.name}</h2>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "200px 1fr", gap: "20px" }}>
        {/* Scene List */}
        <div style={{ borderRight: "1px solid #eee", paddingRight: "16px" }}>
          <div style={{ marginBottom: "12px", fontWeight: "600", color: "#666" }}>Scenes</div>
          <div style={{ display: "flex", flexDirection: "column", gap: "8px", marginBottom: "16px" }}>
            {currentSequence?.scenes?.map((scene, idx) => (
              <div
                key={scene.id}
                draggable
                onDragStart={(e) => {
                  e.dataTransfer.effectAllowed = "move";
                  e.dataTransfer.setData("sceneIdx", idx.toString());
                }}
                onDragOver={(e) => e.preventDefault()}
                onDrop={(e) => {
                  e.preventDefault();
                  const fromIdx = parseInt(e.dataTransfer.getData("sceneIdx"));
                  moveScene(fromIdx, idx);
                }}
                onClick={() => setSelectedSceneId(scene.id)}
                style={{
                  padding: "10px",
                  backgroundColor: selectedSceneId === scene.id ? "#ea258d" : "#f5f5f5",
                  color: selectedSceneId === scene.id ? "white" : "#333",
                  borderRadius: "4px",
                  cursor: "pointer",
                  fontSize: "0.9em",
                  textAlign: "left"
                }}
              >
                {scene.name}
              </div>
            ))}
          </div>
          <button
            onClick={addScene}
            style={{
              width: "100%",
              backgroundColor: "#fec3e4",
              border: "1px solid #ea258d",
              padding: "8px",
              borderRadius: "4px",
              cursor: "pointer",
              fontSize: "0.9em"
            }}
          >
            + Add Scene
          </button>
        </div>

        {/* Scene Editor */}
        <div>
          {currentScene ? (
            <>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
                <h3 style={{ margin: 0 }}>{currentScene.name}</h3>
                <button
                  onClick={() => deleteScene(currentScene.id)}
                  style={{
                    backgroundColor: "transparent",
                    border: "none",
                    padding: "0",
                    cursor: "pointer",
                    color: "#ea258d",
                    fontSize: "1.5em",
                    lineHeight: "1",
                    width: "24px",
                    height: "24px"
                  }}
                  title="Delete scene"
                >
                  ✕
                </button>
              </div>
              <RichTextEditor content={currentScene.content} onChange={updateSceneContent} />
            </>
          ) : (
            <div className="empty-state">Select a scene to edit</div>
          )}
        </div>
      </div>
    </div>
  );
}

let nextSceneId = 1;

function ScenesTab({ scenes, setScenes, sceneDragId, sceneOverIdx, handleSceneDragStart, handleSceneDragOver, handleSceneDrop, handleSceneDragEnd }) {
  const [newTitle, setNewTitle] = useState("");
  const [newDesc, setNewDesc] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editTitle, setEditTitle] = useState("");
  const [editDesc, setEditDesc] = useState("");

  const addScene = () => {
    if (!newTitle.trim()) return;
    setScenes(prev => [...prev, {
      id: nextSceneId++,
      title: newTitle.trim(),
      description: newDesc.trim()
    }]);
    setNewTitle("");
    setNewDesc("");
    setShowForm(false);
  };

  const deleteScene = id => setScenes(prev => prev.filter(s => s.id !== id));

  const startEditing = (scene) => {
    setEditingId(scene.id);
    setEditTitle(scene.title);
    setEditDesc(scene.description);
  };

  const saveEdit = () => {
    if (!editTitle.trim()) return;
    setScenes(prev => prev.map(s =>
      s.id === editingId
        ? { ...s, title: editTitle.trim(), description: editDesc.trim() }
        : s
    ));
    setEditingId(null);
    setEditTitle("");
    setEditDesc("");
  };

  const cancelEdit = () => {
    setEditingId(null);
    setEditTitle("");
    setEditDesc("");
  };

  return (
    <div>
      <div style={{display:"flex",gap:"10px",marginBottom:"22px",flexWrap:"wrap",alignItems:"center"}}>
        <button className="btn btn-primary" onClick={() => setShowForm(f => !f)}>
          {showForm ? "✕ Cancel" : "+ New Scene"}
        </button>
        {scenes.length > 0 && (
          <span className="song-count-badge">{scenes.length} scene{scenes.length !== 1 ? "s" : ""}</span>

              <label>Scene title</label>
              <input
                type="text"
                value={newTitle}
                placeholder="e.g. The Confrontation"
                onChange={e => setNewTitle(e.target.value)}
                autoFocus
              />
            </div>
            <div>
              <label>Scene description</label>
              <textarea
                value={newDesc}
                placeholder="What happens in this scene? What beats need to be hit..."
                onChange={e => setNewDesc(e.target.value)}

              />

              draggable

              onDragOver={e => handleSceneDragOver(e, idx)}
              onDrop={e => handleSceneDrop(e, idx)}

                {editingId === scene.id ? (
                  <div style={{padding: "8px"}}>

                      onChange={e => setEditTitle(e.target.value)}

                      style={{width: "100%", padding: "8px", marginBottom: "8px", border: "1px solid var(--border-pink)", borderRadius: "4px", fontSize: "0.95em"}}
                      autoFocus

                    <textarea
                      value={editDesc}

// ─── SETTINGS TAB (UPDATED WITH SAVE/LOAD) ────────────────────────────────────

function SettingsTab({ notionUrl, setNotionUrl, songs, scenes, notes, sequences, setSongs, setScenes, setNotes, setSequences }) {
  const [draft, setDraft] = useState(notionUrl);
  const [saved, setSaved] = useState(false);
  const fileInputRef = useRef(null);

  const save = () => {
    setNotionUrl(draft);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const downloadAllData = () => {
    const data = {
      songs: songs,
      scenes: scenes,
      notes: notes,
      sequences: sequences,
      exportedAt: new Date().toISOString()
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const timestamp = new Date().toISOString().replace(/[:.]/g, '-').split('T')[0] + '_' + new Date().toLocaleTimeString().replace(/:/g, '-').split(' ')[0];
    a.download = `pick-me-data_${timestamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Download started! 💋");
  };

  const handleFileLoad = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const fileContent = event.target?.result || "";
        console.log("File content:", fileContent);
        const data = JSON.parse(fileContent);
        console.log("Parsed data:", data);
        console.log("Has songs?", !!data.songs, "Count:", data.songs?.length);
        console.log("Has scenes?", !!data.scenes, "Count:", data.scenes?.length);
        console.log("Has notes?", !!data.notes, "Count:", data.notes?.length);

        if (data.songs && data.songs.length > 0) {
          setSongs(data.songs);
          console.log("Set songs to:", data.songs.length);
        }
        if (data.scenes) {
          setScenes(data.scenes);
          console.log("Set scenes to:", data.scenes.length);
        }
        if (data.notes) {
          setNotes(data.notes);
          console.log("Set notes to:", data.notes.length);
        }
        if (data.sequences) {
          setSequences(data.sequences);
          console.log("Set sequences to:", Object.keys(data.sequences).length, "items");
        }
        localStorage.setItem("pickMeData", JSON.stringify(data));
        alert("✓ Data loaded! Songs: " + (data.songs?.length || 0) + ", Scenes: " + (data.scenes?.length || 0) + ", Notes: " + (data.notes?.length || 0) + ", Progress: " + (Object.keys(data.sequences || {}).length || 0));
        e.target.value = "";
      } catch (err) {
        console.error("Load error:", err);
        alert("Error loading file: " + err.message);
      }
    };
    reader.readAsText(file);
  };

  return (
    <div className="settings-section">
      <div className="section-title">⚙️ Settings</div>
      
      <div className="settings-field">
        <label>Notion destination URL</label>
        <input
          type="url"
          value={draft}
          onChange={e => setDraft(e.target.value)}
          placeholder="https://www.notion.so/your-page-id"
        />
        <div className="settings-hint">
          When you click "Copy & Open Notion", your notes are copied to clipboard and this page opens in a new tab. Paste with ⌘V.
          <br/><br/>
          Default: your DRAFTING NOTES page. Change this to any Notion page you want notes to land in.
        </div>
      </div>
      <button className="btn btn-primary" onClick={save}>
        {saved ? "✓ Saved!" : "Save Settings"}
      </button>

      <div style={{marginTop:"40px",borderTop:"1px solid var(--border-pink)",paddingTop:"30px"}}>
        <div style={{fontSize:"0.9em",color:"var(--text-light)",marginBottom:"16px",fontStyle:"italic"}}>
          Save and load all your data (playlist meanings, scenes, and notes) so you never start from scratch.
        </div>
        
        <div style={{display:"flex",gap:"10px",flexWrap:"wrap"}}>
          <button className="btn btn-secondary" onClick={downloadAllData}>
            ⬇ Download All Data
          </button>
          <button className="btn btn-secondary" onClick={() => fileInputRef.current?.click()}>
            ⬆ Load Data
          </button>
        </div>
        
        <input
          ref={fileInputRef}
          type="file"
          accept=".json"
          onChange={handleFileLoad}
          style={{display:"none"}}
        />
      </div>
    </div>
  );
}

// ─── FULL DRAFT NOTES TAB (NEW) ──────────────────────────────────────────────

function DraftNotesTab({ showToast, notes, setNotes }) {
  const formatNotesForDisplay = (notesArray) => {
    if (!Array.isArray(notesArray) || notesArray.length === 0) return "";
    return notesArray
      .map(n => `${n.scene ? n.scene + ": " : ""}${n.content}`)
      .join("\n\n");
  };

  const [isEditing, setIsEditing] = React.useState(false);
  const [editContent, setEditContent] = React.useState(() => {
    const saved = localStorage.getItem("draft-notes");
    if (saved) return saved;
    return formatNotesForDisplay(notes);
  });

  React.useEffect(() => {
    setEditContent(formatNotesForDisplay(notes));
  }, [notes]);

  const handleSave = () => {
    localStorage.setItem("draft-notes", editContent);
    setIsEditing(false);
    showToast("Scene notes saved! 💋");
  };

  const copyToClipboard = () => {
    navigator.clipboard.writeText(editContent).then(() => {
      showToast("Notes copied! 💋");
    });
  };

  return (
    <div>
      <div style={{marginBottom:"22px", display:"flex", gap:"12px"}}>
        <button className="btn btn-secondary" onClick={copyToClipboard}>
          📋 Copy All Notes
        </button>
        {!isEditing ? (
          <button className="btn btn-secondary" onClick={() => setIsEditing(true)}>
            ✏️ Edit Notes
          </button>
        ) : (
          <>
            <button className="btn btn-primary" onClick={handleSave}>
              ✓ Save Notes
            </button>
            <button className="btn btn-secondary" onClick={() => setIsEditing(false)}>
              ✕ Cancel
            </button>
          </>
        )}
      </div>

      {isEditing ? (
        <textarea
          value={editContent}
          onChange={(e) => setEditContent(e.target.value)}
          style={{
            width:"100%",
            minHeight:"500px",
            padding:"24px",
            fontSize:"0.95em",
            fontFamily:"inherit",
            border:"2px solid var(--neon-pink)",
            borderRadius:"4px",
            backgroundColor:"var(--card-bg)",
            color:"var(--text-dark)",
            lineHeight:"1.8",
            resize:"vertical"
          }}
        />
      ) : (
        <div className="draft-content-inner" style={{
          backgroundColor:"var(--card-bg)",
          border:"1px solid var(--border-pink)",
          borderRadius:"4px",
          padding:"24px",
          lineHeight:"1.8",
          fontSize:"0.95em",
          color:"var(--text-dark)",
          whiteSpace:"pre-wrap",
          wordWrap:"break-word"
        }}>
          {editContent || "No notes yet. Click 'Edit Notes' to add your scene notes."}
        </div>
      )}
    </div>
  );
}

        </div>

          <div style={{fontSize: "0.85em", color: "var(--text-light)", marginBottom: "16px", fontStyle: "italic", padding: "12px", backgroundColor: "#fff5f8", borderRadius: "4px", border: "1px solid var(--border-pink)"}}>

          </div>

            value={writingContent}
            onChange={e => setWritingContent(e.target.value)}

            style={{
              width: "100%",
              minHeight: "300px",
              padding: "16px",
              border: "1px solid var(--border-pink)",
              borderRadius: "4px",
              fontSize: "0.95em",
              fontFamily: "monospace",
              marginBottom: "16px",
              backgroundColor: "var(--card-bg)"
            }}
          />

              backgroundColor: "var(--neon-pink)",
              color: "white",
              border: "none",
              padding: "12px 32px",
              fontSize: "0.95em",
              fontWeight: "bold",
              borderRadius: "4px",
              cursor: "pointer"
            }}
          >
            Stop — Still Know What Comes Next
          </button>
        </div>
      )}

      {ritualStep === "writing" && showDoorInput && (
        <div style={{marginTop: "24px", padding: "16px", backgroundColor: "#fff5f8", borderRadius: "4px", border: "2px solid var(--neon-pink)"}}>
          <div style={{fontSize: "0.9em", fontWeight: "600", marginBottom: "12px", textTransform: "uppercase"}}>
            What's the door line for next time?
          </div>
          <textarea
            value={doorLine}
            onChange={e => setDoorLine(e.target.value)}
            placeholder="Write the one line that opens the door for your next session..."
            style={{
              width: "100%",
              minHeight: "60px",
              padding: "12px",
              border: "1px solid var(--border-pink)",
              borderRadius: "4px",
              fontSize: "0.95em",
              marginBottom: "12px"
            }}
          />
          <button
            onClick={saveDoorLine}
            disabled={!doorLine.trim()}
            style={{
              backgroundColor: doorLine.trim() ? "var(--neon-pink)" : "#ccc",
              color: "white",
              border: "none",
              padding: "12px 24px",
              fontSize: "0.95em",
              fontWeight: "bold",
              borderRadius: "4px",
              cursor: doorLine.trim() ? "pointer" : "not-allowed"
            }}
          >
            Session Complete
          </button>
        </div>
      )}

      {ritualStep === "complete" && (
        <div style={{textAlign: "center", paddingTop: "40px"}}>
          <div style={{fontSize: "1.4em", fontWeight: "700", color: "var(--neon-pink)", marginBottom: "16px"}}>
            ✓ Young April received your session.
          </div>
          <div style={{fontSize: "0.95em", color: "var(--text-light)", marginBottom: "32px", maxWidth: "400px", margin: "0 auto", lineHeight: "1.6"}}>
            <p style={{marginBottom: "12px"}}>You don't read today. Not tomorrow. Not until three scenes exist.</p>
            <p><strong>Your door:</strong> <em>"{doorLine}"</em></p>
          </div>
          <button
            onClick={newSession}
            style={{
              backgroundColor: "var(--neon-pink)",
              color: "white",
              border: "none",
              padding: "12px 32px",
              fontSize: "0.95em",
              fontWeight: "bold",
              borderRadius: "4px",
              cursor: "pointer"
            }}
          >
            New Session
          </button>
        </div>
      )}
    </div>
  );
}

            return parsed.notes;
          }
        }
      }

    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    setSceneOverIdx(idx);
  };
  const handleSceneDrop = (e, targetIdx) => {
    e.preventDefault();
    e.stopPropagation();
    if (sceneDragId === null) return;
    const fromIdx = scenes.findIndex(s => s.id === sceneDragId);
    if (fromIdx === targetIdx || fromIdx === -1) { setSceneDragId(null); setSceneOverIdx(null); return; }

    const [moved] = next.splice(fromIdx, 1);
    next.splice(targetIdx, 0, moved);
    setScenes(next);
    setSceneDragId(null);
    setSceneOverIdx(null);

                        </div>
                      </div>
                    </div>
                  </>
                );
              })()}
              <button className="progress-toggle-btn" onClick={() => setShowSequenceBar(false)} title="Hide progress">
                ▼
              </button>
            </>
          ) : (
            <>
              <div className="progress-feature-name">No sequences yet</div>
              <button className="progress-toggle-btn" onClick={() => setShowSequenceBar(false)} title="Hide progress">
                ▼
              </button>
            </>
          )}
        </div>
      )}

      {!showSequenceBar && (
        <div style={{display: "flex", justifyContent: "flex-end", marginBottom: "20px"}}>
          <button className="progress-toggle-btn" onClick={() => setShowSequenceBar(true)} title="Show progress">
            ▲
          </button>
        </div>
      )}

      <div className="card">
        {activeTab === "sequence" && (
          <SequenceProgressTab sequences={sequences} setSequences={setSequences} />
        )}
        {activeTab === "playlist" && (
          <PlaylistTab songs={songs} setSongs={setSongs} notionUrl={notionUrl} showToast={showToast} />
        )}
        {activeTab === "eval" && (
          <EvalTab notionUrl={notionUrl} showToast={showToast} />
        )}
        {activeTab === "scenes" && (
          <ScenesTab scenes={scenes} setScenes={setScenes} sceneDragId={sceneDragId} sceneOverIdx={sceneOverIdx} handleSceneDragStart={handleSceneDragStart} handleSceneDragOver={handleSceneDragOver} handleSceneDrop={handleSceneDrop} handleSceneDragEnd={handleSceneDragEnd} />
        )}
        {activeTab === "ritual" && (
          <PreWritingRitualTab />
        )}
        {activeTab === "question" && (
          <SceneQuestionTab />
        )}
        {activeTab === "notes" && (
          <SceneNotesTab sceneNotes={sceneNotes} setSceneNotes={setSceneNotes} showToast={showToast} />
        )}
        {activeTab === "settings" && (
          <SettingsTab notionUrl={notionUrl} setNotionUrl={setNotionUrl} songs={songs} scenes={scenes} notes={notes} sequences={sequences} setSongs={setSongs} setScenes={setScenes} setNotes={setNotes} setSequences={setSequences} />
        )}
      </div>

      <div className={`toast${toastVisible ? " show" : ""}`}>{toastMsg}</div>
    </div>
  );
}
