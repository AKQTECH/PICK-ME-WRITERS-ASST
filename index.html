    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --neon-pink: #EA258D;
            --hot-pink: #FF1493;
            --light-pink: #F37EB3;
            --bright-yellow: #FFEB3B;
            --golden: #F5952D;
            --lavender: #CACBDF;
            --mauve: #FFB6D9;
            --dusty-rose: #FFC0CB;
            --white: #FFFFFF;
            --cream: #FFFBF8;
            --black: #000000;
            --dark-gray: #1A1A1A;
            --card-bg: #FFFFFF;
            --text-dark: #000000;
            --text-mid: #333333;
            --text-light: #666666;
            --border-pink: #FFB6D9;
            --accent-pink: #EA258D;
            --accent-yellow: #FFEB3B;
            --accent-lavender: #CACBDF;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #FFB6D9;
            min-height: 100vh;
            padding: 40px 16px;
            color: var(--text-dark);
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: none;
            pointer-events: none;
            z-index: -1;
        }

        .container { max-width: 960px; margin: 0 auto; }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 50px 40px;
            background: var(--white);
            border-radius: 0;
            border: none;
            box-shadow: none;
            position: relative;
            overflow: visible;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            background: none;
            border-radius: 0;
        }
        .header-lip { font-size: 3em; margin-bottom: 16px; }
        .header h1 {
            font-family: 'Inter', sans-serif;
            font-size: 3.2em;
            font-weight: 900;
            color: var(--black);
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            line-height: 1.2;
        }
        .header-sub {
            font-size: 1em;
            color: var(--text-light);
            font-style: italic;
            opacity: 1;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        /* TABS */
        .tabs {
            margin-bottom: 20px;
            background: transparent;
            padding: 0;
        }
        .tab-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--black);
            background: var(--white);
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .tab-select:focus {
            outline: none;
            border-color: #8B0040;
            box-shadow: none;
            background: var(--white);
        }
        .tab-select:hover {
            background: #8B0040;
            border-color: #8B0040;
            color: var(--white);
        }

        /* PROGRESS BAR HEADER */
        .progress-bar-container {
            background: #FFF7FB;
            border: 1px solid #F2D9E6;
            border-radius: 4px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.85em;
        }
        .progress-bar-container.hidden {
            display: none;
        }
        .progress-feature-name {
            font-weight: 700;
            color: var(--text-dark);
            min-width: 180px;
            white-space: nowrap;
        }
        .progress-stats {
            color: var(--text-light);
            font-size: 0.8em;
            min-width: 60px;
        }
        .progress-bar-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .progress-bar-track {
            flex: 1;
            height: 6px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            display: block;
            height: 100%;
            background: #EA258D !important;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .progress-toggle-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 0.9em;
            padding: 0;
            transition: color 0.2s ease;
        }
        .progress-toggle-btn:hover {
            color: var(--neon-pink);
        }

        /* CARD */
        .card {
            background: var(--white);
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            border: none;
        }

        /* BUTTONS */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.02em;
        }
        .btn-primary {
            background: #fec3e4;
            color: #ea258d;
            box-shadow: 0 4px 12px rgba(254, 195, 228, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(254, 195, 228, 0.4); }
        .btn-secondary {
            background: var(--white);
            color: var(--black);
            border: 2px solid #8B0040;
            box-shadow: none;
        }
        .btn-secondary:hover { background: var(--light-pink); color: var(--black); }
        .btn-notion {
            background: #fec3e4;
            color: #ea258d;
            box-shadow: 0 4px 12px rgba(254, 195, 228, 0.3);
        }
        .btn-notion:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(254, 195, 228, 0.4); }
        .btn-yes {
            background: var(--neon-pink);
            color: white;
            padding: 14px 48px;
            font-size: 1.05em;
            box-shadow: 0 4px 12px rgba(234, 37, 141, 0.3);
            border: none;
        }
        .btn-yes:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(234, 37, 141, 0.4); }
        .btn-no {
            background: var(--white);
            color: var(--black);
            padding: 14px 48px;
            font-size: 1.05em;
            box-shadow: none;
            border: 2px solid var(--black);
        }
        .btn-no:hover { background: #FFB6D9; border-color: var(--black); }
        .btn-skip {
            background: transparent;
            color: var(--text-light);
            border: 1px dashed var(--border-rose);
            padding: 8px 20px;
            font-size: 0.85em;
        }
        .btn-skip:hover { background: var(--blush); }
        .btn-restart {
            background: var(--blush);
            color: var(--text-dark);
            border: 1px solid var(--border-rose);
        }
        .btn-restart:hover { background: var(--petal); }

        /* INPUTS */
        input, textarea, select {
            font-family: 'Inter', sans-serif;
            font-size: 0.95em;
            padding: 12px 16px;
            border: 2px solid var(--black);
            border-radius: 6px;
            background: white;
            color: var(--text-dark);
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #8B0040;
            box-shadow: none;
            background: white;
        }
        label {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-mid);
            display: block;
            margin-bottom: 5px;
        }

        /* SECTION TITLE */
        .section-title {
            font-family: 'Inter', sans-serif;
            font-size: 1.8em;
            font-weight: 900;
            color: var(--black);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: var(--black);
            border-radius: 0;
        }

        /* PLAYLIST */
        .playlist-controls { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; align-items: center; }
        .song-count-badge {
            margin-left: auto;
            background: #fec3e4;
            color: #ea258d;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(254, 195, 228, 0.3);
        }
        .songs-grid { display: grid; gap: 14px; }
        .song-card {
            background: linear-gradient(135deg, white 0%, var(--off-white) 100%);
            border-radius: 8px;
            border: 1px solid var(--border-warm);
            padding: 18px;
            display: grid;
            grid-template-columns: 36px 56px 1fr;
            gap: 14px;
            align-items: start;
            transition: all 0.3s ease;
            cursor: default;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .song-card:hover {
            border-color: var(--terra);
            box-shadow: 0 8px 24px rgba(184, 102, 74, 0.12);
            transform: translateY(-2px);
        }
        .song-card.drag-over {
            border-color: var(--hot-pink);
            border-style: dashed;
            background: var(--card-bg);
        }
        .song-card.dragging { opacity: 0.4; }
        .drag-handle {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-top: 6px;
            cursor: grab;
            color: var(--text-light);
            opacity: 0.5;
            align-items: center;
        }
        .drag-handle:active { cursor: grabbing; }
        .drag-handle span {
            display: block;
            width: 18px;
            height: 2px;
            background: currentColor;
            border-radius: 2px;
        }
        .song-num {
            font-size: 0.75em;
            color: var(--text-light);
            text-align: center;
            margin-top: 2px;
        }
        .song-icon {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--deep-rose), var(--hot-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .song-title { font-size: 1em; font-weight: 600; color: var(--text-dark); margin-bottom: 2px; }
        .song-artist { font-size: 0.85em; color: var(--text-mid); margin-bottom: 2px; }
        .song-album { font-size: 0.78em; color: var(--text-light); margin-bottom: 10px; }
        .meaning-label { color: var(--hot-pink) !important; font-size: 0.8em !important; }
        textarea.meaning-area {
            min-height: 56px;
            resize: vertical;
            font-size: 0.9em;
            padding: 8px 12px;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--neon-pink);
            color: white;
            padding: 14px 32px;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 700;
            letter-spacing: 0.02em;
            box-shadow: 0 8px 24px rgba(234, 37, 141, 0.3);
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            z-index: 999;
            pointer-events: none;
            border: none;
            text-transform: uppercase;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* EVALUATION */
        .eval-step0, .eval-categories, .eval-question, .eval-result { max-width: 700px; margin: 0 auto; }

        .eval-step-label {
            font-size: 0.75em;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 6px;
        }
        .eval-scene-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            color: var(--terra);
            font-style: italic;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0 24px; }
        .cat-card {
            padding: 20px;
            border: 2px solid var(--border-warm);
            border-radius: 8px;
            background: linear-gradient(135deg, white 0%, var(--off-white) 100%);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .cat-card:hover {
            border-color: var(--taupe);
            background: linear-gradient(135deg, var(--card-bg), var(--cream));
            box-shadow: 0 6px 16px rgba(184, 102, 74, 0.1);
            transform: translateY(-2px);
        }
        .cat-card.selected {
            border-color: var(--terra);
            background: linear-gradient(135deg, var(--cream), var(--mauve));
            box-shadow: 0 8px 24px rgba(184, 102, 74, 0.2), 0 0 0 4px rgba(184, 102, 74, 0.08);
            transform: translateY(-2px);
        }
        .cat-icon { font-size: 1.8em; margin-bottom: 6px; }
        .cat-name { font-weight: 700; font-size: 0.9em; color: var(--text-dark); margin-bottom: 4px; }
        .cat-desc { font-size: 0.78em; color: var(--text-mid); line-height: 1.4; }

        .progress-bar-wrap {
            background: var(--mauve);
            border-radius: 10px;
            height: 6px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .eval-question .progress-bar-fill {
            height: 100%;
            background: linear-gradient(to right, var(--terra), var(--rust));
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        .progress-label { font-size: 0.8em; color: var(--text-light); margin-bottom: 28px; }

        .question-section {
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--hot-pink);
            margin-bottom: 10px;
        }
        .question-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.5em;
            line-height: 1.5;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        .question-sub {
            font-size: 0.88em;
            color: var(--text-light);
            margin-bottom: 32px;
            line-height: 1.5;
            font-style: italic;
        }
        .quiz-btns { display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; }

        .flag-strip {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .flag-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 600;
        }
        .flag-keep { background: #D4EFDF; color: #1A7A42; }
        .flag-warn { background: #FDEBD0; color: #884A00; }
        .flag-cut  { background: #FADBD8; color: #922B21; }

        /* RESULT */
        .result-verdict {
            padding: 36px;
            border-radius: 12px;
            margin-bottom: 28px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        .verdict-keep {
            background: linear-gradient(135deg, #D4EFDF 0%, #A9DFBF 100%);
            border: 2px solid #27AE60;
            box-shadow: 0 8px 32px rgba(39, 174, 96, 0.15);
        }
        .verdict-rewrite {
            background: linear-gradient(135deg, #F0D7A8 0%, #E8C592 100%);
            border: 2px solid var(--terra);
            box-shadow: 0 8px 32px rgba(184, 102, 74, 0.15);
        }
        .verdict-cut {
            background: linear-gradient(135deg, #FADBD8 0%, #F5B7B1 100%);
            border: 2px solid #E74C3C;
            box-shadow: 0 8px 32px rgba(231, 76, 60, 0.15);
        }
        .verdict-icon { font-size: 2.8em; margin-bottom: 10px; }
        .verdict-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .verdict-keep .verdict-title { color: #1A5E30; }
        .verdict-rewrite .verdict-title { color: var(--terra); }
        .verdict-cut .verdict-title { color: #922B21; }
        .verdict-notes { font-size: 0.95em; line-height: 1.7; color: #2C2C2C; }
        .verdict-notes li { margin-bottom: 6px; margin-left: 20px; }

        .flag-summary {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .flag-count {
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.88em;
            text-align: center;
        }
        .fc-keep { background: #D4EFDF; color: #1A7A42; }
        .fc-warn { background: #FDEBD0; color: #884A00; }
        .fc-cut  { background: #FADBD8; color: #922B21; }

        .result-notes-area { margin-top: 20px; }
        .result-notes-area textarea { min-height: 80px; resize: vertical; }
        .result-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; justify-content: flex-end; }

        /* SCENE NOTES */
        .notes-controls { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; align-items: flex-end; }
        .notes-grid { display: grid; gap: 14px; }
        .note-card {
            background: linear-gradient(135deg, white 0%, var(--off-white) 100%);
            border: 1px solid var(--border-warm);
            border-radius: 8px;
            padding: 18px 20px;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .note-card:hover {
            border-color: var(--terra);
            box-shadow: 0 6px 18px rgba(184, 102, 74, 0.12);
            transform: translateY(-2px);
        }
        .note-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .note-scene-tag {
            background: #fec3e4;
            color: #ea258d;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            white-space: nowrap;
        }
        .note-delete {
            margin-left: auto;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            font-size: 1.1em;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.15s;
        }
        .note-delete:hover { background: #FADBD8; color: #C0392B; }
        .note-content {
            font-size: 0.93em;
            color: var(--text-dark);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .add-note-form {
            background: var(--card-bg);
            border: 1.5px dashed var(--border-rose);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .add-note-form-grid { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: start; }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
        }
        .empty-state-icon { font-size: 2.5em; margin-bottom: 10px; opacity: 0.5; }
        .empty-state-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.05em; }
        .scene-notes-sequence-bar {
            min-width: 0;
        }
        .scene-notes-sequence-select-wrap {
            min-width: 0;
        }
        .scene-notes-action-button,
        .scene-notes-delete-link,
        .scene-notes-add-scene-button {
            color: #ea258d !important;
            -webkit-text-fill-color: #ea258d;
            font-weight: 800;
        }
        .scene-notes-delete-link {
            display: inline-block;
            margin-top: 6px;
        }
        .scene-notes-action-primary {
            color: #fff !important;
            -webkit-text-fill-color: #fff;
        }
        .scene-notes-add-scene-button {
            border-color: #ea258d !important;
        }
        .scene-notes-select-wrap {
            min-width: 0;
        }

        /* SETTINGS */
        .settings-section {
            box-sizing: border-box;
            margin: 0 auto;
            max-width: 760px;
            width: 100%;
        }
        .settings-section *,
        .settings-section *::before,
        .settings-section *::after {
            box-sizing: border-box;
            min-width: 0;
        }
        .settings-field { margin-bottom: 20px; }
        .settings-field input,
        .settings-field textarea,
        .settings-field select {
            max-width: 100%;
            width: 100%;
        }
        .settings-hint { font-size: 0.8em; color: var(--text-light); margin-top: 5px; font-style: italic; }
        .settings-block {
            border-top: 1px solid var(--border-pink);
            margin-top: 32px;
            padding-top: 24px;
        }
        .settings-block-title {
            color: var(--hot-pink,#eb2e90);
            font-weight: 800;
            margin-bottom: 12px;
        }
        .settings-muted-copy {
            color: var(--text-light);
            font-size: 0.86em;
            line-height: 1.5;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }
        .settings-toggle-row {
            align-items: start;
            display: grid;
            gap: 12px;
            grid-template-columns: 26px minmax(0, 1fr);
            line-height: 1.5;
        }
        .settings-toggle-row input {
            height: 24px;
            margin: 2px 0 0;
            width: 24px;
        }
        .settings-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .settings-archive-list {
            display: grid;
            gap: 8px;
            margin-top: 10px;
        }
        .settings-archive-row {
            align-items: center;
            background: #fff;
            border: 1px solid var(--border-pink);
            display: grid;
            gap: 10px;
            grid-template-columns: minmax(0, 1fr) auto;
            padding: 9px 10px;
        }
        .settings-archive-row.is-task {
            align-items: start;
        }
        .settings-archive-title {
            color: #1C1410;
            font-size: 0.9em;
            font-weight: 800;
            overflow-wrap: anywhere;
        }
        .settings-archive-kicker {
            color: var(--neon-pink);
            font-size: 0.78em;
            font-weight: 800;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .settings-archive-copy {
            color: #1C1410;
            font-size: 0.86em;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }
        .settings-block .claude-notes-section {
            margin-bottom: 0 !important;
            max-width: 100%;
            overflow: hidden;
        }
        .settings-block .claude-notes-pre {
            max-width: 100%;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 640px) {
            /* Body & container */
            body { padding: 12px 8px; }
            .container { max-width: 100%; }

            /* Header — strip down to essentials */
            .header { padding: 16px 12px; margin-bottom: 16px; }
            .header-lip { display: none; }
            .header h1 { font-size: 1.3em; letter-spacing: 0; }
            .header-sub { font-size: 0.8em; }

            /* Tabs */
            .cat-grid { grid-template-columns: 1fr; }
            .add-note-form-grid { grid-template-columns: 1fr; }
            .song-card { grid-template-columns: 28px 44px 1fr; gap: 8px; }
            .tabs { flex-direction: column; }

            /* Progress bar */
            .progress-bar-container { padding: 8px 10px; font-size: 0.75em; }
            .progress-feature-name { min-width: 120px; font-size: 0.8em; }

            /* Scene cards (Scenes To Write tab) — compact, no square */
            .scenes-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .scene-card {
                min-height: auto;
                aspect-ratio: unset;
                padding: 12px;
                flex-direction: column;
            }
            .scene-card-label { font-size: 0.75em; }
            .scene-drag-handle { display: none; }

            /* Scene Notes tab — stack sidebar on top */
            .scene-notes-grid {
                grid-template-columns: 1fr !important;
            }
            .scene-notes-sequence-bar,
            .scene-notes-rename-row {
                display: grid !important;
                grid-template-columns: 1fr !important;
                gap: 10px !important;
                align-items: stretch !important;
            }
            .scene-notes-sequence-bar button,
            .scene-notes-rename-row button,
            .scene-notes-add-scene-button {
                min-height: 44px;
                width: 100%;
            }
            .scene-notes-grid > div:first-child {
                border-right: none !important;
                padding-right: 0 !important;
                border-bottom: 1px solid #eb2e90;
                padding-bottom: 12px;
                margin-bottom: 16px;
            }
            .settings-section { max-width: none; }
            .settings-actions { display: grid; grid-template-columns: 1fr; }
            .settings-actions .btn,
            .settings-archive-row .btn { width: 100%; }
            .settings-archive-row { grid-template-columns: 1fr; }

            /* Card general */
            .card { padding: 16px 12px; margin-bottom: 12px; }
        }

        /* SCENE CARDS (NEW) */
        .scenes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

function getInitialSceneCards() {
  return SCRIPT_COMPANION_PRELOAD.map((card, index) => normalizeCard({
    ...card,
    order: Number(card.order || index),
    changes: safeArray(card.changes).map((change, changeIndex) => ({
      id: change.id || ("change-" + slugify(card.title) + "-" + changeIndex),
      verb: change.verb || "ADJUST",
      text: change.text || "",
      done: !!change.done
    }))
  }, index));
}
function isLegacyUnsequencedSceneList(scenes) {
  const cards = safeArray(scenes).filter(card => {
    if (card && (card.archived || card.maybe)) return false;
    const kind = String(card && (card.kind || card.type || "SCENE")).toUpperCase();
    return kind === "SCENE" || kind === "TWEAK";
  });
  if (cards.length < 60) return false;
  const unassigned = cards.filter(card => !asId(card && card.sequence)).length;
  const companionSourced = cards.filter(card => String(card && card.source || "").includes("CLAUDE_SCENE_LIST_PRELOAD") || String(card && card.id || "").startsWith("companion-")).length;
  return (unassigned / cards.length) >= 0.85 && companionSourced < 10;
}
function backupLegacyUnsequencedSceneList(savedState) {

    const comparable = { ...safeObject(savedState) };
    delete comparable.appVersion;
    delete comparable.lastModified;
    const signature = stableStringify(comparable);
    for (let index = 0; index < localStorage.length; index++) {
      const key = localStorage.key(index);
      if (!key || !key.startsWith(prefix)) continue;
      const previous = localStorage.getItem(key);
      if (previous === serialized) return;
      try {
        const priorComparable = { ...safeObject(JSON.parse(previous)) };
        delete priorComparable.appVersion;
        delete priorComparable.lastModified;
        if (stableStringify(priorComparable) === signature) return;

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function computeVerdict(answers) {
  let keeps = 0, warns = 0, cuts = 0;
  const notes = [];

  QUESTIONS.forEach(q => {
    const ans = answers[q.id];
    if (ans === undefined) return;
    const flag = ans === "yes" ? q.flag_yes : q.flag_no;
    if (flag === "keep") keeps++;
    else if (flag === "warn") warns++;
    else if (flag === "cut") cuts++;
  });

  // Specific note logic
  if (answers["q_cut4"] === "yes") notes.push("The story holds without this scene — identify exactly what it's earning before you keep it.");
  if (answers["q_cut1"] === "no" && answers["q_cut2"] === "no" && answers["q_cut3"] === "no") notes.push("No relationship shift, no unique info, no obstacle. Strong cut candidate unless it's pure comedy that earns its place.");
  if (answers["q_momentum"] === "yes") notes.push("Pacing drag detected. What emotional payoff justifies the slowdown?");
  if (answers["q_voice"] === "no") notes.push("Autumn's voice feels off. Reconnect her to the wound: she wants to be wanted and can't believe she is.");
  if (answers["q_ethan_armor"] === "no" && answers["q_ethan_present"] === "yes") notes.push("Ethan's production armor is absent — is that a choice? His arc depends on this pattern being visible.");
  if (answers["q_ethan_agency"] === "yes") notes.push("Ethan is writing someone's ending for them. Flag intentional or unintentional — both matter.");
  if (answers["q_show_visibility"] === "no" && answers["q_show_check"] === "yes") notes.push("Show mechanic present but not interrogating Autumn's wound. The format should cost her something.");
  if (answers["q_green_flags"] === "no") notes.push("Green flag opportunity missed. Can Ethan do something small and specific here that Autumn deflects?");
  if (answers["q_panty_seat"] === "no") notes.push("No Panty Seat List root. Consider: which of the 30 truths does this scene speak to?");

  const _keepIcon = (
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="22" cy="22" r="20" fill="#D4EFDF" stroke="#1A5E30" strokeWidth="2.5"/>
      <path d="M12 22l7 8 13-16" stroke="#1A5E30" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
  const _rewriteIcon = (
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="22" cy="22" r="20" fill="#F0D7A8" stroke="#B7560E" strokeWidth="2.5"/>
      <path d="M30 17a10 10 0 1 0 2 8" stroke="#B7560E" strokeWidth="3" strokeLinecap="round" fill="none"/>
      <path d="M31 10v8h-8" stroke="#B7560E" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
    </svg>
  );
  const _cutIcon = (
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="22" cy="22" r="20" fill="#FADBD8" stroke="#922B21" strokeWidth="2.5"/>
      <path d="M14 14l16 16M30 14L14 30" stroke="#922B21" strokeWidth="3.5" strokeLinecap="round"/>
    </svg>
  );
  let verdict, icon;
  const total = keeps + warns + cuts;
  if (cuts >= 2) { verdict = "cut"; icon = _cutIcon; }
  else if (warns >= 3 || (warns >= 2 && cuts >= 1)) { verdict = "rewrite"; icon = _rewriteIcon; }
  else if (keeps >= Math.ceil(total * 0.5)) { verdict = "keep"; icon = _keepIcon; }
  else { verdict = "rewrite"; icon = _rewriteIcon; }

  return { verdict, icon, keeps, warns, cuts, notes };
}

function formatPlaylistForNotion(songs) {
  const withMeaning = songs.filter(s => s.meaning.trim());
  if (!withMeaning.length) return "No meanings written yet.";
  return "# Pick Me Playlist — Story Notes\n\n" +
    withMeaning.map((s, i) =>
      `## ${i+1}. ${s.title} — ${s.artist}\n${s.meaning}`
    ).join("\n\n");
}

function formatNotesForNotion(notes) {
  if (!notes.length) return "No notes yet.";
  return "# Scene Notes\n\n" +
    notes.map(n =>
      `## Scene: ${n.scene || "Untitled"}\n${n.content}`
    ).join("\n\n---\n\n");
}

// ─── TOAST ───────────────────────────────────────────────────────────────────

function useToast() {
  const [msg, setMsg] = useState("");
  const [visible, setVisible] = useState(false);
  const timer = useRef(null);

  const show = useCallback((m) => {
    setMsg(m);
    setVisible(true);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setVisible(false), 2800);
  }, []);

  return { msg, visible, show };
}

// ─── PLAYLIST TAB ────────────────────────────────────────────────────────────

function PlaylistTab({ songs, setSongs, notionUrl, showToast }) {
  const [dragId, setDragId] = useState(null);
  const [overIdx, setOverIdx] = useState(null);

  const updateMeaning = (id, val) =>
    setSongs(prev => prev.map(s => s.id === id ? { ...s, meaning: val } : s));

  const deleteSong = (id) =>
    setSongs(prev => markDeletedInList(prev, id));

  const addSong = () => {
    const newSong = {
      id: Date.now(),
      title: "",
      artist: "",
      album: "",
      meaning: "",
      isNew: true
    };
    setSongs(prev => [newSong, ...prev]);
  };

  const handleDragStart = (e, id) => {
    setDragId(id);
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/html", "");
  };
  const handleDragOver = (e, idx) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    setOverIdx(idx);
  };
  const handleDrop = (e, targetIdx) => {
    e.preventDefault();
    e.stopPropagation();
    if (dragId === null) return;
    const fromIdx = songs.findIndex(s => s.id === dragId);
    if (fromIdx === targetIdx || fromIdx === -1) { setDragId(null); setOverIdx(null); return; }
    const next = [...songs];
    const [moved] = next.splice(fromIdx, 1);
    next.splice(targetIdx, 0, moved);
    setSongs(next);
    setDragId(null);
    setOverIdx(null);
  };
  const handleDragEnd = () => { setDragId(null); setOverIdx(null); };

  const copyToNotion = () => {
    const text = formatPlaylistForNotion(songs);
    navigator.clipboard.writeText(text).then(() => {
      window.open(notionUrl, "_blank");
      showToast("Copied! Paste into your Notion page 💋");
    });
  };

  const downloadTxt = () => {
    const text = formatPlaylistForNotion(songs);
    const a = document.createElement("a");
    a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(text);
    a.download = "pick-me-playlist.txt";
    a.click();
  };

  return (
    <div>
      <div className="playlist-controls">
        <button className="btn btn-primary" onClick={copyToNotion}>✦ Copy & Open Notion</button>
        <button className="btn btn-secondary" onClick={downloadTxt}>⬇ Download .txt</button>
        <span className="song-count-badge">{songs.length} songs</span>
      </div>
      <p style={{fontSize:"0.82em",color:"var(--text-light)",marginBottom:"18px",fontStyle:"italic"}}>
        Drag the ≡ handle to reorder songs into story sequence.
      </p>
      <button onClick={addSong} style={{marginBottom:"16px",padding:"10px 16px",backgroundColor:"var(--neon-pink)",color:"white",border:"none",borderRadius:"4px",cursor:"pointer",fontWeight:"bold"}}>+ Add Song</button>
      <div className="songs-grid">
        {songs.map((song, idx) => (
          <div
            key={song.id}
            className={`song-card${dragId === song.id ? " dragging" : ""}${overIdx === idx && dragId !== song.id ? " drag-over" : ""}`}
            draggable
            onDragStart={e => handleDragStart(e, song.id)}
            onDragOver={e => handleDragOver(e, idx)}
            onDrop={e => handleDrop(e, idx)}
            onDragEnd={handleDragEnd}
          >
            <div className="drag-handle" title="Drag to reorder">
              <span/><span/><span/>
              <div className="song-num">{idx+1}</div>
            </div>
            <div className="song-icon">🎵</div>
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div className="song-title">{song.title}</div>
                  <div className="song-artist">{song.artist}</div>
                  <div className="song-album">{song.album}</div>
                </div>
                <button onClick={(e) => {e.stopPropagation(); deleteSong(song.id);}} style={{backgroundColor:"#f5d5d8",color:"#d9647f",border:"none",padding:"1px 4px",borderRadius:"2px",cursor:"pointer",fontWeight:"bold",fontSize:"14px",lineHeight:"1"}}>×</button>
              </div>
              {song.isNew && (
                <>
                  <input type="text" value={song.title} onChange={(e) => setSongs(prev => prev.map(s => s.id === song.id ? {...s, title: e.target.value, isNew: e.target.value ? true : true} : s))} placeholder="Song title..." style={{width:"100%",padding:"8px",marginBottom:"8px",border:"1px solid #ddd",borderRadius:"4px",fontSize:"0.95em"}} />
                  <input type="text" value={song.artist} onChange={(e) => setSongs(prev => prev.map(s => s.id === song.id ? {...s, artist: e.target.value} : s))} placeholder="Artist..." style={{width:"100%",padding:"8px",marginBottom:"8px",border:"1px solid #ddd",borderRadius:"4px",fontSize:"0.95em"}} />
                  <input type="text" value={song.album} onChange={(e) => setSongs(prev => prev.map(s => s.id === song.id ? {...s, album: e.target.value} : s))} placeholder="Album..." style={{width:"100%",padding:"8px",marginBottom:"8px",border:"1px solid #ddd",borderRadius:"4px",fontSize:"0.95em"}} />
                  <button onClick={() => {if(song.title.trim()) setSongs(prev => prev.map(s => s.id === song.id ? {...s, isNew: false} : s));}} disabled={!song.title.trim()} style={{backgroundColor:song.title.trim()?"var(--neon-pink)":"#ccc",color:"white",border:"none",padding:"8px 12px",borderRadius:"4px",cursor:song.title.trim()?"pointer":"not-allowed",fontWeight:"bold",fontSize:"0.95em",width:"100%",marginTop:"8px"}}>Save Song</button>
                </>
              )}
              <label className="meaning-label">What did this song inspire?</label>
              <textarea
                className="meaning-area"
                value={song.meaning}
                placeholder="What moment, feeling, or character truth does this song speak to..."
                onChange={e => updateMeaning(song.id, e.target.value)}
              />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── SCENE EVALUATION TAB ────────────────────────────────────────────────────

function EvalTab({ notionUrl, showToast }) {
  const [step, setStep] = useState("setup"); // setup | categories | quiz | result
  const [sceneName, setSceneName] = useState("");
  const [selectedCats, setSelectedCats] = useState([]);
  const [qHistory, setQHistory] = useState([]);   // [{id, answer}]
  const [currentQId, setCurrentQId] = useState("q_cut1");
  const [answers, setAnswers] = useState({});
  const [evalNotes, setEvalNotes] = useState("");

  const toggleCat = id =>
    setSelectedCats(prev => prev.includes(id) ? prev.filter(c => c !== id) : [...prev, id]);

  const startCategories = () => {
    if (!sceneName.trim()) return;
    setStep("categories");
  };

  const startQuiz = () => {
    if (!selectedCats.length) return;
    setStep("quiz");
    setCurrentQId("q_cut1");
    setAnswers({});
    setQHistory([]);
  };

  const getQuestion = id => QUESTIONS.find(q => q.id === id);

  const answerQuestion = (ans) => {
    const q = getQuestion(currentQId);
    const newAnswers = { ...answers, [q.id]: ans };
    setAnswers(newAnswers);
    setQHistory(prev => [...prev, { id: q.id, answer: ans }]);

    const nextId = ans === "yes" ? q.next_yes : q.next_no;

    if (nextId === "result") {
      setStep("result");
      return;
    }

    // Skip ethan questions if ethan not present
    if (nextId === "q_ethan_armor" && newAnswers["q_ethan_present"] === "no") {
      advanceTo("q_show_check", newAnswers);
      return;
    }
    // Skip show_hbo if show_check is no
    if (nextId === "q_show_hbo" && newAnswers["q_show_check"] === "no") {
      advanceTo("q_green_flags", newAnswers);
      return;
    }

    setCurrentQId(nextId);
  };

  const advanceTo = (id, ans) => {
    setCurrentQId(id);
  };

  const goBack = () => {
    if (!qHistory.length) { setStep("categories"); return; }
    const prev = [...qHistory];
    const last = prev.pop();
    setQHistory(prev);
    const newAnswers = { ...answers };
    delete newAnswers[last.id];
    setAnswers(newAnswers);
    setCurrentQId(last.id);
    if (step === "result") setStep("quiz");
  };

  const restart = () => {
    setStep("setup");
    setSceneName("");
    setSelectedCats([]);
    setQHistory([]);
    setCurrentQId("q_cut1");
    setAnswers({});
    setEvalNotes("");
  };

  const copyResultToNotion = () => {
    const result = computeVerdict(answers);
    const verdictLabel = result.verdict === "keep" ? " KEEP" : result.verdict === "rewrite" ? "REWRITE" : " CUT";
    const text = `# Scene Evaluation: ${sceneName}\n\n**Verdict: ${verdictLabel}**\n\nKeep signals: ${result.keeps} | Warnings: ${result.warns} | Cut signals: ${result.cuts}\n\n## Notes\n${result.notes.join("\n")}\n\n## My Notes\n${evalNotes || "(none)"}`;
    navigator.clipboard.writeText(text).then(() => {
      window.open(notionUrl, "_blank");
      showToast("Evaluation copied! Paste into Notion 💋");
    });
  };

  // Progress calculation
  const totalQs = QUESTIONS.length;
  const answeredQs = qHistory.length;
  const progressPct = Math.round((answeredQs / totalQs) * 100);

  if (step === "setup") {
    return (
      <div className="eval-step0">
        <div className="section-title">Scene Evaluation</div>
        <div style={{marginBottom:"8px"}}>
          <label>What scene are we evaluating?</label>
          <input
            type="text"
            value={sceneName}
            placeholder="e.g. The Spa Scene, Samuel's Funeral, Drunk Show-Up..."
            onChange={e => setSceneName(e.target.value)}
            onKeyDown={e => e.key === "Enter" && startCategories()}
            style={{fontSize:"1.05em",padding:"12px 16px"}}
            autoFocus
          />
        </div>
        <p style={{fontSize:"0.82em",color:"var(--text-light)",marginBottom:"20px",fontStyle:"italic"}}>
          One scene at a time. Yes/no answers. You'll get an assessment at the end.
        </p>
        <button className="btn btn-primary" onClick={startCategories} disabled={!sceneName.trim()}>
          Begin Evaluation →
        </button>
      </div>
    );
  }

  if (step === "categories") {
    return (
      <div className="eval-categories">
        <div className="eval-step-label">Step 2 of 3 — Categorize</div>
        <div className="eval-scene-name">"{sceneName}"</div>
        <label style={{fontSize:"0.9em",marginBottom:"0"}}>What type of scene is this? <span style={{color:"var(--text-light)"}}>(select all that apply)</span></label>
        <div className="cat-grid">
          {CATEGORIES.map(cat => (
            <div
              key={cat.id}
              className={`cat-card${selectedCats.includes(cat.id) ? " selected" : ""}`}
              onClick={() => toggleCat(cat.id)}
            >
              <div className="cat-icon"><CategoryIcon id={cat.id} /></div>
              <div className="cat-name">{cat.name}</div>
              <div className="cat-desc">{cat.desc}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:"10px",alignItems:"center"}}>
          <button className="btn btn-secondary" onClick={() => setStep("setup")}>← Back</button>
          <button className="btn btn-primary" onClick={startQuiz} disabled={!selectedCats.length}>
            Start Questions →
          </button>
          {!selectedCats.length && <span style={{fontSize:"0.8em",color:"var(--text-light)",fontStyle:"italic"}}>Select at least one category</span>}
        </div>
      </div>
    );
  }

  if (step === "quiz") {
    const q = getQuestion(currentQId);
    if (!q) { setStep("result"); return null; }

    return (
      <div className="eval-question">
        <div className="eval-step-label">"{sceneName}"</div>

        <div className="progress-bar-wrap">
          <div className="progress-bar-fill" style={{width: `${progressPct}%`}} />
        </div>
        <div className="progress-label">Question {answeredQs + 1} · {progressPct}% complete</div>

        <div className="question-section">{q.section}</div>
        <div className="question-text">{q.text}</div>
        {q.sub && <div className="question-sub">{q.sub}</div>}

        <div className="quiz-btns">
          <button className="btn btn-yes" onClick={() => answerQuestion("yes")}>✓ Yes</button>
          <button className="btn btn-no" onClick={() => answerQuestion("no")}>✗ No</button>
        </div>

        <div style={{textAlign:"center",marginTop:"20px"}}>
          <button className="btn btn-skip" onClick={goBack}>← Back</button>
        </div>

        {/* Running flag tally */}
        {(() => {
          let k=0,w=0,c=0;
          Object.entries(answers).forEach(([qid, ans]) => {
            const qq = QUESTIONS.find(x => x.id === qid);
            if (!qq) return;
            const f = ans === "yes" ? qq.flag_yes : qq.flag_no;
            if (f === "keep") k++;
            else if (f === "warn") w++;
            else if (f === "cut") c++;
          });
          if (!k && !w && !c) return null;
          return (
            <div className="flag-strip">
              {k > 0 && <span className="flag-badge flag-keep">{k} keep</span>}
              {w > 0 && <span className="flag-badge flag-warn">{w} warn</span>}
              {c > 0 && <span className="flag-badge flag-cut">{c} cut</span>}
            </div>
          );
        })()}
      </div>
    );
  }

  if (step === "result") {
    const result = computeVerdict(answers);
    const verdictClass = `result-verdict verdict-${result.verdict}`;
    const verdictLabel = result.verdict === "keep" ? "KEEP IT" : result.verdict === "rewrite" ? "REWRITE" : "CUT IT";

    return (
      <div className="eval-result">
        <div className="eval-step-label">"{sceneName}"</div>

        <div className={verdictClass}>
          <div className="verdict-icon">{result.icon}</div>
          <div className="verdict-title">{verdictLabel}</div>
          <div className="flag-summary">
            <span className="flag-count fc-keep">{result.keeps} keep</span>
            <span className="flag-count fc-warn">{result.warns} warn</span>
            <span className="flag-count fc-cut">{result.cuts} cut</span>
          </div>
          {result.notes.length > 0 && (
            <ul className="verdict-notes" style={{textAlign:"left",marginTop:"14px"}}>
              {result.notes.map((n,i) => <li key={i}>{n}</li>)}
            </ul>
          )}
        </div>

        <div className="result-notes-area">
          <label>Your notes on this scene:</label>
          <textarea
            value={evalNotes}
            onChange={e => setEvalNotes(e.target.value)}
            placeholder="What did this surface? What's your instinct? What needs to change..."
          />
        </div>

        <div className="result-actions">
          <button className="btn btn-restart" onClick={goBack}>← Review Answers</button>
          <button className="btn btn-notion" onClick={copyResultToNotion}>✦ Copy & Open Notion</button>
          <button className="btn btn-primary" onClick={restart}>New Scene</button>
        </div>
      </div>
    );
  }

  return null;
}

function RichTextEditor({ content, onChange }) {
  const editorRef = useRef(null);
  // Track what we last pushed into the DOM so we don't clobber user cursor on re-render
  const syncedRef = useRef(null);

  // Initial mount: write content once
  useEffect(() => {
    if (editorRef.current) {
      editorRef.current.innerHTML = content || "";
      syncedRef.current = content || "";
    }
  }, []); // eslint-disable-line

  // When scene changes from outside, refresh DOM only if content truly differs
  useEffect(() => {
    if (editorRef.current && content !== syncedRef.current) {
      editorRef.current.innerHTML = content || "";
      syncedRef.current = content || "";
    }
  }, [content]);

  const syncToState = () => {
    if (editorRef.current) {
      const html = editorRef.current.innerHTML;
      syncedRef.current = html;
      onChange(html);
    }
  };

  const execCmd = (cmd, value) => {
    editorRef.current && editorRef.current.focus();
    document.execCommand(cmd, false, value || null);
    syncToState();
  };

  const applyHighlight = (color) => {
    editorRef.current && editorRef.current.focus();
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || !sel.toString()) return;
    // Use the browser's native hiliteColor — handles multi-node selections safely
    // (manual surroundContents breaks when selection crosses block boundaries)
    document.execCommand("hiliteColor", false, color);
    syncToState();
  };

  const insertBullet = () => {
    editorRef.current && editorRef.current.focus();
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    const range = sel.getRangeAt(0);
    let node = range.startContainer;
    let offset = range.startOffset;
    let atLineStart = offset === 0;
    if (!atLineStart && node.nodeType === Node.TEXT_NODE) {
      const before = node.textContent.substring(0, offset);
      atLineStart = before.endsWith("\n") || before === "";
    }
    const textToInsert = atLineStart ? "• " : "\n• ";
    document.execCommand("insertText", false, textToInsert);
    syncToState();
  };

  const insertSubBullet = () => {
    editorRef.current && editorRef.current.focus();
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    const range = sel.getRangeAt(0);
    let node = range.startContainer;
    let offset = range.startOffset;
    let atLineStart = offset === 0;
    if (!atLineStart && node.nodeType === Node.TEXT_NODE) {
      const before = node.textContent.substring(0, offset);
      atLineStart = before.endsWith("\n") || before === "";
    }
    const textToInsert = atLineStart ? "  ○ " : "\n  ○ ";
    document.execCommand("insertText", false, textToInsert);
    syncToState();
  };

  const handleKeyDown = (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "b") {
      e.preventDefault();
      execCmd("bold");
    } else if ((e.metaKey || e.ctrlKey) && e.key === "i") {
      e.preventDefault();
      execCmd("italic");
    } else if ((e.metaKey || e.ctrlKey) && e.key === "s") {
      e.preventDefault();
      execCmd("strikeThrough");
    } else if (e.key === " ") {
      // Auto-convert "- " at start of line to "• "
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        const node = range.startContainer;
        if (node.nodeType === Node.TEXT_NODE) {
          const before = node.textContent.substring(0, range.startOffset);
          const lastNl = before.lastIndexOf("\n");
          const currentLine = before.substring(lastNl + 1);
          if (currentLine === "-") {
            e.preventDefault();
            const newRange = range.cloneRange();
            newRange.setStart(node, range.startOffset - 1);
            newRange.setEnd(node, range.startOffset);
            sel.removeAllRanges();
            sel.addRange(newRange);
            document.execCommand("insertText", false, "\u2022 ");
            syncToState();
            return;
          }
        }
      }
    } else if (e.key === "Tab") {
      e.preventDefault();
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      const node = range.startContainer;
      if (node.nodeType === Node.TEXT_NODE) {
        const before = node.textContent.substring(0, range.startOffset);
        const lastNl = before.lastIndexOf("\n");
        const currentLine = before.substring(lastNl + 1);
        if (!e.shiftKey) {
          // Tab: if line starts with "• " convert to "  ○ ", else insert "  ○ "
          if (currentLine === "• ") {
            const newRange = range.cloneRange();
            newRange.setStart(node, range.startOffset - 2);
            newRange.setEnd(node, range.startOffset);
            sel.removeAllRanges();
            sel.addRange(newRange);
            document.execCommand("insertText", false, "  ○ ");
          } else {
            document.execCommand("insertText", false, "  ○ ");
          }
        } else {
          // Shift+Tab: if line starts with "  ○ " convert back to "• "
          if (currentLine === "  ○ ") {
            const newRange = range.cloneRange();
            newRange.setStart(node, range.startOffset - 4);
            newRange.setEnd(node, range.startOffset);
            sel.removeAllRanges();
            sel.addRange(newRange);
            document.execCommand("insertText", false, "• ");
          }
        }
        syncToState();
      }
    } else if (e.key === "Enter") {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        const node = range.startContainer;
        const before = node.nodeType === Node.TEXT_NODE
          ? node.textContent.substring(0, range.startOffset) : "";
        const lastNl = before.lastIndexOf("\n");
        const currentLine = before.substring(lastNl + 1);
        if (currentLine.startsWith("  ○ ")) {
          if (currentLine === "  ○ ") { return; } // empty sub-bullet — escape
          e.preventDefault();
          document.execCommand("insertText", false, "\n  ○ ");
          syncToState();
        } else if (currentLine.startsWith("• ")) {
          if (currentLine === "• ") { return; } // empty bullet — escape
          e.preventDefault();
          document.execCommand("insertText", false, "\n• ");
          syncToState();
        }
      }
    }
  };

  const toolbarBtn = (extra = {}) => ({
    backgroundColor: "#fec3e4",
    border: "1px solid #8B0040",
    padding: "6px 12px",
    borderRadius: "4px",
    cursor: "pointer",
    fontSize: "0.9em",
    color: "#333",
    ...extra
  });

  const highlights = [
    { color: "#f2ffd6", label: "Lime" },
    { color: "#ffd4f2", label: "Pink" },
    { color: "#d6cffc", label: "Periwinkle" },
  ];

  return (
    <div style={{ marginBottom: "16px" }}>
      {/* Mini toolbar: bullet + highlight dots */}
      <div style={{ display:"flex", alignItems:"center", gap:"5px", marginBottom:"5px", paddingLeft:"2px" }}>
        <button
          onMouseDown={e=>{ e.preventDefault(); insertBullet(); }}
          title="Insert bullet"
          style={{ background:"none", border:"none", cursor:"pointer", fontSize:"0.65em", color:"#000", padding:"1px 4px", lineHeight:1, fontWeight:700 }}
        >•</button>
        <span style={{ width:"1px", height:"10px", background:"#f0c0da", display:"inline-block", margin:"0 1px" }}/>
        {highlights.map(h=>(
          <button
            key={h.color}
            onMouseDown={e=>{ e.preventDefault(); applyHighlight(h.color); }}
            title={"Highlight " + h.label}
            style={{ width:"11px", height:"11px", borderRadius:"50%", background:h.color, border:"1px solid rgba(0,0,0,0.12)", cursor:"pointer", padding:0, flexShrink:0, display:"inline-block" }}
          />
        ))}
      </div>

      <div
        ref={editorRef}
        contentEditable
        suppressContentEditableWarning
        onInput={syncToState}
        onKeyDown={handleKeyDown}
        style={{
          width: "100%",
          minHeight: "200px",
          padding: "12px",
          border: "1px solid #ddd",
          borderRadius: "4px",
          fontFamily: "inherit",
          fontSize: "0.95em",
          lineHeight: "1.6",
          outline: "none",
          overflowY: "auto",
          whiteSpace: "pre-wrap",
          wordBreak: "break-word",
          cursor: "text",
          color: "#000"
        }}
      />
    </div>
  );
}

  const updated = { ...sequences };
  delete updated[id];

};

  React.useEffect(() => {
    if (!sceneNotes || sceneNotes.length === 0) return;
    const savedSeqId = localStorage.getItem("pickMe_selectedSeqId");

                    const arr = [...seq.scenes];
                    const fromIdx = arr.findIndex(s => s.id === fromId);
                    const toIdx = arr.findIndex(s => s.id === scene.id);
                    if (fromIdx === -1 || toIdx === -1) return seq;
                    const [moved] = arr.splice(fromIdx, 1);
                    arr.splice(toIdx, 0, moved);
                    return { ...seq, scenes: arr };
                  }));
                  sidebarDragIdRef.current = null;
                }}
                onDragEnd={() => { sidebarDragIdRef.current = null; }}
                onClick={() => { if (renamingSceneId !== scene.id) setSelectedSceneId(scene.id); }}
                style={{
                  padding: "8px 10px",
                  backgroundColor: selectedSceneId === scene.id ? "#ea258d" : "#fec3e4",
                  color: selectedSceneId === scene.id ? "white" : "#333",
                  border: "1px solid " + (selectedSceneId === scene.id ? "#8B0040" : "#D8D0D4"),
                  borderRadius: "6px",
                  cursor: "pointer",
                  fontSize: "0.88em"
                }}
              >
                {/* Scene name row */}
                {renamingSceneId === scene.id ? (
                  <div onClick={e => e.stopPropagation()}>
                    <input
                      autoFocus
                      value={sceneNameDraft}
                      onChange={e => setSceneNameDraft(e.target.value)}
                      onKeyDown={e => { if (e.key === "Enter") saveRenameScene(scene.id); if (e.key === "Escape") setRenamingSceneId(null); }}
                      style={{ width: "100%", padding: "4px 6px", border: "1px solid #eb2e90", borderRadius: "3px", fontSize: "0.9em" }}
                    />
                    <div style={{ display: "flex", gap: "4px", marginTop: "4px" }}>
                      <button onClick={() => saveRenameScene(scene.id)} style={{ flex: 1, padding: "3px", backgroundColor: "#ea258d", color: "white", border: "none", borderRadius: "3px", cursor: "pointer", fontSize: "0.75em", fontWeight: "700" }}>Save</button>
                      <button onClick={() => setRenamingSceneId(null)} style={{ flex: 1, padding: "3px", backgroundColor: "rgba(255,255,255,0.5)", border: "none", borderRadius: "3px", cursor: "pointer", fontSize: "0.75em" }}>Cancel</button>
                    </div>
                  </div>
                ) : (
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span
                      onDoubleClick={e => startRenameScene(scene, e)}
                      title="Double-click to rename"
                      style={{ flex: 1, lineHeight: "1.3" }}
                    >{scene.name}</span>
                    <button
                      onClick={e => deleteScene(scene.id, e)}
                      title="Delete"
                      style={iconBtn({ color: selectedSceneId === scene.id ? "rgba(255,255,255,0.7)" : "#c00", fontSize: "0.65em", padding: "1px 3px" })}
                    >✕</button>
                  </div>
                )}
              </div>
            ))}
          </div>
          <button
            onClick={addScene}
            className="scene-notes-add-scene-button"
            style={{ width: "100%", backgroundColor: "#fec3e4", color:"#ea258d", border: "1px solid #ea258d", padding: "8px", borderRadius: "6px", cursor: "pointer", fontSize: "0.88em", fontWeight: "800" }}
          >
            + Add Scene
          </button>
        </div>
        )}

        {/* Editor panel */}
        <div>
          {currentScene ? (
            <>
              <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "14px", flexWrap: "wrap" }}>
                <h3 style={{ margin: 0, fontSize: "1.1em", flex: 1, color: "#E668A7" }}>{currentScene.name}</h3>
                {!showSidebar && pinkBtn("[ + ]", () => setShowSidebar(true))}
                {sceneNotes.length > 1 && (
                  <select
                    onChange={e => { if (e.target.value) moveSceneToSequence(currentScene.id, e.target.value); e.target.value = ""; }}
                    defaultValue=""
                    style={{
                      fontSize: "0.78em", padding: "4px 8px",
                      border: "1px solid #eb2e90", borderRadius: "12px",
                      backgroundColor: "#fec3e4", color: "#333", cursor: "pointer"
                    }}
                  >
                    <option value="">Move to...</option>
                    {sceneNotes.filter(s => s.id !== selectedSequenceId).map(s => (
                      <option key={s.id} value={s.id}>{sceneNotesSequenceLabel(s.name)}</option>
                    ))}
                  </select>
                )}
              </div>
              <RichTextEditor content={currentScene.content} onChange={updateSceneContent} />
            </>
          ) : (
            <div className="empty-state">Select a scene from the sidebar</div>
          )}
        </div>
      </div>
    </div>
  );
}
