function SceneListTab({ scenes, setScenes, nowState, setNowState, showToast }) {
  const [sequenceFilter, setSequenceFilter] = React.useState(() => localStorage.getItem("pickme_scene_sequence_focus") || "AUTO");
  const [activeId, setActiveId] = React.useState(null);
  const [titleDrafts, setTitleDrafts] = React.useState({});
  const [newChangeText, setNewChangeText] = React.useState("");
  const [focusSceneOnly, setFocusSceneOnly] = React.useState(() => localStorage.getItem("pickme_scene_focus_only") === "1");

  const state = normalizeState({ scenes });
  const allSceneCards = sortSceneCards(state.scenes.filter(card => !card.archived && !card.maybe && (card.kind === "SCENE" || card.kind === "TWEAK")));
  const counts = { UNPLACED:0, ALL:allSceneCards.length };
  SEQUENCE_ORDER.forEach(seq => counts[seq] = 0);
  allSceneCards.forEach(card => {
    if (card.sequence && counts[card.sequence] !== undefined) counts[card.sequence] += 1;
    else counts.UNPLACED += 1;
  });
  const firstFocusedSequence = (counts.UNPLACED > 0 && "UNPLACED") || SEQUENCE_ORDER.find(seq => counts[seq] > 0) || "ALL";
  const effectiveSequenceFilter = sequenceFilter === "AUTO" ? firstFocusedSequence : sequenceFilter;
  const sequenceLabel = effectiveSequenceFilter === "ALL" ? "All scenes" : effectiveSequenceFilter === "UNPLACED" ? "Unplaced" : SEQUENCE_TITLES[effectiveSequenceFilter];
  const filtered = allSceneCards.filter(card => {
    if (effectiveSequenceFilter === "UNPLACED" && card.sequence) return false;
    if (effectiveSequenceFilter !== "ALL" && effectiveSequenceFilter !== "UNPLACED" && (card.sequence || "") !== effectiveSequenceFilter) return false;
    return true;
  });
  const selected = filtered.find(card => card.id === activeId) || filtered[0] || null;
  const titleDraft = selected ? (titleDrafts[selected.id] !== undefined ? titleDrafts[selected.id] : selected.title) : "";
  const visibleChanges = selected ? safeArray(selected.changes).filter(change => !change.archived && !change.maybe) : [];
  const taskStats = (card) => {
    const tasks = safeArray(card && card.changes).filter(change => !change.archived && !change.maybe);
    return { total:tasks.length, complete:tasks.filter(change => !!change.done).length };
  };
  const selectedTaskStats = selected ? taskStats(selected) : { total:0, complete:0 };

  React.useEffect(() => {
    saveUiPreference("pickme_scene_sequence_focus", effectiveSequenceFilter);
  }, [effectiveSequenceFilter]);

  React.useEffect(() => {
    saveUiPreference("pickme_scene_focus_only", focusSceneOnly ? "1" : "0");
  }, [focusSceneOnly]);

  React.useEffect(() => {
    if (selected && activeId !== selected.id) setActiveId(selected.id);
    if (!selected && activeId) setActiveId(null);
  }, [selected && selected.id]); // eslint-disable-line

  const patchCard = (id, patch) => setScenes(prev => safeArray(prev).map(card => {
    if (asId(card.id) !== asId(id)) return card;
    const normalized = normalizeCard(card, 0);
    const nextPatch = typeof patch === "function" ? patch(normalized) : patch;
    return touchRecord(normalized, nextPatch);
  }));

  const saveTitle = () => {
    if (!selected) return;
    const nextTitle = titleDraft.trim();
    if (!nextTitle) {
      if (showToast) showToast("Scene title cannot be blank");
      return;
    }
    const previousTitle = String(selected.title || "").trim();
    patchCard(selected.id, card => {
      const formerTitles = safeArray(card.formerTitles);
      const shouldKeepFormer = previousTitle && normalizeTitle(previousTitle) !== normalizeTitle(nextTitle) && !formerTitles.some(title => normalizeTitle(title) === normalizeTitle(previousTitle));
      return {
        title: nextTitle,
        formerTitles: shouldKeepFormer ? [...formerTitles, previousTitle] : formerTitles
      };
    });
    setTitleDrafts(prev => {
      const copy = { ...prev };
      delete copy[selected.id];
      return copy;
    });
    if (showToast) showToast("Scene title saved");
  };

  const addScene = () => {
    const title = prompt("Scene title");
    if (!title || !title.trim()) return;
    const id = "card-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
    const sequence = SEQUENCE_ORDER.includes(effectiveSequenceFilter) ? effectiveSequenceFilter : null;
    const card = touchRecord(normalizeCard({ id, title:title.trim(), kind:"SCENE", status:"todo", sequence, changes:[], description:"" }, allSceneCards.length));
    setScenes(prev => [...safeArray(prev), card]);
    setActiveId(id);
    setFocusSceneOnly(false);
    if (showToast) showToast("Scene added");
  };

  const moveSelectedToSequence = (value) => {
    if (!selected) return;
    const sequence = value || null;
    patchCard(selected.id, { sequence });
    setSequenceFilter(sequence || "UNPLACED");
  };

  const addChange = () => {
    if (!selected) return;
    const text = newChangeText.trim();
    if (!text) return;
    patchCard(selected.id, card => {
      const next = normalizeCard(card, 0);
      ensureChange(next, "ADJUST", text, { id:"change-" + slugify(next.id) + "-" + Date.now().toString(36), isRewriteTask:true });
      return { changes:next.changes };
    });
    setNewChangeText("");
  };

  const patchChange = (changeId, patch) => {
    if (!selected) return;
    patchCard(selected.id, card => ({
      changes:safeArray(card.changes).map(change => asId(change.id) === asId(changeId) ? touchRecord(change, typeof patch === "function" ? patch(change) : patch) : change)
    }));
  };
  const toggleChangeDone = (changeId, done) => {
    if (!selected) return;
    patchCard(selected.id, card => applyChangeDone(card, changeId, done));
  };
  const archiveChange = (changeId) => {
    patchChange(changeId, archiveFields());
    if (showToast) showToast("Task archived");
  };

  const archiveSelected = () => {
    if (!selected || focusSceneOnly) return;
    if (!confirm("Archive this scene? It will move out of the main scene list. You can restore it later from Archive.")) return;
    setScenes(prev => archiveCardList(prev, selected.id));
    setActiveId(null);
    if (showToast) showToast("Scene archived");
  };

  const toggleFocus = () => setFocusSceneOnly(prev => !prev);

  return (
    <div className="scene-notebook">
      <div className="sequence-focus-bar">
        <div>
          <div className="sequence-kicker">Sequence</div>
          <select className="sequence-select" value={effectiveSequenceFilter} onChange={e => setSequenceFilter(e.target.value)}>
            <option value="UNPLACED">Unplaced</option>
            {SEQUENCE_ORDER.map(seq => <option key={seq} value={seq}>{SEQUENCE_TITLES[seq]}</option>)}
            <option value="ALL">All scenes</option>
          </select>
        </div>
        <div className="sequence-focus-actions">
          <button className="btn soft-pink-btn" onClick={toggleFocus}>{focusSceneOnly ? "SHOW SEQUENCE" : "FOCUS"}</button>
        </div>
      </div>

      <div className={focusSceneOnly ? "scene-workbench is-focused" : "scene-workbench"}>
        {!focusSceneOnly && (
          <div className="scene-list-panel" style={{border:"1px solid #E668A7",background:"#fff",padding:"12px"}}>
            <div className="scene-list-heading" style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"10px",marginBottom:"12px"}}>
              <div>
                <div className="scene-list-title" style={{fontWeight:800,color:"#E668A7",marginBottom:"4px"}}>{sequenceLabel}</div>
                <div className="scene-count" style={{fontSize:"0.86em",color:"#E668A7"}}>{filtered.length} of {allSceneCards.length} scenes</div>
              </div>
              <button className="btn soft-pink-btn icon-soft-btn" onClick={addScene} title="Add scene" aria-label="Add scene" style={{fontSize:"20px",lineHeight:"1",borderRadius:"0"}}>+</button>
            </div>

            <div className="scene-results" style={{maxHeight:"64vh",overflowY:"auto",WebkitOverflowScrolling:"touch",paddingRight:"4px"}}>
              {filtered.length === 0 && <div className="scene-empty-note">Nothing is in this sequence yet. Use + to add a scene here, or move an existing scene into this sequence.</div>}
              {filtered.map(card => {
                const stats = taskStats(card);
                const active = selected && selected.id === card.id;
                return (
                  <button
                    key={card.id}
                    className={active ? "scene-row is-active" : "scene-row"}
                    onClick={() => setActiveId(card.id)}
                    style={{width:"100%",textAlign:"left",display:"block",border:"1px solid #E668A7",background:active ? "#fff3f9" : "#fff",padding:"10px",marginBottom:"8px",cursor:"pointer"}}
                  >
                    <div className="scene-row-title" style={{fontWeight:800,color:"#E668A7",fontSize:"0.92em",lineHeight:"1.25"}}>{card.title || "Untitled"}</div>
                    <div className="scene-row-meta" style={{fontSize:"0.78em",color:"#E668A7",marginTop:"6px",textTransform:"uppercase",letterSpacing:"0.04em"}}>
                      {stats.total ? stats.complete + " / " + stats.total + " TASKS" : "NO TASKS YET"}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        <div className={focusSceneOnly ? "scene-editor-panel is-focused" : "scene-editor-panel"} style={{border:"1px solid #E668A7",background:"#fff",padding:"14px",minHeight:"420px",position:"relative"}}>
          {!selected ? (
            <div style={{fontSize:"0.95em",color:"#E668A7"}}>Pick a scene in this sequence, or use + to add one.</div>
          ) : (
            <>
              {!focusSceneOnly && <button className="scene-archive-text-btn" onClick={archiveSelected}>ARCHIVE SCENE</button>}
              <label className="scene-label" style={{display:"block",fontSize:"0.74em",fontWeight:800,letterSpacing:"0.08em",textTransform:"uppercase",color:"#E668A7",marginBottom:"5px",paddingRight:"120px"}}>Scene title</label>
              <div className="scene-title-row" style={{display:"grid",gridTemplateColumns:"1fr auto",gap:"8px",marginBottom:"8px"}}>
                <input
                  className="scene-title-input"
                  value={titleDraft}
                  onChange={e => setTitleDrafts(prev => ({ ...prev, [selected.id]:e.target.value }))}
                  onKeyDown={e => { if (e.key === "Enter") saveTitle(); }}
                  style={{fontSize:"18px",fontWeight:800,padding:"10px",border:"1px solid #E668A7",boxSizing:"border-box",width:"100%"}}
                />
                <button className="btn soft-pink-btn" disabled={!titleDraft.trim() || titleDraft.trim() === String(selected.title || "").trim()} onClick={saveTitle}>Save</button>
              </div>


              {!focusSceneOnly && (
                <>
                  <label className="scene-label" style={{display:"block",fontSize:"0.74em",fontWeight:800,letterSpacing:"0.08em",textTransform:"uppercase",color:"#E668A7",marginBottom:"5px"}}>Move to sequence</label>
                  <select value={selected.sequence || ""} onChange={e => moveSelectedToSequence(e.target.value)} style={{width:"100%",fontSize:"16px",padding:"10px",border:"1px solid #E668A7",boxSizing:"border-box",marginBottom:"14px"}}>
                    <option value="">Unplaced</option>
                    {SEQUENCE_ORDER.map(seq => <option key={seq} value={seq}>{SEQUENCE_TITLES[seq]}</option>)}
                  </select>
                </>
              )}

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:"10px",marginBottom:"8px"}}>
                <label className="scene-label" style={{display:"block",fontSize:"0.74em",fontWeight:800,letterSpacing:"0.08em",textTransform:"uppercase",color:"#E668A7"}}>TO-DO IN SCRIPT</label>
                <span className="scene-task-count" style={{fontSize:"0.78em",color:"#E668A7",fontWeight:800,textTransform:"uppercase"}}>{selectedTaskStats.complete} / {selectedTaskStats.total} TASKS</span>
              </div>
              {visibleChanges.length === 0 && <div className="scene-empty-note" style={{marginBottom:"10px"}}>No tasks yet. Use + to add one.</div>}
              {visibleChanges.map(change => (
                <div key={change.id} style={{display:"grid",gridTemplateColumns:"auto 1fr auto",gap:"8px",alignItems:"start",marginBottom:"8px"}}>
                  <input type="checkbox" checked={!!change.done} onChange={e => toggleChangeDone(change.id, e.target.checked)} style={{marginTop:"8px"}} />
                  <textarea className="scene-task-textarea" value={change.text} onChange={e => patchChange(change.id, { text:e.target.value })} rows={2} style={{border:"0.5px solid #F6A3CC",resize:"vertical",boxSizing:"border-box",width:"100%"}} />
                  <button className="btn soft-pink-btn icon-soft-btn archive-icon-btn" onClick={() => archiveChange(change.id)} title="Archive task" aria-label="Archive task"><ArchiveTrayIcon /></button>
                </div>
              ))}
              <div className="scene-change-row" style={{display:"grid",gridTemplateColumns:"auto 1fr auto",gap:"8px",marginBottom:"12px"}}>
                <span className="scene-task-spacer" aria-hidden="true"></span>
                <input
                  value={newChangeText}
                  onChange={e => setNewChangeText(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") addChange(); }}
                  placeholder="Add rewrite task"
                  className="scene-change-input"
                  style={{fontSize:"16px",padding:"10px",border:"0.5px solid #F6A3CC",boxSizing:"border-box",width:"100%"}}
                />
                <button className="btn soft-pink-btn icon-soft-btn" disabled={!newChangeText.trim()} onClick={addChange} title="Add task" aria-label="Add task" style={{fontSize:"20px",borderRadius:"0"}}>+</button>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}


function ScriptRailTab({ scenes, setScenes, nowState, setNowState }) {
  const [expanded, setExpanded] = React.useState({});
  const [collapsed, setCollapsed] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem("pickme_collapsed_sequences") || "{}"); } catch(e) { return {}; }
  });
  const [filter, setFilter] = React.useState("ALL");
  React.useEffect(() => { saveUiPreference("pickme_collapsed_sequences", JSON.stringify(collapsed)); }, [collapsed]);
  const state = normalizeState({ scenes });
  const cardOptions = state.scenes.filter(c => !c.archived && c.kind !== "DECISION" && c.kind !== "THREAD");
  const entries = [];
  state.scenes.forEach(card => {
    if (card.archived || card.maybe) return;
    if ((card.kind === "SCENE" || card.kind === "TWEAK") && (filter === "ALL" || safeArray(card.changes).some(ch => ch.verb === filter))) entries.push({ type:"card", id:card.id, card, sequence:card.sequence, page:card.page, order:card.order, title:card.title });
  });
  const sortEntries = list => [...list].sort((a, b) => (SEQUENCE_ORDER.indexOf(a.sequence) - SEQUENCE_ORDER.indexOf(b.sequence)) || ((a.page || 9999) - (b.page || 9999)) || ((a.order || 0) - (b.order || 0)) || String(a.title).localeCompare(String(b.title)));
  const bySeq = {};
  SEQUENCE_ORDER.forEach(seq => bySeq[seq] = []);
  const unplaced = [];
  entries.forEach(entry => entry.sequence && bySeq[entry.sequence] ? bySeq[entry.sequence].push(entry) : unplaced.push(entry));
  const patchCard = (id, patch) => setScenes(prev => safeArray(prev).map(card => card.id === id ? touchRecord(card, typeof patch === "function" ? patch(card) : patch) : card));
  const patchMoment = (cardId, momentId, patch) => setScenes(prev => safeArray(prev).map(card => card.id === cardId ? touchRecord(card, { moments:safeArray(card.moments).map(moment => moment.id === momentId ? touchRecord(moment, typeof patch === "function" ? patch(moment) : patch) : moment) }) : card));
  const addChange = (card, text) => {
    if (!text.trim()) return;
    setScenes(prev => safeArray(prev).map(c => {
      if (c.id !== card.id) return c;
      const next = normalizeCard(c, 0);
      ensureChange(next, "ADJUST", text.trim(), { id:"change-" + slugify(next.id) + "-" + slugify(text).slice(0, 36) });
      return touchRecord(next);
    }));
  };
  const renderEntry = entry => {
    const isCard = entry.type === "card";
    const card = entry.card;
    const moment = entry.moment;
    const rowId = isCard ? card.id : card.id + "::" + moment.id;
    const isOpen = !!expanded[rowId];
    const activeChanges = safeArray(card.changes).filter(ch => !ch.archived && !ch.maybe && (filter === "ALL" || ch.verb === filter));
    return (
      <div key={rowId} id={"rail-" + (isCard ? card.id : moment.id)} style={{border:"1px solid var(--border-pink)",background:"#fff",margin:"8px 0",padding:"10px"}}>
        <div style={{display:"grid",gridTemplateColumns:"14px auto 1fr auto",gap:"8px",alignItems:"center"}}>
          <span style={{width:"10px",height:"10px",borderRadius:"50%",background:card.status === "done" ? "#63B6A4" : "#DA005F"}} />
          <TypePill>{card.kind}</TypePill>
          <button onClick={() => setExpanded(prev => ({ ...prev, [rowId]:!isOpen }))} style={{background:"none",border:"none",textAlign:"left",fontWeight:800,color:"#1C1410",cursor:"pointer"}}>
            {isCard ? card.title : card.title + " / " + moment.label}
          </button>
          <button className="btn btn-secondary" onClick={() => setNowState({ cardId:card.id, subId:isCard && activeChanges[0] ? activeChanges[0].id : moment && moment.id, updatedAt:nowStamp(), updatedBy:getDeviceId() })}>Work this</button>
        </div>
        {isOpen && (
          <div style={{marginTop:"12px",paddingTop:"12px",borderTop:"1px solid #f6d0f6"}}>
            {isCard ? (
              <>
                <textarea value={card.description || ""} onChange={e => patchCard(card.id, { description:e.target.value })} style={{width:"100%",minHeight:"80px",fontSize:"16px",padding:"10px",boxSizing:"border-box",border:"1px solid var(--border-pink)"}} />
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:"8px",margin:"10px 0"}}>
                  <select value={card.sequence || ""} onChange={e => patchCard(card.id, { sequence:e.target.value || null })}>{["",...SEQUENCE_ORDER].map(seq => <option key={seq} value={seq}>{seq ? SEQUENCE_TITLES[seq] : "Unplaced"}</option>)}</select>
                  <input type="number" value={card.page || ""} onChange={e => patchCard(card.id, { page:e.target.value ? Number(e.target.value) : null })} placeholder="Page" />
                  <select value={card.kind} onChange={e => patchCard(card.id, { kind:e.target.value })}>{["SCENE","TWEAK"].map(k => <option key={k}>{k}</option>)}</select>
                  <select value={card.status} onChange={e => patchCard(card.id, { status:e.target.value })}>{STATUS_VALUES.map(s => <option key={s} value={s}>{displayStatusLabel(s)}</option>)}</select>
                </div>
                {safeArray(card.changes).length > 0 && <div style={{fontWeight:800,color:"var(--neon-pink)",margin:"12px 0 6px"}}>Changes</div>}
                {activeChanges.map(change => (
                  <div key={change.id} style={{display:"grid",gridTemplateColumns:"auto auto 1fr auto",gap:"8px",alignItems:"center",marginBottom:"7px"}}>
                    <input type="checkbox" checked={!!change.done} onChange={e => patchCard(card.id, c => applyChangeDone(c, change.id, e.target.checked))} />
                    <select value={change.verb} onChange={e => patchCard(card.id, c => ({ changes:safeArray(c.changes).map(ch => ch.id === change.id ? touchRecord(ch, { verb:e.target.value }) : ch) }))}>{CHANGE_VERBS.map(v => <option key={v}>{v}</option>)}</select>
                    <input value={change.text} onChange={e => patchCard(card.id, c => ({ changes:safeArray(c.changes).map(ch => ch.id === change.id ? touchRecord(ch, { text:e.target.value }) : ch) }))} />
                    {change.verb === "MOVE" && <select value={change.targetCardId || ""} onChange={e => patchCard(card.id, c => ({ changes:safeArray(c.changes).map(ch => ch.id === change.id ? touchRecord(ch, { targetCardId:e.target.value || null }) : ch) }))}><option value="">Move to...</option>{cardOptions.map(opt => <option key={opt.id} value={opt.id}>{opt.title}</option>)}</select>}
                  </div>
                ))}
                <input placeholder="Add a change..." onKeyDown={e => { if (e.key === "Enter") { addChange(card, e.currentTarget.value); e.currentTarget.value = ""; } }} style={{width:"100%",fontSize:"16px",padding:"9px",boxSizing:"border-box",border:"1px solid var(--border-pink)"}} />
                <button className="btn btn-secondary" style={{marginTop:"10px"}} onClick={() => setScenes(prev => archiveCardList(prev, card.id))}>Archive</button>
              </>
            ) : (
              <div>
                <label><input type="checkbox" checked={!!moment.done} onChange={e => patchMoment(card.id, moment.id, { done:e.target.checked })} /> Complete</label>
                <div style={{display:"grid",gridTemplateColumns:"1fr 90px",gap:"8px",marginTop:"10px"}}>
                  <select value={moment.sequence || ""} onChange={e => patchMoment(card.id, moment.id, { sequence:e.target.value || null })}>{["",...SEQUENCE_ORDER].map(seq => <option key={seq} value={seq}>{seq ? SEQUENCE_TITLES[seq] : "Unplaced"}</option>)}</select>
                  <input type="number" value={moment.page || ""} onChange={e => patchMoment(card.id, moment.id, { page:e.target.value ? Number(e.target.value) : null })} placeholder="Page" />
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    );
  };
  const sequenceBlock = (seq, list) => {
    const openCount = list.filter(entry => entry.type === "moment" ? !entry.moment.done : entry.card.status !== "done").length;
    return (
      <div key={seq} style={{marginTop:"18px"}}>
        <button onClick={() => setCollapsed(prev => ({ ...prev, [seq]:!prev[seq] }))} style={{position:"sticky",top:"54px",zIndex:4,width:"100%",textAlign:"left",background:"#f6d0f6",color:"#DA005F",border:"1px solid #DA005F",padding:"9px 12px",fontWeight:800}}>
          {SEQUENCE_TITLES[seq]} - {openCount} open
        </button>
        {!collapsed[seq] && sortEntries(list).map(renderEntry)}
      </div>
    );
  };
  return (
    <div>
      <NowBar scenes={scenes} setScenes={setScenes} nowState={nowState} setNowState={setNowState} />
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"12px"}}>
        {["ALL",...CHANGE_VERBS].map(v => <button key={v} className={filter===v ? "btn btn-primary" : "btn btn-secondary"} onClick={() => setFilter(v)}>{v === "ALL" ? "All changes" : v}</button>)}
      </div>
      <div style={{border:"1px solid var(--border-pink)",background:"#fff",padding:"10px",marginBottom:"14px"}}>
        <button onClick={() => setCollapsed(prev => ({ ...prev, unplaced:!prev.unplaced }))} style={{background:"none",border:"none",fontWeight:800,color:"#8B0040",cursor:"pointer"}}>UNPLACED - {unplaced.length}</button>
        {!collapsed.unplaced && sortEntries(unplaced).map(renderEntry)}
      </div>
      {SEQUENCE_ORDER.map(seq => sequenceBlock(seq, bySeq[seq]))}
    </div>
  );
}

function BoardV2Tab({ scenes, setScenes }) {
  const [filter, setFilter] = React.useState("All");
  const filtered = normalizeState({ scenes }).scenes.filter(card => {
    if (filter === "All") return !card.archived;
    if (filter === "Maybe") return card.maybe && !card.archived;
    if (filter === "Archived") return card.archived;
    return card.kind === filter.toUpperCase() && !card.archived;
  });
  const quickAdd = () => {
    const title = prompt("New tweak title");
    if (!title || !title.trim()) return;
    setScenes(prev => [...safeArray(prev), touchRecord(normalizeCard({ id:"card-" + Date.now(), title:title.trim(), kind:"TWEAK", status:"drafted", sequence:null }, safeArray(prev).length))]);
  };
  return (
    <div>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"14px"}}>
        {["All","Scene","Tweak","Maybe","Archived"].map(f => <button key={f} className={filter===f ? "btn btn-primary" : "btn btn-secondary"} onClick={() => setFilter(f)}>{f}</button>)}
        <button className="btn btn-primary" onClick={quickAdd}>Quick add</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:"12px"}}>
        {filtered.map(card => (
          <div key={card.id} style={{border:"1px solid var(--border-pink)",background:"#fff",padding:"12px"}}>
            <TypePill>{card.maybe ? "MAYBE" : card.kind}</TypePill>
            <div style={{fontWeight:800,color:"#1C1410",marginTop:"8px"}}>{card.title}</div>
            <div style={{fontSize:"0.84em",color:"var(--text-light)",marginTop:"6px"}}>{card.sequence ? SEQUENCE_TITLES[card.sequence] : "Unplaced"}</div>
            <div style={{fontSize:"0.84em",whiteSpace:"pre-wrap",marginTop:"8px"}}>{card.description}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ArchiveTab({ scenes, setScenes, sequences, showToast }) {
  const buckets = collectArchiveBuckets(scenes);
  const totalArchived = buckets.archivedCards.length + buckets.archivedTaskRows.length + buckets.archivedMomentRows.length;
  const totalCompleted = buckets.completedSceneCards.length + buckets.completedTaskRows.length + buckets.completedMomentRows.length;
  const patchCard = (id, patch) => setScenes(prev => safeArray(prev).map(card => {
    if (asId(card.id) !== asId(id)) return card;
    const normalized = normalizeCard(card, 0);
    const nextPatch = typeof patch === "function" ? patch(normalized) : patch;
    return touchRecord(normalized, nextPatch);
  }));
  const patchChange = (cardId, changeId, patch) => patchCard(cardId, card => ({
    changes:safeArray(card.changes).map(change => asId(change.id) === asId(changeId) ? touchRecord(change, typeof patch === "function" ? patch(change) : patch) : change)
  }));
  const patchMoment = (cardId, momentId, patch) => patchCard(cardId, card => ({
    moments:safeArray(card.moments).map(moment => asId(moment.id) === asId(momentId) ? touchRecord(moment, typeof patch === "function" ? patch(moment) : patch) : moment)
  }));
  const archiveCard = (id) => {
    patchCard(id, archiveFields());
    if (showToast) showToast("Archived");
  };
  const restoreCard = (id) => {
    patchCard(id, restoreFields());
    if (showToast) showToast("Restored");
  };
  const reopenCard = (id) => {
    patchCard(id, restoreFields({ status:"todo", resolvedAt:null }));
    if (showToast) showToast("Reopened");
  };
  const archiveTask = (cardId, changeId) => {
    patchChange(cardId, changeId, archiveFields());
    if (showToast) showToast("Task archived");
  };
  const restoreTask = (cardId, changeId) => {
    patchChange(cardId, changeId, restoreFields());
    if (showToast) showToast("Task restored");
  };
  const reopenTask = (cardId, changeId) => {
    patchChange(cardId, changeId, restoreFields({ done:false }));
    patchCard(cardId, card => card.status === "done" ? { status:"todo" } : {});
    if (showToast) showToast("Task reopened");
  };

  const [view,setView]=React.useState('Overview'),[template,setTemplate]=React.useState(PP_TEMPLATES[0]),[error,setError]=React.useState('');

  const patch=change=>setRecords(old=>old.map(row=>row.id===s.id?touchRecord(row,typeof change==='function'?change(row):change):row));
  const update=(collection,id,change)=>patch(current=>({[collection]:current[collection].map(row=>{if(row.id!==id)return row;const next={...change};if(collection==='donors'){const count=next.count??row.count;next.secured=Math.min(count,next.secured??row.secured);}return touchRecord(row,next);})}));
  const add=(collection,row)=>patch(current=>({[collection]:[...current[collection],ppNew(collection,{...row,id:FilmFinance.id(collection)})]}));
  const archive=(collection,id)=>update(collection,id,archiveFields());
  const tools=<div className="pp-toolbar"><select value={template} aria-label="Scenario template" onChange={event=>setTemplate(event.target.value)}>{PP_TEMPLATES.map(name=><option key={name}>{name}</option>)}</select><button className="pp-quiet" onClick={create}>+ Scenario</button><button className="pp-quiet" onClick={()=>file.current.click()}>Import JSON</button><input ref={file} type="file" accept=".json,application/json" hidden onChange={async event=>{const input=event.target;const chosen=input.files?.[0];input.value='';if(!chosen)return;try{if(chosen.size>10000000)throw new Error('Import must be under 10 MB.');const next=touchRecord(FilmFinance.validate(JSON.parse(await chosen.text())),{createdAt:nowStamp(),archived:false});setRecords(old=>[...old,next]);setSelected(next.id);setError('');showToast('Scenario imported');}catch(e){setError(e.message);}}} /></div>;

function PPArchives({records,setRecords}) {
  const archived=[];
  const add=(record,path,item,label)=>archived.push({record,path,item,label});
  safeArray(records).forEach(record=>{
    if(record.archived){add(record,[],record,record.title||record.name);return;}
    ['changes','budget','sources','incentives','claims','participants','rights','donors'].forEach(key=>safeArray(record[key]).filter(row=>row.archived).forEach(row=>add(record,[key],row,(record.title||record.name)+' / '+(row.name||row.text||key))));
    ['rows','columns'].forEach(key=>safeArray(record.table?.[key]).filter(row=>row.archived).forEach(row=>add(record,['table',key],row,(record.title||record.name)+' / table '+(row.label||key))));
  });
  const restore=entry=>setRecords(old=>old.map(record=>{
    if(record.id!==entry.record.id)return record;
    if(!entry.path.length)return touchRecord(record,restoreFields());
    if(entry.path[0]==='table'){const key=entry.path[1];return touchRecord(record,{table:{...record.table,[key]:record.table[key].map(item=>item.id===entry.item.id?touchRecord(item,restoreFields()):item)}});}
    const key=entry.path[0],ids=new Set([entry.item.id]);
    if(key==='budget'){let row=record.budget.find(row=>row.id===entry.item.id);while(row?.parentId){ids.add(row.parentId);row=record.budget.find(other=>other.id===row.parentId);}}
    return touchRecord(record,{[key]:record[key].map(item=>ids.has(item.id)?touchRecord(item,restoreFields()):item)});
  }));
  return <div className="settings-block"><div className="settings-block-title">Archived Preproduction Items</div><details><summary>Cards, prospects & financing ({archived.length})</summary>{archived.map(entry=><div key={entry.record.id+entry.path.join('.')+entry.item.id} className="pp-archive-row"><span>{entry.label}</span><button className="btn btn-secondary" onClick={()=>restore(entry)}>Restore</button></div>)}</details></div>;
}

      return { result, state };
    }).then(outcome => {
      if (!outcome || generation !== saveGenerationRef.current) return;
      pendingLocalSaveRef.current = false;
      if (outcome.result.conflicts.length) {
        preserveConflictDraft(parts);
        setWindowConflict(outcome.result.conflicts);
        return;
      }
      lastAppliedStateRef.current = outcome.state;
      if (outcome.result.externalChanges) applyIncomingState(outcome.state);
      if (windowConflict) setWindowConflict(null);
      window.dispatchEvent(new Event("notesUpdated"));
      if (window.__pickmeSkipNextDropboxPush) window.__pickmeSkipNextDropboxPush = false;
      else {
        if (DBX.isConnected()) window.dispatchEvent(new CustomEvent("dbxSyncStatus", { detail:"pending" }));
        scheduleDropboxPush();
      }
    }).catch(error => {
      if (generation !== saveGenerationRef.current) return;
      pendingLocalSaveRef.current = false;
      console.error("Browser save failed:", error);
      preserveConflictDraft(parts);
      window.dispatchEvent(new CustomEvent("pickme_storage_error"));
    });
  }, [songs, scenes, notecards, preproduction, notes, sequences, sceneNotes, categoryNames, ideaCategoryNames, notionUrl, nowState, conversionReport]); // eslint-disable-line

  // ── Listen for dbxSyncStatus events (from auto-push/pull) ───────────────
  React.useEffect(() => {
    const handler = e => {
      setDbxSyncStatus(e.detail);
      if (e.detail === "idle") setLastSynced(String(e.syncedAt || localStorage.getItem(LAST_SYNCED_KEY) || ""));
    };
    window.addEventListener('dbxSyncStatus', handler);
    return () => window.removeEventListener('dbxSyncStatus', handler);
  }, []);

  // ── Listen for dbxStatusChanged (connect/disconnect) ────────────────────
  React.useEffect(() => {
    const handler = () => setDbxConnected(DBX.isConnected());
    window.addEventListener('dbxStatusChanged', handler);
    return () => window.removeEventListener('dbxStatusChanged', handler);
  }, []);

  const applyIncomingState = React.useCallback(input => {
    const d = normalizeState(input);
    lastAppliedStateRef.current = d;
    _skipPushRef.current = true;
    clearTimeout(_dbxPushTimer);
    ReactDOM.unstable_batchedUpdates(() => {
      setSongs(activeRecords(d.songs));
      setScenes(getSceneCardsForSavedState(d));
      setNotecards(d.notecards);
      setPreproduction(d.preproduction);
      setNotes(activeRecords(d.notes));
      setSequences(d.sequences);
      setSceneNotes(d.sceneNotes);
      setCategoryNames(d.categoryNames || {});
      setIdeaCategoryNames(d.ideaCategoryNames || {});
      setNotionUrl(d.notionUrl);
      setNowState(d.now);
      setConversionReport(d.conversionReport);
      setLastSynced(localStorage.getItem(LAST_SYNCED_KEY) || "");
    });
  }, []);

  React.useEffect(() => {
    const fromDropbox = event => {
      const newest = loadCanonicalStateFromStorage();
      if (hasActiveEditorField() || conflictDraftRef.current || pendingLocalSaveRef.current) { pendingWindowStateRef.current = newest; return; }
      applyIncomingState(newest);
    };
    window.addEventListener("pickme_state_updated", fromDropbox);
    return () => window.removeEventListener("pickme_state_updated", fromDropbox);
  }, [applyIncomingState]);

  React.useEffect(() => {
    const receive = input => {
      if (!input) return;
      const saved = loadCanonicalStateFromStorage();
      // Broadcasts announce a committed write; shared storage remains authoritative.
      const newest = saved;
      if (sameSavedValue(newest, lastAppliedStateRef.current)) return;
      if (hasActiveEditorField() || conflictDraftRef.current || pendingLocalSaveRef.current) { pendingWindowStateRef.current = newest; return; }
      applyIncomingState(newest);
    };
    const onStorage = event => {
      if (event.key !== PICKME_STATE_KEY || !event.newValue) return;
      try { receive(JSON.parse(event.newValue)); } catch (error) { console.warn("Window update could not be read:", error); }
    };
    const onMessage = event => {
      if (event.data && event.data.from !== PICKME_WINDOW_ID) receive(event.data.state);
    };
    const onFocusOut = () => setTimeout(() => {
      if (hasActiveEditorField() || conflictDraftRef.current || pendingLocalSaveRef.current || !pendingWindowStateRef.current) return;
      const pending = pendingWindowStateRef.current;
      pendingWindowStateRef.current = null;
      receive(pending);
    }, 0);
    const onBeforeUnload = event => {
      if (!conflictDraftRef.current) return;
      event.preventDefault();
      event.returnValue = "";
    };
    window.addEventListener("storage", onStorage);
    document.addEventListener("focusout", onFocusOut);
    window.addEventListener("beforeunload", onBeforeUnload);
    if (pickmeWindowChannel) pickmeWindowChannel.addEventListener("message", onMessage);
    return () => {
      window.removeEventListener("storage", onStorage);
      document.removeEventListener("focusout", onFocusOut);
      window.removeEventListener("beforeunload", onBeforeUnload);
      if (pickmeWindowChannel) pickmeWindowChannel.removeEventListener("message", onMessage);
    };
  }, [applyIncomingState]);

  const downloadConflictDraft = () => {
    const draft = normalizeState({ ...loadCanonicalStateFromStorage(), ...(conflictDraftRef.current || {}) });
    downloadJsonFile(draft, "pickme_window_conflict_draft_" + Date.now() + ".json");
  };
  const resolveWindowConflict = async keepMine => {
    if (keepMine && conflictDraftRef.current) {
      const draft = conflictDraftRef.current;
      const saved = await withStateWriteLock(() => {
        const result = rebaseEditorState(draft, lastAppliedStateRef.current, true);
        return saveCanonicalState(result.state);
      });
      conflictDraftRef.current = null;
      setWindowConflict(null);
      applyIncomingState(saved);
      scheduleDropboxPush();
    } else {
      conflictDraftRef.current = null;
      setWindowConflict(null);
      applyIncomingState(loadCanonicalStateFromStorage());
    }
    conflictSnapshotQueueRef.current = conflictSnapshotQueueRef.current.catch(() => {}).then(() => deleteSnapshot(WINDOW_CONFLICT_BACKUP_KEY));
    conflictSnapshotQueueRef.current.catch(error => console.warn("Edit draft cleanup failed:", error));
    setConflictBackupError(false);
    pendingWindowStateRef.current = null;
  };
  const getCoordinatedState = () => {
    const parts = { songs, scenes, notecards, preproduction, notes, sequences, sceneNotes, categoryNames, ideaCategoryNames, notionUrl, now:nowState, conversionReport };
    const result = rebaseEditorState(parts, lastAppliedStateRef.current, false);
    if (!result.conflicts.length) return result.state;
    preserveConflictDraft(parts);
    setWindowConflict(result.conflicts);
    return null;
  };
  const waitForLocalSave = async () => {
    await new Promise(resolve => setTimeout(resolve, 0));
    while (pendingLocalSaveRef.current) await new Promise(resolve => setTimeout(resolve, 20));
    return !conflictDraftRef.current;
  };

  const completePendingUpdate = (downloadConfirmed) => {
    if (!pendingUpdate) return;
    localStorage.setItem(PREUPDATE_BACKUP_KEY, JSON.stringify(pendingUpdate.raw || pendingUpdate.state));
    const groups = findDuplicateCardGroups(pendingUpdate.state);
    if (groups.length || pendingUpdate.forceDuplicateReview) {
      setDuplicateReview(pendingUpdate.state);
      setPendingUpdate(null);
      return;
    }
    const migrated = migrateStateToV2(pendingUpdate.state);
    saveCanonicalState(migrated);
    ReactDOM.unstable_batchedUpdates(() => {
      setSongs(activeRecords(migrated.songs));
      setScenes(migrated.scenes);
      setNotecards(migrated.notecards);
      setPreproduction(migrated.preproduction);
      setNotes(activeRecords(migrated.notes));
      setSequences(migrated.sequences);
      setSceneNotes(migrated.sceneNotes);
      setCategoryNames(migrated.categoryNames);
      setIdeaCategoryNames(migrated.ideaCategoryNames);
      setNotionUrl(migrated.notionUrl || notionUrl);
      setNowState(migrated.now);
      setConversionReport(migrated.conversionReport);
      setActiveTab("companion");
      setPendingUpdate(null);
    });
  };

  const finishDuplicateReview = (choices) => {
    const cleaned = applyDuplicateChoices(duplicateReview || loadCanonicalStateFromStorage(), choices);
    const migrated = migrateStateToV2(cleaned);
    saveCanonicalState(migrated);
    ReactDOM.unstable_batchedUpdates(() => {
      setSongs(activeRecords(migrated.songs));
      setScenes(migrated.scenes);
      setNotecards(migrated.notecards);
      setPreproduction(migrated.preproduction);
      setNotes(activeRecords(migrated.notes));
      setSequences(migrated.sequences);
      setSceneNotes(migrated.sceneNotes);
      setCategoryNames(migrated.categoryNames);
      setIdeaCategoryNames(migrated.ideaCategoryNames);
      setNotionUrl(migrated.notionUrl || notionUrl);
      setNowState(migrated.now);
      setConversionReport(migrated.conversionReport);
      setActiveTab("companion");
      setDuplicateReview(null);
    });
  };

  // ── Auto-pull: on boot + every 10s + on tab visibility ──────────────────
  React.useEffect(() => {
    if (!dbxConnected) return;
    
    function isUserTyping() {
      const active = document.activeElement;
      return active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
    }
    
    // Boot pull
    (async () => {
      if (isUserTyping()) return;
      window.dispatchEvent(new CustomEvent('dbxSyncStatus', { detail: 'syncing' }));
      await performDropboxPull();
    })();
    
    const iv = setInterval(async () => {
      if (document.hidden || isUserTyping()) return;
      window.dispatchEvent(new CustomEvent('dbxSyncStatus', { detail: 'syncing' }));
      await performDropboxPull();
    }, 10000);
    
    const onVis = async () => {
      if (!document.hidden && !isUserTyping()) {
        window.dispatchEvent(new CustomEvent('dbxSyncStatus', { detail: 'syncing' }));
        await performDropboxPull();
      }
    };
    
    document.addEventListener('visibilitychange', onVis);
    return () => { clearInterval(iv); document.removeEventListener('visibilitychange', onVis); };
  }, [dbxConnected]); // eslint-disable-line

  // ── Handle Dropbox OAuth callback on page load ──────────────────────────
  React.useEffect(() => {
    (async () => {
      try {
        const justConnected = await DBX.handleCallback();
        if (justConnected) {
          window.dispatchEvent(new Event("dbxStatusChanged"));
          // dbxConnected reactive effect handles boot pull
        }
      } catch(e) { console.warn("DBX callback:", e); }
    })();
  }, []); // eslint-disable-line

  const { msg: toastMsg, visible: toastVisible, show: showToast } = useToast();

  const [showSequenceBar, setShowSequenceBar] = useState(true);

  const SIMPLE_TABS = [
    { id: "companion",  label: "Companion" },
    { id: "preproduction", label: "Preproduction" },
    { id: "archive",    label: "Archive" },
    { id: "notes",      label: "Scene Notes" },
    { id: "playlist",   label: "The Playlist" },
    { id: "settings",   label: "Settings" },
  ];
  const ADVANCED_TABS = [
    { id: "script",    label: "Script Rail" },
    { id: "scenes",    label: "Board" },
    { id: "progress",  label: "Previous Progress" },
    { id: "question",  label: "Scene Question" },
    { id: "eval",      label: "Scene Evaluation" },
    { id: "ritual",    label: "Pre-Writing Ritual" },
  ];
  const TABS = showAdvancedTabs
    ? [SIMPLE_TABS[0], ...ADVANCED_TABS, ...SIMPLE_TABS.slice(1)]
    : SIMPLE_TABS;
  const showGlobalSequenceProgress = !["companion", "preproduction"].includes(activeTab);
  const syncError = storageError || dbxSyncStatus === "error";
  const syncLabel = storageError === "quota" ? "Browser storage full" : storageError ? "Browser save failed" : dbxConnected ? (dbxSyncStatus === "pending" ? "Saved locally · Dropbox pending" : dbxSyncStatus === "syncing" ? "Saved locally · Dropbox syncing" : dbxSyncStatus === "error" ? "Saved locally · Dropbox sync failed" : lastSynced ? "Dropbox synced " + formatDateShort(Number(lastSynced)) : "Dropbox connected · not yet synced") : "Saved in this browser";

  return (
    <div className="container">
      <div className="header">
        <div className="header-lip">💋</div>
        <h1>Pick Me Writers Assistant</h1>
        <div className="header-sub">a tool for the film by april korto quioh</div>
      </div>

      <div className="tabs">
        <select
          className="tab-select"
          value={activeTab}
          onChange={e => setActiveTab(e.target.value)}
        >
          {TABS.map(t => (
            <option key={t.id} value={t.id}>
              {t.label}
            </option>
          ))}
        </select>
      </div>

      {storageError && (
        <div role="alert" style={{background:"#fff",border:"1px solid #111",padding:"12px 16px",marginBottom:"16px",color:"#111"}}>
          {storageError === "quota" ? "Browser storage is full. Your edit is held in this tab while a recovery snapshot is saved; other tabs may not see it. Keep this tab open and download a backup now." : "This browser could not save your latest changes. Keep this page open and download a backup now."}
          <button type="button" className="btn btn-secondary" style={{marginLeft:"12px"}}
            onClick={() => downloadJsonFile(normalizeState({ ...loadCanonicalStateFromStorage(), ...(conflictDraftRef.current || {}) }), exportFilename())}>Download backup</button>
        </div>
      )}

      {coordinationUnavailable && (
        <div role="alert" style={{background:"#fff",border:"1px solid #111",padding:"12px 16px",marginBottom:"16px",color:"#111"}}>
          This browser cannot coordinate edits across tabs. Keep Pick Me open in one tab at a time.
        </div>
      )}

      {recoveryDrafts.length > 0 && !windowConflict && (
        <div role="alert" style={{background:"#FFFFFF",border:"2px solid #C3578D",padding:"14px 16px",marginBottom:"16px",color:"#000000"}}>
          {recoveryDrafts.length} unsaved edit draft{recoveryDrafts.length === 1 ? "" : "s"} from an earlier session. Download each before dismissing it.
          {recoveryDrafts.map((draft, index) => <div key={draft.key} style={{display:"flex",flexWrap:"wrap",gap:"8px",marginTop:"10px"}}>
            <button type="button" className="btn btn-secondary" onClick={() => downloadJsonFile(draft.state, "pickme_recovered_draft_" + (index + 1) + "_" + Date.now() + ".json")}>Download draft {index + 1}</button>
            <button type="button" className="btn btn-secondary" onClick={() => {
              setRecoveryDrafts(previous => previous.filter(item => item.key !== draft.key));
              deleteSnapshot(draft.key).catch(error => console.warn("Edit draft cleanup failed:", error));
            }}>Dismiss {index + 1}</button>
          </div>)}
        </div>
      )}

      {windowConflict && (
        <div role="alert" style={{background:"#FFFFFF",border:"2px solid #C3578D",padding:"14px 16px",marginBottom:"16px",color:"#000000"}}>
          <strong>EDIT CONFLICT</strong> A newer saved version changed {windowConflict[0]}. It may have come from Dropbox or another window. Your edit is still here and has not overwritten it.
          {conflictBackupError && <div>Automatic draft backup failed. Download your draft before leaving this page.</div>}
          <div style={{display:"flex",flexWrap:"wrap",gap:"8px",marginTop:"10px"}}>
            <button type="button" className="btn btn-secondary" onClick={downloadConflictDraft}>Download my draft</button>
            <button type="button" className="btn btn-secondary" onClick={() => resolveWindowConflict(true)}>Keep my edit</button>
            <button type="button" className="btn btn-secondary" onClick={() => resolveWindowConflict(false)}>Use newer edit</button>
          </div>
        </div>
      )}
      {showGlobalSequenceProgress && showSequenceBar && (
        <div className="progress-bar-container">
          {(() => {
            const totalProgress = companionScriptProgress(sequences);
            return <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:"0.9em",fontWeight:600,color:"#965B78",marginBottom:"6px"}}>{totalProgress.label}</div>
              <div style={{width:"100%",height:"8px",backgroundColor:"#F8EAF1",borderRadius:"4px",overflow:"hidden"}}>
                <div style={{height:"100%",width:(totalProgress.percent === null ? 0 : totalProgress.percent) + "%",backgroundColor:"#DCA2BF",transition:"width 0.3s ease"}} />
              </div>
            </div>;
          })()}
          <button className="progress-toggle-btn" onClick={() => setShowSequenceBar(false)} title="Hide progress">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 3 L5 7 L9 3" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
        </div>
      )}

      {showGlobalSequenceProgress && !showSequenceBar && (
        <div style={{display: "flex", justifyContent: "flex-end", marginBottom: "20px"}}>
          <button className="progress-toggle-btn" onClick={() => setShowSequenceBar(true)} title="Show progress">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 7 L5 3 L9 7" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
        </div>
      )}

      <div className="card">
        <div role="status" className="global-sync-status" style={{color:syncError ? "#000000" : "#C3578D",fontSize:"0.75rem",margin:"0 0 12px",textAlign:"right"}}>
          {syncLabel}
        </div>
        {activeTab === "companion" && (
          <ScriptCompanionTab scenes={scenes} setScenes={setScenes} notecards={notecards} setNotecards={setNotecards} sequences={sequences} setSequences={setSequences} ideaCategoryNames={ideaCategoryNames} setIdeaCategoryNames={setIdeaCategoryNames} showToast={showToast} syncLabel={syncLabel} syncError={syncError} />
        )}
        {activeTab === "preproduction" && <PreproductionTab records={preproduction} setRecords={setPreproduction} showToast={showToast} waitForLocalSave={waitForLocalSave} />}
        {activeTab === "script" && (
          <ScriptRailTab scenes={scenes} setScenes={setScenes} nowState={nowState} setNowState={setNowState} />
        )}
        {activeTab === "progress" && (
          <ProgressV2Tab scenes={scenes} sequences={sequences} setSequences={setSequences} />
        )}
        {activeTab === "archive" && (
          <ArchiveTab scenes={scenes} setScenes={setScenes} sequences={sequences} showToast={showToast} />
        )}
        {activeTab === "playlist" && (
          <PlaylistTab songs={songs} setSongs={setSongs} notionUrl={notionUrl} showToast={showToast} />
        )}
        {activeTab === "eval" && (
          <EvalTab notionUrl={notionUrl} showToast={showToast} />
        )}
        {activeTab === "scenes" && (
          <BoardV2Tab scenes={scenes} setScenes={setScenes} />
        )}
        {activeTab === "ritual" && (
          <PreWritingRitualTab />
        )}
        {activeTab === "question" && (
          <SceneQuestionTab />
        )}
        {activeTab === "notes" && (
          <SceneNotesTab sceneNotes={sceneNotes} setSceneNotes={setSceneNotes} sequences={sequences} setSequences={setSequences} showToast={showToast} />
        )}
        {activeTab === "settings" && (
          <SettingsTab preproduction={preproduction} setPreproduction={setPreproduction} notionUrl={notionUrl} setNotionUrl={setNotionUrl} songs={songs} scenes={scenes} notecards={notecards} notes={notes} sequences={sequences} sceneNotes={sceneNotes} categoryNames={categoryNames} setCategoryNames={setCategoryNames} setIdeaCategoryNames={setIdeaCategoryNames} setSongs={setSongs} setScenes={setScenes} setNotecards={setNotecards} setNotes={setNotes} setSequences={setSequences} setSceneNotes={setSceneNotes} nowState={nowState} setNowState={setNowState} conversionReport={conversionReport} setConversionReport={setConversionReport} lastSynced={lastSynced} setPendingUpdate={setPendingUpdate} showToast={showToast} showAdvancedTabs={showAdvancedTabs} setShowAdvancedTabs={setShowAdvancedTabs} getCoordinatedState={getCoordinatedState} waitForLocalSave={waitForLocalSave} />
        )}
      </div>

      {toastMsg ? <div className={`toast${toastVisible ? " show" : ""}`}>{toastMsg}</div> : null}
    </div>
  );
}

class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error:null };
  }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, details) { console.error("Pick Me app render failed:", error, details); }
  render() {
    if (!this.state.error) return this.props.children;
    return <div className="container"><section className="card" role="alert" style={{marginTop:"24px",border:"2px solid #C3578D"}}>
      <h1 style={{color:"#000000",fontSize:"1.2rem"}}>APP COULD NOT OPEN</h1>
      <p>Your saved work has not been cleared. Download a local backup before trying again.</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>
        <button type="button" className="btn btn-secondary" onClick={() => { const saved = loadRawSavedState(); if (saved) downloadJsonFile(saved, exportFilename()); }}>Download local backup</button>
        <button type="button" className="btn btn-secondary" onClick={() => location.reload()}>Reload</button>
      </div>
      <p style={{color:"#000000",fontSize:"0.8rem",overflowWrap:"anywhere"}}>{String(this.state.error.message || "Unknown render error")}</p>
    </section></div>;
  }
}

readSnapshot().then(snapshot => {
  const local = loadRawSavedState();
  if (snapshot && Number(snapshot.lastModified || 0) > Number(local && local.lastModified || 0)) {
    inMemorySavedState = snapshot;
  }
}).catch(error => console.warn("Browser snapshot unavailable:", error)).finally(() => {
  ReactDOM.render(<AppErrorBoundary><App /></AppErrorBoundary>, document.getElementById("root"));
});
</script>
<script>
  if (document.body.classList.contains('pwa-build') && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js?v=20261025-preproduction').then(registration => registration.update()).catch(() => {});
  }
</script>
</body>
</html>
